<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SlimePark</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#10141f;--card:#1b2133;--card2:#252d45;--tx:#eef2ff;--mu:#93a0c4;--ac:#5fe08a;--bd:#2f3857}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,Segoe UI,sans-serif;overflow:hidden;touch-action:none}
button,input,select{font:inherit;color:var(--tx)}
button{background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer}
button:hover{filter:brightness(1.2)}button.pri{background:var(--ac);color:#06210f;border:0;font-weight:700}button.dng{background:#d94444;border:0}
input{background:#0e1220;border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
[hidden]{display:none!important}
#auth{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#2c6b4a,#10141f 70%)}
.box{background:var(--card);padding:26px;border-radius:20px;width:min(360px,92vw);display:grid;gap:10px;box-shadow:0 20px 60px #0008;text-align:center}
.box h1{margin:0}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
header{position:fixed;top:0;left:0;right:0;height:52px;background:#141a2bdd;backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;padding:0 8px;z-index:5;overflow-x:auto}
header button{flex:none;padding:6px 10px}header b{flex:none}#pts{flex:none;background:#2b3558;border-radius:20px;padding:5px 12px;font-weight:700;color:#ffd23f}
#cv{position:fixed;top:52px;left:0;width:100%;height:calc(100% - 52px);display:block}
#joy{position:fixed;left:22px;bottom:28px;width:120px;height:120px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff40;z-index:3;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#ffffffaa}
#jump{position:fixed;right:24px;bottom:40px;width:84px;height:84px;border-radius:50%;background:#5fe08acc;color:#06210f;font-weight:800;border:0;z-index:3}
aside{position:fixed;top:52px;right:0;bottom:0;width:390px;max-width:100%;background:var(--card);z-index:6;display:flex;flex-direction:column;box-shadow:-10px 0 40px #0006}
#pbody{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
@media(max-width:700px){aside{top:auto;height:68%;border-radius:18px 18px 0 0}}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:120px}
.msg{display:flex;gap:8px;background:var(--card2);padding:7px 9px;border-radius:12px;font-size:14px}.msg.staff{border:1px solid #ff4d4d66;background:#3a2030}.msg.dev{border:1px solid #7fdcff88;background:#1d3548}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:#0e1220;display:grid;place-items:center;font-size:19px;cursor:pointer}
.tag{font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;margin-left:5px;background:#0006}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{background:var(--card2);border-radius:12px;padding:10px;display:grid;gap:6px;font-size:14px}.item small{color:var(--mu)}
.tabs{display:flex;gap:5px;flex-wrap:wrap}.tabs button.on{background:var(--ac);color:#06210f}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
#modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20}
.card{background:var(--card);border-radius:18px;padding:20px;width:min(340px,92vw);display:grid;gap:10px;text-align:center}
#game{position:fixed;inset:52px 0 0 0;background:#0b1020f2;z-index:15;display:flex;flex-direction:column;align-items:center;padding:14px;gap:10px;overflow:hidden}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(340px,92vw)}.mem div{aspect-ratio:1;background:var(--card2);border-radius:12px;display:grid;place-items:center;font-size:32px;cursor:pointer}.mem .up{background:#3b4a7a}
.petal{position:absolute;top:-40px;font-size:32px;cursor:pointer;animation:fall 4s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
h3{margin:4px 0}.mu{color:var(--mu);font-size:13px}
header{background:linear-gradient(90deg,#141a2bf0,#1c2a3ff0);border-bottom:1px solid var(--bd)}
button{transition:transform .1s,filter .15s}button:active{transform:scale(.94)}
aside{animation:sl .2s ease}@keyframes sl{from{transform:translateY(14px);opacity:0}}
#px{position:absolute;top:6px;right:8px;z-index:2;padding:2px 10px}#pbody{padding-top:38px}
.item,.msg{transition:transform .12s}.item:hover{transform:translateY(-2px)}
#emo{position:fixed;right:34px;bottom:136px;width:58px;height:58px;border-radius:50%;font-size:26px;z-index:3;padding:0}
#emw{position:fixed;right:100px;bottom:128px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);padding:8px;border-radius:16px;z-index:4;box-shadow:0 10px 30px #0008}#emw button{font-size:24px}
#toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);background:#000d;padding:10px 18px;border-radius:20px;z-index:30;opacity:0;transition:.3s;pointer-events:none;max-width:88vw;text-align:center}#toast.on{opacity:1}
@media(max-width:700px){#emo{right:20px;bottom:134px}#emw{right:84px}}
</style></head><body>
<div id="auth"><div class="box"><h1>🟢 SlimePark</h1><div class="mu">Bounce, chat, collect &amp; dress your slime</div>
<input id="au" placeholder="Username" autocomplete="username"><input id="ap" type="password" placeholder="Password (6+)" autocomplete="current-password">
<div class="row"><button class="pri" onclick="signIn()">Sign in</button><button onclick="signUp()">Sign up</button></div><div id="aerr" class="mu"></div></div></div>

<div id="app" hidden>
<header><b>🟢 SlimePark</b><span id="pts"></span><span id="online" class="mu" style="flex:none">🟢 1</span>
<button onclick="showPanel('chat')">💬</button><button onclick="showPanel('friends')">👥</button><button onclick="showPanel('market')">🛒</button><button onclick="showPanel('games')">🎮</button><button id="bstaff" onclick="showPanel('staff')" hidden>🛡</button><button onclick="showPanel('profile')">👤</button><button id="bmusic" onclick="toggleMusic()">🎵</button><button onclick="signOut()">⎋</button></header>
<canvas id="cv"></canvas>
<div id="joy"><i id="knob"></i></div><button id="jump">JUMP</button><button id="emo" title="Emotes">😀</button><div id="emw" hidden></div>
<aside id="panel" hidden><button id="px" onclick="showPanel(cur.p)">✕</button><div id="pbody"></div></aside>
</div>
<div id="modal" hidden></div><div id="game" hidden></div><audio id="aud" loop></audio>

<script>
// --- SUPABASE CONFIGURATION ---
const SUPABASE_URL='https://brvyjdtnxzjlrhukngjn.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydnlqZHRueHpqbHJodWtuZ2puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTAwMjcsImV4cCI6MjEwODA4NjAyN30.2ib-m3ju3SEhJLaQHQdA8xinenbtN5MltOatIYZSZIE';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id),W=900,H=560,DEVCODE='1357';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// --- ITEMS: [id,type,name,price,value,glow] ---
const ITEMS=[
['green','skin','Classic Green',0,'#6fdc6f'],['blue','skin','Ocean Blue',500,'#5aa9ff'],['pink','skin','Bubblegum',500,'#ff8fc8'],
['yellow','skin','Lemon',700,'#ffe45e'],['purple','skin','Grape',900,'#b278ff'],['orange','skin','Tangerine',1200,'#ffa24d'],['teal','skin','Mint',1500,'#4fe3c1'],
['lava','skin','Lava Aura',6000,'#ff5a2a','#ff7a30'],['aqua','skin','Aqua Aura',7500,'#2fd0ff','#66ffff'],['gold','skin','Golden Aura',10000,'#ffd23f','#ffcc33'],
['galaxy','skin','Galaxy Aura',12500,'#6a3df0','#b58cff'],['rainbow','skin','Rainbow Aura',15000,'#ff6ad5','#ffffff'],
['tuft','hair','Grass Tuft',600,'tuft'],['spike','hair','Spike Hair',1000,'spike'],['mohawk','hair','Mohawk',2000,'mohawk'],
['cap','hat','Red Cap',800,'cap'],['party','hat','Party Hat',1200,'party'],['tophat','hat','Top Hat',1800,'tophat'],['wizard','hat','Wizard Hat',3000,'wizard'],['crown','hat','Crown',5000,'crown'],['halo','hat','Halo',9000,'halo'],
['bowtie','bow','Bow Tie',700,'bowtie'],['ribbon','bow','Ribbon',900,'ribbon'],['tie','bow','Necktie',1500,'tie'],
['t1','title','Bouncy',1500,'Bouncy'],['t2','title','Gooey',3000,'Gooey'],['t3','title','Slimelord',8000,'Slimelord'],['t4','title','Goo Legend',15000,'Goo Legend'],
['a1','avatar','Cat',500,'🐱'],['a2','avatar','Frog',700,'🐸'],['a3','avatar','Fox',1000,'🦊'],['a4','avatar','Dragon',3000,'🐉'],['a5','avatar','Alien',5000,'👽'],
['f1','frame','Gold Ring',2000,'#ffd23f'],['f2','frame','Ruby Ring',3500,'#ff3b3b'],['f3','frame','Ice Ring',5000,'#7fdcff'],['f4','frame','Neon Ring',7000,'#b6ff3b'],['f5','frame','Royal Ring',12000,'#c07bff']];
const SEC={skin:'Slime Skins',hat:'Hats',hair:'Hair',bow:'Bows & Ties',title:'Titles',avatar:'Avatars',frame:'Frames'};
const SK={};ITEMS.filter(i=>i[1]=='skin').forEach(i=>SK[i[0]]=[i[4],i[5]]);
SK.dev=['#ffffff','#7fdcff'];SK.admin=['#15151a','#ff2020'];
const tcol=t=>t=='DEV'?'#7fdcff':t=='Admin'?'#ff4040':'#ffd23f';
const look=p=>({n:p.username,t:p.title,skin:p.skin,hat:p.hat,hair:p.hair,bow:p.bow});
const isDev=()=>me&&me.dev_on,isStaff=()=>me&&(me.dev_on||me.role=='admin');

// --- STATE ---
let emoK='',emoT=0,me=null,ch,others={},friendIds=[],cur={p:null,chat:null},mk={tab:'skin',try:{}},bub='',bubT=0,mins=0,msgSub,setSub;
const P={x:450,y:330,z:0,vz:0,mv:false},keys={},joy={x:0,y:0};

// --- AUTH ---
const mail=u=>u.toLowerCase()+'@slimepark.app';
const err=t=>$('aerr').textContent=t;
async function signUp(){const u=$('au').value.trim(),p=$('ap').value;
 if(!/^[A-Za-z0-9_]{3,16}$/.test(u))return err('Username: 3-16 letters, numbers or _');if(p.length<6)return err('Password needs 6+ characters');
 const{data:ex}=await db.from('profiles').select('id').ilike('username',u).maybeSingle();if(ex)return err('Username taken');
 const{data,error}=await db.auth.signUp({email:mail(u),password:p});if(error)return err(error.message);
 if(!data.session){const r=await db.auth.signInWithPassword({email:mail(u),password:p});if(r.error)return err('Disable "Confirm email" in Supabase Auth settings');}
 const{data:s}=await db.auth.getSession();const{error:e2}=await db.from('profiles').insert({id:s.session.user.id,username:u});if(e2)return err(e2.message);boot();}
async function signIn(){const u=$('au').value.trim(),p=$('ap').value;const{error}=await db.auth.signInWithPassword({email:mail(u),password:p});if(error)return err('Wrong username or password');boot();}
async function signOut(){await db.auth.signOut();location.reload();}
async function loadMe(quiet){const{data:s}=await db.auth.getSession();if(!s.session)return false;
 const{data}=await db.from('profiles').select('*').eq('id',s.session.user.id).maybeSingle();
 if(!data||data.banned){await db.auth.signOut();alert(data?'Your account is banned.':'This account was deleted.');location.reload();return false}
 me=data;hud();return true}
function hud(){$('pts').textContent='⭐ '+me.points;$('bstaff').hidden=!isStaff()}

// --- BOOT ---
async function boot(){if(!await loadMe())return;$('auth').hidden=true;$('app').hidden=false;if(ch)return;
 await loadFriends();
 ch=db.channel('park');ch.on('broadcast',{event:'p'},({payload:p})=>{const o=others[p.id];others[p.id]={...p,x:o?o.x:p.x,y:o?o.y:p.y,tx:p.x,ty:p.y,seen:Date.now()}}).subscribe();
 setInterval(()=>ch.send({type:'broadcast',event:'p',payload:{id:me.id,x:P.x,y:P.y,z:P.z,mv:P.mv,b:Date.now()<bubT?bub:'',e:Date.now()<emoT?emoK:'',u:look(me)}}),100);
 msgSub=db.channel('m').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},({new:m})=>onMsg(m)).subscribe();
 const{data:st}=await db.from('settings').select('v').eq('k','music').maybeSingle();setMusic(st?.v);
 db.channel('s').on('postgres_changes',{event:'*',schema:'public',table:'settings'},({new:r})=>r&&r.k=='music'&&setMusic(r.v)).subscribe();
 setInterval(()=>{mins++;if(mins%15==0)addPts(1)},60000);setInterval(()=>loadMe(),20000);
 requestAnimationFrame(loop);}
(async()=>{if(await loadMe())boot()})();

async function addPts(n){me.points=Math.max(0,me.points+n);hud();await db.from('profiles').update({points:me.points}).eq('id',me.id)}

// --- MUSIC ---
function setMusic(u){const a=$('aud');if(a.dataset.u==u)return;a.dataset.u=u||'';a.src=u||'';if(!u)a.pause()}
function toggleMusic(){const a=$('aud');if(!a.src)return alert('No music set yet');a.paused?a.play():a.pause()}

// --- FRIENDS / USERS ---
const av=(e,f,uid)=>`<span class="av" ${uid?`onclick="userCard('${uid}')"`:''} style="${f?`box-shadow:0 0 0 3px ${f},0 0 10px ${f}`:''}">${esc(e||'🟢')}</span>`;
async function loadFriends(){const{data}=await db.from('friends').select('b').eq('a',me.id);friendIds=(data||[]).map(r=>r.b)}
async function addFriend(id){if(id==me.id)return;await db.from('friends').upsert([{a:me.id,b:id},{a:id,b:me.id}]);await loadFriends();closeModal();if(cur.p=='friends')friendsP()}
async function unfriend(id){await db.from('friends').delete().or(`and(a.eq.${me.id},b.eq.${id}),and(a.eq.${id},b.eq.${me.id})`);await loadFriends();closeModal();if(cur.p=='friends')friendsP();else if(cur.p=='chat'&&cur.chat==id)chatP(null)}
async function userCard(id){const{data:u}=await db.from('profiles').select('*').eq('id',id).maybeSingle();if(!u)return;const f=friendIds.includes(id);
 $('modal').hidden=false;$('modal').onclick=e=>e.target.id=='modal'&&closeModal();
 $('modal').innerHTML=`<div class="card"><canvas id="uc" width="160" height="120" style="margin:auto"></canvas>${av(u.avatar,u.frame)}
 <div><b>${esc(u.username)}</b>${u.title?`<span class="tag" style="color:${tcol(u.title)}">${esc(u.title)}</span>`:''}</div><div class="mu">${u.role=='admin'?'Admin':''}</div>
 ${id==me.id?'':f?`<button class="pri" onclick="closeModal();showPanel('chat');chatP('${id}')">💬 Message</button><button class="dng" onclick="unfriend('${id}')">Unfriend</button>`:`<button class="pri" onclick="addFriend('${id}')">➕ Add friend</button>`}
 <button onclick="closeModal()">Close</button></div>`;
 const c=$('uc').getContext('2d'),L=look(u),t0=performance.now();(function d(){if(!$('uc'))return;c.clearRect(0,0,160,120);slime(c,80,100,L,performance.now(),false,0);requestAnimationFrame(d)})()}
function closeModal(){$('modal').hidden=true;$('modal').innerHTML=''}

// --- PANELS ---
function showPanel(n){const pn=$('panel');if(!pn.hidden&&cur.p==n){pn.hidden=true;cur.p=null;return}pn.hidden=false;cur.p=n;
 ({chat:()=>chatP(null),friends:friendsP,market:marketP,games:gamesP,staff:staffP,profile:profileP})[n]()}
const msgHTML=m=>{const st=m.title=='Admin'?'staff':m.title=='DEV'?'dev':'';return`<div class="msg ${st}">${av(m.av,m.fr,m.uid)}<div><b>${esc(m.username)}</b>${m.title?`<span class="tag" style="color:${tcol(m.title)}">${esc(m.title)}</span>`:''}${m.body.startsWith('[s]')?`<div style="font-size:44px;line-height:1.1">${esc(m.body.slice(3))}</div>`:`<div>${esc(m.body)}</div>`}</div></div>`};
async function chatP(w){cur.chat=w;let name='Global chat';if(w){const{data}=await db.from('profiles').select('username').eq('id',w).maybeSingle();name='💬 '+esc(data?.username)}
 $('pbody').innerHTML=`<div class="row"><h3>${name}</h3>${w?'<button onclick="chatP(null)" style="flex:none">Global</button>':''}</div><div class="msgs" id="msgs"></div><div class="row"><input id="ci" maxlength="200" placeholder="Say something…" onkeydown="event.key=='Enter'&&sendMsg()"><button style="flex:none" onclick="stickerPick()">😺</button><button class="pri" style="flex:none" onclick="sendMsg()">Send</button></div>`;
 let q=db.from('messages').select('*').order('created_at',{ascending:false}).limit(60);
 q=w?q.or(`and(uid.eq.${me.id},to_uid.eq.${w}),and(uid.eq.${w},to_uid.eq.${me.id})`):q.is('to_uid',null);
 const{data}=await q;$('msgs').innerHTML=(data||[]).reverse().map(msgHTML).join('');$('msgs').scrollTop=1e9}
function onMsg(m){if(cur.p!='chat'||!$('msgs'))return;const w=cur.chat;
 const ok=w?(m.to_uid&&((m.uid==me.id&&m.to_uid==w)||(m.uid==w&&m.to_uid==me.id))):!m.to_uid;
 if(ok){$('msgs').insertAdjacentHTML('beforeend',msgHTML(m));$('msgs').scrollTop=1e9}}
async function sendMsg(st){const t=st?'[s]'+st:$('ci').value.trim();if(!t)return;
 if(me.muted_until&&new Date(me.muted_until)>new Date())return alert('You are muted until '+new Date(me.muted_until).toLocaleString());
 const w=cur.chat;if(w&&!friendIds.includes(w))return alert('You must be friends to message this user');
 $('ci').value='';await db.from('messages').insert({uid:me.id,username:me.username,title:me.title,av:me.avatar,fr:me.frame,body:t,to_uid:w});
 if(!w){bub=t.replace('[s]','').slice(0,50);bubT=Date.now()+6000}}
async function friendsP(){$('pbody').innerHTML=`<h3>Find players</h3><div class="row"><input id="fs" placeholder="Search username" onkeydown="event.key=='Enter'&&findU()"><button class="pri" style="flex:none" onclick="findU()">Search</button></div><div id="fr"></div><h3>Friends</h3><div id="fl" class="mu">Loading…</div>`;
 if(!friendIds.length)return $('fl').textContent='No friends yet. Click a slime or chat avatar to add one.';
 const{data}=await db.from('profiles').select('id,username,avatar,frame,title').in('id',friendIds);
 $('fl').innerHTML=(data||[]).map(u=>`<div class="msg">${av(u.avatar,u.frame,u.id)}<b style="flex:1">${esc(u.username)}</b><button onclick="chatP('${u.id}')">💬</button><button class="dng" onclick="unfriend('${u.id}')">✕</button></div>`).join('')}
async function findU(){const q=$('fs').value.trim();if(!q)return;const{data}=await db.from('profiles').select('id,username,avatar,frame').ilike('username','%'+q+'%').neq('id',me.id).limit(10);
 $('fr').innerHTML=(data||[]).map(u=>`<div class="msg">${av(u.avatar,u.frame,u.id)}<b style="flex:1">${esc(u.username)}</b>${friendIds.includes(u.id)?'<span class="mu">Friend</span>':`<button class="pri" onclick="addFriend('${u.id}')">Add</button>`}</div>`).join('')||'<div class="mu">No users found</div>'}

// --- MARKET ---
const owns=i=>i[3]==0||me.owned.includes(i[0]);
const slot={skin:'skin',hat:'hat',hair:'hair',bow:'bow',title:'title',avatar:'avatar',frame:'frame'};
const eqd=i=>me[slot[i[1]]]==i[4]||(i[1]=='skin'&&me.skin==i[0]);
function marketP(){const items=ITEMS.filter(i=>i[1]==mk.tab);const L={...look(me),...mk.try},t=mk.try;
 $('pbody').innerHTML=`<div class="row"><canvas id="pv" width="180" height="150" style="background:#2a3a2f;border-radius:14px;flex:none;max-width:180px"></canvas><div style="text-align:center">${av(t.avatar||me.avatar,t.frame||me.frame)}<div class="mu">Preview / try on</div><button onclick="mk.try={};marketP()">Reset</button></div></div>
 <div class="tabs">${Object.keys(SEC).map(k=>`<button class="${k==mk.tab?'on':''}" onclick="mk.tab='${k}';marketP()">${SEC[k]}</button>`).join('')}</div>
 <div class="grid">${items.map(i=>`<div class="item"><b>${i[1]=='skin'?`<span class="dot" style="background:${i[4]};box-shadow:0 0 8px ${i[5]||'transparent'}"></span>`:i[1]=='avatar'?i[4]+' ':''}${i[2]}</b><small>${i[3]?'⭐ '+i[3].toLocaleString():'Free'}</small>
 <button onclick="tryOn('${i[0]}')">👁 Try</button>${owns(i)?(i[1]=='sticker'?'<small>Owned ✓</small>':eqd(i)?(i[1]=='skin'||i[1]=='avatar'?'<small>Equipped ✓</small>':`<button onclick="eq('${i[0]}',1)">Unequip</button>`):`<button class="pri" onclick="eq('${i[0]}')">Equip</button>`):`<button class="pri" onclick="buy('${i[0]}')">Buy</button>`}</div>`).join('')}</div>`}
function tryOn(id){const i=ITEMS.find(x=>x[0]==id);if(i[1]=='sticker')return alert('Sticker preview: '+i[4]);const k={skin:'skin',hat:'hat',hair:'hair',bow:'bow',title:'t',avatar:'avatar',frame:'frame'}[i[1]];mk.try[k]=i[4]=='tuft'?i[4]:(i[1]=='skin'?i[0]:i[4]);marketP()}
async function buy(id){const i=ITEMS.find(x=>x[0]==id);if(me.points<i[3])return alert('Not enough points!');me.owned=[...me.owned,id];me.points-=i[3];
