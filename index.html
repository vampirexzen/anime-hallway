<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Garden - Online Lounge & Chat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sakura: {
                            50: '#fff5f7',
                            100: '#ffe6ec',
                            200: '#fccad6',
                            300: '#f79fb5',
                            400: '#f1688c',
                            500: '#e53b68',
                            600: '#d11d4d',
                            700: '#b0103a',
                            800: '#921134',
                            900: '#7b1331',
                        },
                        night: {
                            900: '#120b18',
                            800: '#1e1329',
                            700: '#2c1b3d',
                            600: '#3e2654',
                        }
                    },
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        nunito: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #120b18;
            color: #f1688c;
            overflow-x: hidden;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(30, 19, 41, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(247, 159, 181, 0.18);
        }

        .glass-panel-light {
            background: rgba(255, 230, 236, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .glass-input {
            background: rgba(18, 11, 24, 0.6);
            border: 1px solid rgba(247, 159, 181, 0.3);
            color: #fff;
        }
        .glass-input:focus {
            outline: none;
            border-color: #f79fb5;
            box-shadow: 0 0 12px rgba(247, 159, 181, 0.3);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(18, 11, 24, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(247, 159, 181, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(247, 159, 181, 0.7);
        }

        /* Sakura Petal Animation */
        #petalCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Interactive Garden Canvas */
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
        }

        /* Pulse glowing dot */
        .online-badge {
            box-shadow: 0 0 8px #10B981;
        }

        /* Animated music vinyl / disc spin */
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spinSlow 12s linear infinite;
        }

        /* Chat bubbles on game */
        .speech-bubble {
            position: absolute;
            transform: translate(-50%, -100%);
            background: rgba(255, 255, 255, 0.95);
            color: #2c1b3d;
            padding: 6px 12px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: none;
            white-space: nowrap;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 25;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: rgba(255, 255, 255, 0.95) transparent;
            display: block;
            width: 0;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: translate(-50%, -80%) scale(0.6); }
            100% { opacity: 1; transform: translate(-50%, -100%) scale(1); }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden select-none bg-night-900 text-slate-100 flex flex-col">

    <!-- Falling Petals Overhead Layer -->
    <canvas id="petalCanvas"></canvas>

    <!-- AUTHENTICATION OVERLAY MODAL -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-night-900/80 backdrop-blur-md transition-opacity duration-300">
        <div class="glass-panel w-full max-w-md p-8 rounded-3xl shadow-2xl border border-sakura-300/30 text-center relative overflow-hidden">
            <!-- Decorative Glow -->
            <div class="absolute -top-20 -right-20 w-40 h-40 bg-sakura-500/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-sakura-300/20 rounded-full blur-3xl pointer-events-none"></div>

            <!-- Header Header -->
            <div class="mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-sakura-500/20 text-sakura-300 mb-3 border border-sakura-400/30">
                    <i class="fa-solid font-fredoka fa-leaf text-3xl animate-bounce"></i>
                </div>
                <h1 class="text-3xl font-fredoka font-bold text-white tracking-wide">Sakura Garden</h1>
                <p class="text-xs text-sakura-200 mt-1 font-medium">Relaxing Online Lounge & Chat</p>
            </div>

            <!-- Tab Switcher -->
            <div class="flex bg-night-800/80 p-1 rounded-2xl mb-6 border border-sakura-500/20">
                <button id="tabSigninBtn" onclick="switchAuthTab('signin')" class="flex-1 py-2 rounded-xl font-bold text-xs transition-all duration-200 bg-sakura-500 text-white shadow-md">Sign In</button>
                <button id="tabSignupBtn" onclick="switchAuthTab('signup')" class="flex-1 py-2 rounded-xl font-bold text-xs transition-all duration-200 text-sakura-200 hover:text-white">Sign Up</button>
            </div>

            <!-- Auth Form -->
            <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4 text-left">
                <div id="usernameGroup" class="hidden">
                    <label class="block text-xs font-semibold text-sakura-200 mb-1">Display Name / Avatar Name</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-sakura-300/60 text-sm"></i>
                        <input type="text" id="authUsername" placeholder="CherryBlossom42" class="w-full glass-input pl-10 pr-4 py-2.5 rounded-xl text-sm transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-sakura-200 mb-1">Email Address</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-sakura-300/60 text-sm"></i>
                        <input type="email" id="authEmail" required placeholder="user@sakura.lounge" class="w-full glass-input pl-10 pr-4 py-2.5 rounded-xl text-sm transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-sakura-200 mb-1">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-sakura-300/60 text-sm"></i>
                        <input type="password" id="authPassword" required placeholder="••••••••" class="w-full glass-input pl-10 pr-4 py-2.5 rounded-xl text-sm transition">
                    </div>
                </div>

                <!-- Avatar Select on Signup -->
                <div id="avatarSelectGroup" class="hidden">
                    <label class="block text-xs font-semibold text-sakura-200 mb-2">Choose Avatar Sprite</label>
                    <div class="grid grid-cols-5 gap-2" id="avatarPickerContainer">
                        <!-- Dynamic avatar options -->
                    </div>
                </div>

                <!-- Feedback Message -->
                <div id="authMsg" class="text-xs p-3 rounded-xl hidden text-center font-medium"></div>

                <button type="submit" id="authSubmitBtn" class="w-full py-3 bg-gradient-to-r from-sakura-500 to-sakura-600 hover:from-sakura-400 hover:to-sakura-500 text-white font-fredoka font-semibold rounded-xl transition duration-200 shadow-lg shadow-sakura-500/30 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span id="authBtnText">Sign In to Garden</span>
                </button>
            </form>

            <div class="mt-4 text-center">
                <button type="button" onclick="guestLogin()" class="text-xs text-sakura-300/70 hover:text-sakura-200 underline transition">
                    Continue as Guest (Instant Access)
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="mainApp" class="flex-1 flex flex-col h-full w-full relative overflow-hidden hidden">

        <!-- TOP NAVBAR -->
        <header class="h-16 glass-panel border-b border-sakura-500/20 px-4 flex items-center justify-between z-30 relative shrink-0">
            <!-- Brand -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sakura-500 to-sakura-300 flex items-center justify-center text-white shadow-md shadow-sakura-500/20">
                    <i class="fa-solid fa-tree text-lg"></i>
                </div>
                <div>
                    <h1 class="font-fredoka font-bold text-white text-base leading-tight tracking-wide flex items-center gap-2">
                        Sakura Lounge <span class="bg-sakura-500/20 text-sakura-300 text-[10px] px-2 py-0.5 rounded-full border border-sakura-400/30 font-sans">LIVE</span>
                    </h1>
                    <p class="text-xs text-sakura-200/70 flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
                        <span id="onlineCountText">1 online</span>
                    </p>
                </div>
            </div>

            <!-- Music Player Widget Compact -->
            <div class="hidden md:flex items-center glass-panel-light px-3 py-1.5 rounded-full gap-3 border border-sakura-300/20">
                <button id="playMusicBtn" onclick="toggleMusic()" class="w-8 h-8 rounded-full bg-sakura-500 hover:bg-sakura-400 text-white flex items-center justify-center transition shadow-md">
                    <i class="fa-solid fa-play text-xs" id="musicIcon"></i>
                </button>
                <div class="text-xs w-36 overflow-hidden">
                    <div id="trackTitle" class="font-bold text-white whitespace-nowrap animate-marquee">Sakura Chill Lofi</div>
                    <div id="trackArtist" class="text-[10px] text-sakura-200">Ambient Soundscape</div>
                </div>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" oninput="changeVolume(this.value)" class="w-16 accent-sakura-400 cursor-pointer">
            </div>

            <!-- User Menu & Actions -->
            <div class="flex items-center gap-2">
                <!-- Avatar Preview -->
                <div class="flex items-center gap-2 pl-2 pr-3 py-1 glass-panel-light rounded-full">
                    <div id="navAvatarSprite" class="text-2xl leading-none">🌸</div>
                    <span id="navUsername" class="text-xs font-bold text-white max-w-[100px] truncate">Guest</span>
                </div>

                <!-- Customization button -->
                <button onclick="toggleAvatarCustomizer()" title="Change Avatar" class="p-2.5 glass-panel-light hover:bg-sakura-500/30 text-sakura-200 rounded-xl transition">
                    <i class="fa-solid fa-shirt"></i>
                </button>

                <!-- Sign Out Button -->
                <button onclick="handleSignOut()" title="Sign Out" class="p-2.5 glass-panel-light hover:bg-red-500/30 text-red-300 rounded-xl transition">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <!-- MAIN CONTENT AREA: Canvas Game + Side Panels -->
        <div class="flex-1 flex overflow-hidden relative">

            <!-- GAME CANVAS SECTION -->
            <div class="flex-1 relative bg-night-900 overflow-hidden flex flex-col justify-end">
                
                <!-- Speech Bubbles Container Overhead -->
                <div id="speechBubblesLayer" class="absolute inset-0 pointer-events-none z-20"></div>

                <!-- Main Game Canvas -->
                <canvas id="gameCanvas"></canvas>

                <!-- Canvas Controls Overlay -->
                <div class="absolute top-4 left-4 z-20 flex flex-col gap-2">
                    <div class="glass-panel px-3 py-2 rounded-2xl text-xs text-sakura-200 flex items-center gap-2 shadow-lg">
                        <i class="fa-solid fa-location-crosshairs text-sakura-400"></i>
                        <span>Click/Tap anywhere in the garden to walk</span>
                    </div>
                </div>

                <!-- Dynamic Quick Emote Bar -->
                <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 glass-panel p-2 rounded-full flex items-center gap-1.5 shadow-2xl border border-sakura-400/30">
                    <button onclick="sendEmote('🌸')" class="w-9 h-9 text-lg rounded-full hover:bg-sakura-500/30 transition flex items-center justify-center">🌸</button>
                    <button onclick="sendEmote('🍵')" class="w-9 h-9 text-lg rounded-full hover:bg-sakura-500/30 transition flex items-center justify-center">🍵</button>
                    <button onclick="sendEmote('💖')" class="w-9 h-9 text-lg rounded-full hover:bg-sakura-500/30 transition flex items-center justify-center">💖</button>
                    <button onclick="sendEmote('🎶')" class="w-9 h-9 text-lg rounded-full hover:bg-sakura-500/30 transition flex items-center justify-center">🎶</button>
                    <button onclick="sendEmote('✨')" class="w-9 h-9 text-lg rounded-full hover:bg-sakura-500/30 transition flex items-center justify-center">✨</button>
                    <button onclick="sendEmote('🍡')" class="w-9 h-9 text-lg rounded-full hover:bg-sakura-500/30 transition flex items-center justify-center">🍡</button>
                    <button onclick="sendEmote('🐱')" class="w-9 h-9 text-lg rounded-full hover:bg-sakura-500/30 transition flex items-center justify-center">🐱</button>
                </div>
            </div>

            <!-- RIGHT SIDEBAR (Chat & Friends Toggle Tabs) -->
            <div id="sidebarPanel" class="w-80 md:w-96 glass-panel border-l border-sakura-500/20 flex flex-col z-30 transition-all duration-300">
                
                <!-- Sidebar Header Tabs -->
                <div class="flex border-b border-sakura-500/20 p-2 gap-2 bg-night-900/40">
                    <button id="tabChatBtn" onclick="switchSidebarTab('chat')" class="flex-1 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 bg-sakura-500 text-white shadow">
                        <i class="fa-solid fa-comments"></i> Global Chat
                    </button>
                    <button id="tabFriendsBtn" onclick="switchSidebarTab('friends')" class="flex-1 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 text-sakura-200 hover:text-white hover:bg-sakura-500/20">
                        <i class="fa-solid fa-user-group"></i> Friends <span id="friendCountBadge" class="bg-sakura-400 text-night-900 text-[10px] px-1.5 py-0.2 rounded-full font-extrabold">0</span>
                    </button>
                </div>

                <!-- GLOBAL CHAT TAB CONTENT -->
                <div id="chatTabContent" class="flex-1 flex flex-col overflow-hidden">
                    <!-- Chat History -->
                    <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3">
                        <div class="text-center my-4">
                            <span class="text-[11px] bg-sakura-500/10 text-sakura-300 px-3 py-1 rounded-full border border-sakura-500/20">
                                Welcome to the Sakura Garden Chat 🌸
                            </span>
                        </div>
                        <!-- Messages dynamically inserted here -->
                    </div>

                    <!-- Chat Input Box -->
                    <form id="chatForm" onsubmit="handleSendChatMessage(event)" class="p-3 border-t border-sakura-500/20 flex gap-2 bg-night-900/60">
                        <input type="text" id="chatInput" placeholder="Say something lovely..." maxlength="200" required class="flex-1 glass-input px-3.5 py-2.5 rounded-xl text-xs">
                        <button type="submit" class="px-4 bg-sakura-500 hover:bg-sakura-400 text-white rounded-xl transition flex items-center justify-center shadow-md">
                            <i class="fa-solid fa-paper-plane text-xs"></i>
                        </button>
                    </form>
                </div>

                <!-- FRIENDS MANAGER TAB CONTENT -->
                <div id="friendsTabContent" class="flex-1 flex flex-col overflow-hidden hidden">
                    <!-- Add Friend Bar -->
                    <div class="p-3 border-b border-sakura-500/20 bg-night-900/40">
                        <form onsubmit="handleAddFriend(event)" class="flex gap-2">
                            <input type="text" id="friendSearchInput" placeholder="Enter friend's name..." required class="flex-1 glass-input px-3 py-2 rounded-xl text-xs">
                            <button type="submit" class="px-3 bg-sakura-500 hover:bg-sakura-400 text-white rounded-xl text-xs font-bold flex items-center gap-1 transition shadow">
                                <i class="fa-solid fa-user-plus"></i> Add
                            </button>
                        </form>
                    </div>

                    <!-- Friends List -->
                    <div class="flex-1 p-3 overflow-y-auto space-y-2" id="friendsList">
                        <!-- Dynamic Friend List -->
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- AVATAR CUSTOMIZER MODAL -->
    <div id="customizerModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-night-900/80 backdrop-blur-md hidden">
        <div class="glass-panel w-full max-w-sm p-6 rounded-3xl text-center relative border border-sakura-400/30">
            <button onclick="toggleAvatarCustomizer()" class="absolute top-4 right-4 text-sakura-200 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h2 class="text-xl font-fredoka font-bold text-white mb-1">Customize Avatar</h2>
            <p class="text-xs text-sakura-200 mb-4">Pick your garden appearance & color</p>

            <!-- Sprite Select -->
            <div class="mb-4 text-left">
                <label class="block text-xs font-semibold text-sakura-200 mb-2">Avatar Character</label>
                <div class="grid grid-cols-5 gap-2" id="modalAvatarPicker">
                    <!-- Options populated JS -->
                </div>
            </div>

            <!-- Color Palette Select -->
            <div class="mb-6 text-left">
                <label class="block text-xs font-semibold text-sakura-200 mb-2">Aura Color</label>
                <div class="flex justify-between gap-2" id="colorPickerContainer">
                    <!-- Colors populated JS -->
                </div>
            </div>

            <button onclick="saveAvatarCustomization()" class="w-full py-2.5 bg-sakura-500 hover:bg-sakura-400 text-white font-bold rounded-xl text-xs shadow-lg transition">
                Save Changes
            </button>
        </div>
    </div>

    <!-- AUDIO STREAM ENGINE -->
    <audio id="audioPlayer" loop preload="none">
        <!-- Relaxing Ambient Lofi Stream -->
        <source src="https://stream.zeno.fm/f3wvbbqmdg8uv" type="audio/mpeg">
    </audio>

    <script>
        /* ==========================================================================
           1. SUPABASE CLIENT CONFIGURATION
           ========================================================================== */
        const SUPABASE_URL = "https://brvyjdtnxzjlrhukngjn.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydnlqZHRueHpqbHJodWtuZ2puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTAwMjcsImV4cCI6MjEwODA4NjAyN30.2ib-m3ju3SEhJLaQHQdA8xinenbtN5MltOatIYZSZIE";

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        /* ==========================================================================
           2. GLOBAL STATE & CONSTANTS
           ========================================================================== */
        const AVATAR_SPRITES = ['🌸', '🦊', '🐱', '🍡', '🍵', '🐰', '🐼', '🎏', '🎎', '⛩️'];
        const AURA_COLORS = ['#f1688c', '#60a5fa', '#34d399', '#a78bfa', '#fbbf24'];

        let currentUser = null;
        let userProfile = {
            id: null,
            name: 'Guest Sakura',
            avatar: '🌸',
            color: '#f1688c',
            x: 0.5,
            y: 0.6
        };

        let activeAuthMode = 'signin'; // 'signin' or 'signup'
        let onlineUsers = new Map(); // Store state of players in garden
        let friends = []; // User's friend list
        let localChatHistory = [];
        let realtimeChannel = null;

        /* ==========================================================================
           3. INITIALIZATION & AUTH PERSISTENCE
           ========================================================================== */
        window.addEventListener('DOMContentLoaded', async () => {
            initPetalsCanvas();
            initGameCanvas();
            renderAvatarPickers();

            // Check Supabase session
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                handleUserSession(session.user);
            } else {
                // Check local storage for persistent guest
                const localGuest = localStorage.getItem('sakura_guest_profile');
                if (localGuest) {
                    try {
                        const parsed = JSON.parse(localGuest);
                        setupGuestSession(parsed);
                    } catch (e) {}
                }
            }

            // Listen for Supabase Auth state changes
            supabase.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' && session) {
                    handleUserSession(session.user);
                } else if (event === 'SIGNED_OUT') {
                    currentUser = null;
                    document.getElementById('authModal').classList.remove('hidden');
                    document.getElementById('mainApp').classList.add('hidden');
                    if (realtimeChannel) realtimeChannel.unsubscribe();
                }
            });
        });

        function handleUserSession(user) {
            currentUser = user;
            const meta = user.user_metadata || {};
            userProfile.id = user.id;
            userProfile.name = meta.username || user.email.split('@')[0];
            userProfile.avatar = meta.avatar || '🌸';
            userProfile.color = meta.color || '#f1688c';

            updateUserInterface();
            initRealtimeGarden();
            loadFriendList();
        }

        function setupGuestSession(guestData = null) {
            if (!guestData) {
                const randomId = 'guest_' + Math.random().toString(36).substring(2, 9);
                guestData = {
                    id: randomId,
                    name: 'Guest_' + Math.floor(1000 + Math.random() * 9000),
                    avatar: AVATAR_SPRITES[Math.floor(Math.random() * AVATAR_SPRITES.length)],
                    color: AURA_COLORS[Math.floor(Math.random() * AURA_COLORS.length)]
                };
                localStorage.setItem('sakura_guest_profile', JSON.stringify(guestData));
            }

            userProfile.id = guestData.id;
            userProfile.name = guestData.name;
            userProfile.avatar = guestData.avatar;
            userProfile.color = guestData.color;

            updateUserInterface();
            initRealtimeGarden();
            loadFriendList();
        }

        function guestLogin() {
            setupGuestSession();
        }

        function updateUserInterface() {
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('navUsername').textContent = userProfile.name;
            document.getElementById('navAvatarSprite').textContent = userProfile.avatar;
            
            // Random start position on canvas
            userProfile.x = 0.2 + Math.random() * 0.6;
            userProfile.y = 0.4 + Math.random() * 0.4;
        }

        /* ==========================================================================
           4. AUTHENTICATION HANDLERS
           ========================================================================== */
        function switchAuthTab(mode) {
            activeAuthMode = mode;
            const signinBtn = document.getElementById('tabSigninBtn');
            const signupBtn = document.getElementById('tabSignupBtn');
            const usernameGroup = document.getElementById('usernameGroup');
            const avatarGroup = document.getElementById('avatarSelectGroup');

        /* ==========================================================================
           5. SUPABASE REALTIME PRESENCE & CHAT
           ========================================================================== */
        function initRealtimeGarden() {
            // Setup Supabase Realtime channel for lounge presence and chat
            realtimeChannel = supabase.channel('sakura_lounge_room', {
                config: {
                    presence: {
                        key: userProfile.id,
                    },
                },
            });

            // Track Presence (Online Users)
            realtimeChannel
                .on('presence', { event: 'sync' }, () => {
                    const presenceState = realtimeChannel.presenceState();
                    onlineUsers.clear();
                    let count = 0;

                    for (const id in presenceState) {
                        const userState = presenceState[id][0];
                        if (userState) {
                            onlineUsers.set(id, userState);
                            count++;
                        }
                    }

                    // Always add self to presence map locally
                    onlineUsers.set(userProfile.id, {
                        user_id: userProfile.id,
                        name: userProfile.name,
                        avatar: userProfile.avatar,
                        color: userProfile.color,
                        x: userProfile.x,
                        y: userProfile.y,
                        targetX: userProfile.x,
                        targetY: userProfile.y
                    });

                    document.getElementById('onlineCountText').textContent = `${Math.max(1, count)} online`;
                })
                .on('presence', { event: 'join' }, ({ key, newPresences }) => {
                    const p = newPresences[0];
                    if (p && p.name && p.user_id !== userProfile.id) {
                        appendSystemChatMessage(`${p.name} entered the garden 🌸`);
                    }
                })
                .on('presence', { event: 'leave' }, ({ key, leftPresences }) => {
                    const p = leftPresences[0];
                    if (p && p.name) {
                        appendSystemChatMessage(`${p.name} left the garden`);
                    }
                })
                // Broadcast Chat Messages & Movement
                .on('broadcast', { event: 'chat' }, (payload) => {
                    renderChatMessage(payload.payload);
                    showSpeechBubble(payload.payload.userId, payload.payload.message);
                })
                .on('broadcast', { event: 'move' }, (payload) => {
                    const { userId, x, y } = payload.payload;
                    if (onlineUsers.has(userId)) {
                        const u = onlineUsers.get(userId);
                        u.targetX = x;
                        u.targetY = y;
                    }
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await realtimeChannel.track({
                            user_id: userProfile.id,
                            name: userProfile.name,
                            avatar: userProfile.avatar,
                            color: userProfile.color,
                            x: userProfile.x,
                            y: userProfile.y,
                            targetX: userProfile.x,
                            targetY: userProfile.y
                        });
                    }
                });
        }

        /* Send Chat Message */
        function handleSendChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            const chatData = {
                id: Math.random().toString(36).substr(2, 9),
                userId: userProfile.id,
                name: userProfile.name,
                avatar: userProfile.avatar,
                color: userProfile.color,
                message: text,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            // Send via Realtime Broadcast
            if (realtimeChannel) {
                realtimeChannel.send({
                    type: 'broadcast',
                    event: 'chat',
                    payload: chatData
                });
            }

            // Render locally
            renderChatMessage(chatData);
            showSpeechBubble(userProfile.id, text);

            input.value = '';
        }

        function sendEmote(emoji) {
            document.getElementById('chatInput').value = emoji;
            handleSendChatMessage(new Event('submit'));

        /* ==========================================================================
           7. INTERACTIVE GARDEN CANVAS & AVATAR ANIMATION ENGINE
           ========================================================================== */
        let gameCanvas, gameCtx;
        let petalsCanvas, petalsCtx;
        let petals = [];

        function initPetalsCanvas() {
            petalsCanvas = document.getElementById('petalCanvas');
            petalsCtx = petalsCanvas.getContext('2d');
            resizePetalCanvas();

            window.addEventListener('resize', resizePetalCanvas);

            // Generate Sakura Petals
            petals = Array.from({ length: 45 }, () => ({
                x: Math.random() * petalsCanvas.width,
                y: Math.random() * petalsCanvas.height,
                size: Math.random() * 6 + 4,
                speedY: Math.random() * 1.2 + 0.6,
                speedX: Math.random() * 0.8 - 0.4,
                rotation: Math.random() * 360,
                rotSpeed: (Math.random() - 0.5) * 2,
                opacity: Math.random() * 0.6 + 0.4
            }));

            animatePetals();
        }

        function resizePetalCanvas() {
            petalsCanvas.width = window.innerWidth;
            petalsCanvas.height = window.innerHeight;
        }

        function animatePetals() {
            petalsCtx.clearRect(0, 0, petalsCanvas.width, petalsCanvas.height);

            petals.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX + Math.sin(p.y * 0.01) * 0.3;
                p.rotation += p.rotSpeed;

                if (p.y > petalsCanvas.height + 20) {
                    p.y = -20;
                    p.x = Math.random() * petalsCanvas.width;
                }

                petalsCtx.save();
                petalsCtx.translate(p.x, p.y);
                petalsCtx.rotate((p.rotation * Math.PI) / 180);
                petalsCtx.globalAlpha = p.opacity;

                // Draw Blossom Petal Shape
                petalsCtx.fillStyle = '#fccad6';
                petalsCtx.beginPath();
                petalsCtx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
                petalsCtx.fill();

                petalsCtx.restore();
            });

            requestAnimationFrame(animatePetals);
        }

        function initGameCanvas() {
            gameCanvas = document.getElementById('gameCanvas');
            gameCtx = gameCanvas.getContext('2d');
            resizeGameCanvas();

            window.addEventListener('resize', resizeGameCanvas);

            // Canvas Click to move avatar
            gameCanvas.addEventListener('click', (e) => {
                const rect = gameCanvas.getBoundingClientRect();
                const clickX = (e.clientX - rect.left) / gameCanvas.width;
                const clickY = (e.clientY - rect.top) / gameCanvas.height;

                // Set target position
                userProfile.x = clickX;
                userProfile.y = clickY;

                // Broadcast move to other online users
                if (realtimeChannel) {
                    realtimeChannel.send({
                        type: 'broadcast',
                        event: 'move',
                        payload: {
                            userId: userProfile.id,
                            x: clickX,
                            y: clickY
                        }
                    });
                }
            });

            requestAnimationFrame(gameLoop);
        }

        function resizeGameCanvas() {
            const container = gameCanvas.parentElement;
            gameCanvas.width = container.clientWidth;
            gameCanvas.height = container.clientHeight;
        }

        function gameLoop() {
            gameCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);

            // 1. Draw Garden Background Scene
            drawGardenEnvironment();

            // 2. Smoothly update positions and draw online avatars
            onlineUsers.forEach((user, id) => {
                // Smooth interpolation to target coords
                if (user.targetX !== undefined) {
                    user.x += (user.targetX - user.x) * 0.08;
                    user.y += (user.targetY - user.y) * 0.08;
                }

                drawAvatar(user);
            });

            requestAnimationFrame(gameLoop);
        }

        function drawGardenEnvironment() {
            const w = gameCanvas.width;
            const h = gameCanvas.height;

            // Night Garden Ambient Gradient
            const bgGrad = gameCtx.createLinearGradient(0, 0, 0, h);
            bgGrad.addColorStop(0, '#1a0c27');
            bgGrad.addColorStop(0.5, '#2a1638');
            bgGrad.addColorStop(1, '#150d20');
            gameCtx.fillStyle = bgGrad;
            gameCtx.fillRect(0, 0, w, h);

            // Winding Stone Path
            gameCtx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            gameCtx.beginPath();
            gameCtx.moveTo(w * 0.2, h);
            gameCtx.bezierCurveTo(w * 0.3, h * 0.7, w * 0.6, h * 0.6, w * 0.5, h * 0.2);
            gameCtx.lineWidth = 60;
            gameCtx.strokeStyle = 'rgba(70, 50, 85, 0.4)';
            gameCtx.stroke();

            // Serene Koi Pond Canvas Object
            gameCtx.fillStyle = 'rgba(30, 70, 90, 0.5)';
            gameCtx.beginPath();
            gameCtx.ellipse(w * 0.8, h * 0.75, w * 0.15, h * 0.12, Math.PI / 6, 0, Math.PI * 2);
            gameCtx.fill();
            gameCtx.strokeStyle = 'rgba(140, 210, 230, 0.3)';
            gameCtx.lineWidth = 3;
            gameCtx.stroke();

            // Draw Stylized Sakura Trees on Side Flanks
            drawSakuraTree(w * 0.1, h * 0.3, 0.8);
            drawSakuraTree(w * 0.88, h * 0.25, 1.0);
            drawSakuraTree(w * 0.05, h * 0.8, 1.1);

            // Soft Wooden Deck Bench
            gameCtx.fillStyle = '#3a232f';
            gameCtx.fillRect(w * 0.45, h * 0.45, 90, 20);
            gameCtx.fillStyle = '#4a2d3d';
            gameCtx.fillRect(w * 0.43, h * 0.43, 94, 6);
        }

        function drawSakuraTree(x, y, scale) {
            gameCtx.save();
            gameCtx.translate(x, y);
            gameCtx.scale(scale, scale);

            // Trunk
            gameCtx.strokeStyle = '#2d1810';
            gameCtx.lineWidth = 14;
            gameCtx.beginPath();
            gameCtx.moveTo(0, 60);
            gameCtx.quadraticCurveTo(-10, 20, 0, 0);
            gameCtx.stroke();

            // Soft Foliage Canopy Layers
            const colors = ['#e53b68', '#f1688c', '#fccad6'];
            colors.forEach((col, idx) => {
                gameCtx.fillStyle = col + 'cc';
                gameCtx.beginPath();
                gameCtx.arc(-20 + idx * 10, -20 - idx * 5, 45 - idx * 5, 0, Math.PI * 2);
                gameCtx.arc(20 - idx * 5, -15 - idx * 5, 40 - idx * 5, 0, Math.PI * 2);
                gameCtx.arc(0, -40 - idx * 5, 50 - idx * 5, 0, Math.PI * 2);
                gameCtx.fill();
            });

            gameCtx.restore();
        }

        function drawAvatar(user) {
            const px = user.x * gameCanvas.width;
            const py = user.y * gameCanvas.height;

            gameCtx.save();
            gameCtx.translate(px, py);

            // Shadow
            gameCtx.fillStyle = 'rgba(0,0,0,0.3)';
            gameCtx.beginPath();
            gameCtx.ellipse(0, 18, 18, 8, 0, 0, Math.PI * 2);
            gameCtx.fill();

            // Dynamic Aura Glow ring
            gameCtx.strokeStyle = user.color || '#f1688c';
            gameCtx.lineWidth = 3;
            gameCtx.beginPath();
            gameCtx.ellipse(0, 18, 22, 10, 0, 0, Math.PI * 2);
            gameCtx.stroke();

            // Emoji / Sprite Rendering
            gameCtx.font = '28px sans-serif';
            gameCtx.textAlign = 'center';
            gameCtx.textBaseline = 'middle';
            gameCtx.fillText(user.avatar || '🌸', 0, 0);

            // Name Tag Pill
            gameCtx.font = 'bold 11px Nunito, sans-serif';
            const nameWidth = gameCtx.measureText(user.name).width;

            gameCtx.fillStyle = 'rgba(18, 11, 24, 0.85)';
            gameCtx.beginPath();
            gameCtx.roundRect(-nameWidth/2 - 8, -34, nameWidth + 16, 18, 8);
            gameCtx.fill();
            gameCtx.strokeStyle = 'rgba(247, 159, 181, 0.3)';
            gameCtx.lineWidth = 1;
            gameCtx.stroke();

            // Name Text
            gameCtx.fillStyle = '#ffffff';
            gameCtx.fillText(user.name, 0, -25);

            gameCtx.restore();

            // Reposition overhead dynamic HTML speech bubble if active
            updateSpeechBubblePos(user.user_id || user.id, px, py);
        }

        /* Dynamic Floating Speech Bubbles Overlay */
        function showSpeechBubble(userId, text) {
            const container = document.getElementById('speechBubblesLayer');
            let bubble = document.getElementById(`bubble_${userId}`);

            if (!bubble) {
                bubble = document.createElement('div');
                bubble.id = `bubble_${userId}`;
                bubble.className = 'speech-bubble';
                container.appendChild(bubble);
            }

            bubble.textContent = text;

            // Auto-hide bubble after 4 seconds
            clearTimeout(bubble.timeout);
            bubble.timeout = setTimeout(() => {
                if (bubble.parentElement) bubble.parentElement.removeChild(bubble);
            }, 4000);
        }

        function updateSpeechBubblePos(userId, px, py) {
            const bubble = document.getElementById(`bubble_${userId}`);
            if (bubble) {
                bubble.style.left = `${px}px`;
                bubble.style.top = `${py - 40}px`;
            }
        }
