<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sakura Slime World & Adventure 🌸</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Yuji+Mai&display=swap" rel="stylesheet" />

  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      width: 100dvw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      background: #180914;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .font-sakura {
      font-family: 'Yuji Mai', serif;
    }

    .glass {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    .glass-dark {
      background: rgba(24, 9, 20, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(244, 114, 182, 0.25);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(244, 114, 182, 0.4);
    }

    .glass-input:focus {
      border-color: #ec4899;
      outline: none;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.25);
    }

    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(244, 114, 182, 0.5);
      border-radius: 10px;
    }

    .joystick-base {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(244, 114, 182, 0.6);
      backdrop-filter: blur(8px);
      position: relative;
      touch-action: none;
    }
    .joystick-stick {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
      box-shadow: 0 4px 10px rgba(236, 72, 153, 0.5);
      position: absolute;
      top: 23px;
      left: 23px;
      pointer-events: none;
      transition: transform 0.04s ease-out;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(244, 114, 182, 0.5);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.15);
    }
    .action-btn:active {
      transform: scale(0.92);
      background: #ec4899;
      color: white;
    }
  </style>
</head>
<body class="flex flex-col h-full w-full overflow-hidden select-none bg-pink-950">

  <!-- AUTH MODAL OVERLAY -->
  <div id="auth-modal" class="fixed inset-0 z-50 bg-pink-950/70 backdrop-blur-md flex items-center justify-center p-4">
    <div class="glass w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-white space-y-4 animate-in fade-in zoom-in-95 duration-200 max-h-[90dvh] overflow-y-auto">
      <div class="text-center space-y-1">
        <div class="inline-flex p-3 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-400 text-white shadow-lg shadow-pink-300 mb-1">
          <i data-lucide="sparkles" class="w-6 h-6"></i>
        </div>
        <h2 class="font-sakura text-2xl font-bold text-pink-950">Sakura Slime World</h2>
        <p class="text-xs text-pink-600 font-medium">Explore virtual zen rooms & play action games!</p>
      </div>

      <div class="grid grid-cols-2 gap-1 p-1 bg-pink-100/80 rounded-2xl text-xs font-bold text-pink-800">
        <button id="tab-signin" onclick="switchAuthTab('signin')" class="py-2 rounded-xl bg-white shadow text-pink-900 transition">Sign In</button>
        <button id="tab-signup" onclick="switchAuthTab('signup')" class="py-2 rounded-xl transition text-pink-600 hover:text-pink-900">Sign Up</button>
      </div>

      <div id="auth-alert" class="hidden text-xs p-3 rounded-xl border font-medium"></div>

      <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-3">
        <div class="space-y-1">
          <label class="text-[10px] font-bold text-pink-800 uppercase tracking-wider">Email Address</label>
          <input type="email" id="auth-email" required placeholder="slime@sakura.com" class="glass-input w-full px-3.5 py-2 rounded-xl text-sm font-semibold text-pink-950" />
        </div>
        <div class="space-y-1">
          <label class="text-[10px] font-bold text-pink-800 uppercase tracking-wider">Password</label>
          <input type="password" id="auth-password" required minlength="6" placeholder="••••••••" class="glass-input w-full px-3.5 py-2 rounded-xl text-sm font-semibold text-pink-950" />
        </div>
        <div id="username-field" class="space-y-1 hidden">
          <label class="text-[10px] font-bold text-pink-800 uppercase tracking-wider">Slime Display Name</label>
          <input type="text" id="auth-username" maxlength="15" placeholder="BouncySlime" class="glass-input w-full px-3.5 py-2 rounded-xl text-sm font-semibold text-pink-950" />
        </div>

        <button type="submit" id="auth-submit-btn" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-2.5 rounded-2xl shadow-lg shadow-pink-300 transition active:scale-95 flex items-center justify-center gap-2 text-xs mt-2">
          <span>Sign In</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <div class="relative flex items-center justify-center my-1">
        <div class="border-t border-pink-200 w-full"></div>
        <span class="bg-white/90 px-3 text-[10px] font-bold uppercase text-pink-400 absolute">or</span>
      </div>

      <button onclick="loginAsGuest()" class="w-full bg-white hover:bg-pink-50 text-pink-800 font-semibold py-2 rounded-2xl border border-pink-200 transition active:scale-95 text-xs flex items-center justify-center gap-1.5 shadow-sm">
        <i data-lucide="user" class="w-4 h-4 text-pink-500"></i> Continue as Guest

    </div>

  <!-- TOP HEADER NAVBAR WITH PAGE SWITCHER & CHAT TOGGLE -->
  <header class="h-12 sm:h-14 glass px-3 flex items-center justify-between z-30 shrink-0 border-b border-pink-200/60 shadow-sm">
    <div class="flex items-center gap-2">

    <!-- MAIN PAGE TABS (LOUNGE / GAME PAGE TOGGLE) -->

    <div class="flex items-center gap-1.5">

      <canvas id="gameCanvas" class="block w-full h-full cursor-pointer touch-none"></canvas>

        <button onclick="switchChannel('sakura-lounge')" id="quick-btn-sakura-lounge" class="quick-chan-btn px-2.5 py-1 rounded-xl text-[10px] sm:text-xs font-bold bg-pink-500 text-white shadow-sm transition whitespace-nowrap">

        <button onclick="switchChannel('arcade-lounge')" id="quick-btn-arcade-lounge" class="quick-chan-btn px-2.5 py-1 rounded-xl text-[10px] sm:text-xs font-bold text-pink-800 hover:bg-pink-100 transition whitespace-nowrap">

        </button>
        <button onclick="switchChannel('onsen-hotspring')" id="quick-btn-onsen-hotspring" class="quick-chan-btn px-2.5 py-1 rounded-xl text-[10px] sm:text-xs font-bold text-pink-800 hover:bg-pink-100 transition whitespace-nowrap">
          🎋 Onsen Spring
        </button>

      <!-- Emote Toolbar Overlay -->

        <button onclick="triggerJump()" class="action-btn px-2 py-0.5 rounded-xl text-xs font-black text-pink-800 flex items-center gap-1" title="Jump / Bounce">

        <button onclick="triggerEmote('✨')" class="hover:scale-125 active:scale-90 transition text-base sm:text-lg">✨</button>
        <button onclick="triggerEmote('🍵')" class="hover:scale-125 active:scale-90 transition text-base sm:text-lg">🍵</button>
        <button onclick="triggerEmote('🎮')" class="hover:scale-125 active:scale-90 transition text-base sm:text-lg">🎮</button>

        <div id="joystick-container" class="joystick-base">

    <!-- PAGE 2: GAME PAGE (SLIME ACTION GAME) -->
    <div id="page-game-view" class="hidden flex-1 relative bg-pink-900/40 flex flex-col items-center justify-center overflow-hidden h-full w-full p-4">

        <div class="grid grid-cols-2 gap-3 max-w-xs mx-auto">
          <button onclick="startMiniGame('petal-catch')" class="p-3 rounded-2xl bg-gradient-to-r from-pink-500 to-rose-400 text-white font-bold text-xs shadow-md hover:scale-105 transition flex items-center justify-center gap-1.5">

      <!-- Drawer Room Selector -->

          <span class="text-xs font-bold text-pink-200 uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="compass" class="w-3.5 h-3.5 text-pink-400"></i> Virtual Lounge Rooms
          </span>
          <button onclick="toggleChatSidebar()" class="text-pink-300 hover:text-white p-1">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        
        <div class="grid grid-cols-3 gap-1">
          <button onclick="switchChannel('sakura-lounge')" id="chan-btn-sakura-lounge" class="chan-btn px-2 py-1.5 rounded-xl text-[10px] sm:text-xs font-bold bg-pink-500 text-white shadow-sm transition">
            🌸 Zen Garden
          </button>
          <button onclick="switchChannel('arcade-lounge')" id="chan-btn-arcade-lounge" class="chan-btn px-2 py-1.5 rounded-xl text-[10px] sm:text-xs font-medium text-pink-200 hover:bg-pink-900/50 transition">
            🕹️ Arcade
          </button>
          <button onclick="switchChannel('onsen-hotspring')" id="chan-btn-onsen-hotspring" class="chan-btn px-2 py-1.5 rounded-xl text-[10px] sm:text-xs font-medium text-pink-200 hover:bg-pink-900/50 transition">
            🎋 Onsen
          </button>
        </div>
      </div>

      <!-- Chat Log Stream -->

      <!-- Chat Input Form -->
      <div class="p-2.5 bg-pink-950/80 border-t border-pink-200/30 shrink-0">

          <input

            id="chat-input"

  <!-- CUSTOMIZATION SETTINGS MODAL -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="glass w-full max-w-sm rounded-3xl p-5 shadow-2xl border border-white space-y-4 animate-in fade-in zoom-in-95 max-h-[90dvh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-pink-200 pb-2">
        <div class="flex items-center gap-2">
          <i data-lucide="sparkles" class="w-5 h-5 text-pink-600"></i>
          <h3 class="font-bold text-pink-950 text-base">Customize Slime</h3>
        </div>
        <button onclick="toggleSettingsModal()" class="text-pink-700 hover:text-pink-900 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-1">
        <label class="text-[10px] font-bold text-pink-800 uppercase tracking-wider">Display Name</label>
        <input type="text" id="setting-username" maxlength="15" class="glass-input w-full px-3.5 py-2 rounded-xl text-xs font-semibold text-pink-950" placeholder="Your Slime Name..." />
      </div>

      <div class="space-y-1.5">

      <button onclick="saveAvatarSettings()" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-2.5 rounded-2xl shadow-lg shadow-pink-300 transition active:scale-95 flex items-center justify-center gap-2 text-xs">
        <i data-lucide="check" class="w-4 h-4"></i> Save Settings

  <script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = 'https://brvyjdtnxzjlrhukngjn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydnlqZHRueHpqbHJodWtuZ2puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTAwMjcsImV4cCI6MjEwODA4NjAyN30.2ib-m3ju3SEhJLaQHQdA8xinenbtN5MltOatIYZSZIE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- PAGE TOGGLE FUNCTIONALITY ---
    function switchMainPage(page) {
      const loungeView = document.getElementById('page-lounge-view');
      const gameView = document.getElementById('page-game-view');
      const tabLounge = document.getElementById('page-tab-lounge');
      const tabGame = document.getElementById('page-tab-game');

      if (page === 'lounge') {
        loungeView.classList.remove('hidden');
        gameView.classList.add('hidden');
        tabLounge.className = "px-3 py-1 rounded-xl text-xs font-bold bg-pink-500 text-white shadow-sm transition";
        tabGame.className = "px-3 py-1 rounded-xl text-xs font-bold text-pink-800 hover:bg-white/50 transition";
        resizeCanvas();
      } else {
        loungeView.classList.add('hidden');
        gameView.classList.remove('hidden');
        tabGame.className = "px-3 py-1 rounded-xl text-xs font-bold bg-pink-500 text-white shadow-sm transition";
        tabLounge.className = "px-3 py-1 rounded-xl text-xs font-bold text-pink-800 hover:bg-white/50 transition";
      }
    }

    function toggleChatSidebar() {
      const sidebar = document.getElementById('chat-sidebar');
      sidebar.classList.toggle('translate-x-full');
    }

    // --- PROCEDURAL AUDIO SYNTHESIZER ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let musicPlaying = false;
    let musicMasterGain = null;
    let musicTimer = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
        musicMasterGain = audioCtx.createGain();
        musicMasterGain.gain.value = 0.3;
        musicMasterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'bounce') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(220, now); osc.frequency.exponentialRampToValueAtTime(440, now + 0.12);
          gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'jump') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(650, now + 0.2);
          gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'emote') {
          osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.exponentialRampToValueAtTime(880, now + 0.18);
          gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
          osc.start(now); osc.stop(now + 0.18);
        } else if (type === 'msg') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
          gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        }
      } catch (e) {}
    }

    const PENTATONIC_SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
    function playPentatonicNote() {
      if (!musicPlaying || !audioCtx) return;
      const now = audioCtx.currentTime;
      const freq = PENTATONIC_SCALE[Math.floor(Math.random() * PENTATONIC_SCALE.length)];

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = Math.random() > 0.4 ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.12, now + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);

      osc.connect(gain); gain.connect(musicMasterGain);
      osc.start(now); osc.stop(now + 1.8);
      musicTimer = setTimeout(playPentatonicNote, Math.random() * 600 + 400);
    }

    function toggleBackgroundMusic() {
      initAudio();
      musicPlaying = !musicPlaying;
      const icon = document.getElementById('music-icon');
      const btn = document.getElementById('music-toggle-btn');

      if (musicPlaying) {
        icon.setAttribute('data-lucide', 'volume-2');
        btn.classList.add('bg-pink-200', 'text-pink-900');
        playPentatonicNote();
      } else {
        icon.setAttribute('data-lucide', 'music');
        btn.classList.remove('bg-pink-200', 'text-pink-900');
        clearTimeout(musicTimer);
      }
      lucide.createIcons();
    }

    function updateMusicVolume(val) {
      if (musicMasterGain) musicMasterGain.gain.value = parseFloat(val);
    }

    // --- AVATAR TYPES & GAME STATE ---
    const AVATAR_TYPES = {
      sakura: { name: 'Sakura Pin', bodyColor: '#f472b6', accessory: '🌸' },
      spirit: { name: 'Cat Ears', bodyColor: '#38bdf8', accessory: '🐱' },
      fox:    { name: 'Kitsune Mask', bodyColor: '#fb923c', accessory: '🦊' },
      matcha: { name: 'Matcha Boba', bodyColor: '#4ade80', accessory: '🍵' },
      crown:  { name: 'Gold Crown', bodyColor: '#a855f7', accessory: '👑' },
      bunny:  { name: 'Bunny Ears', bodyColor: '#f43f5e', accessory: '🐰' }
    };

    let currentUser = null;
    let localPlayer = {
      id: 'usr_' + Math.random().toString(36).substring(2, 9),
      name: localStorage.getItem('sakura_avatar_name') || 'Slime_' + Math.floor(100 + Math.random() * 900),
      avatarType: localStorage.getItem('sakura_avatar_type') || 'sakura',
      x: 400, y: 300, targetX: 400, targetY: 300, speed: 4.8, direction: 'down',
      isMoving: false, isJumping: false, jumpOffset: 0, jumpVelocity: 0, bouncePhase: 0,
      speechBubble: null, activeEmote: null
    };

    let remotePlayers = {};
    let floatingParticles = [];
    let currentChannel = 'sakura-lounge';
    let realtimeChannel = null;
    let petals = [];

    const chatMemory = {
      'sakura-lounge': JSON.parse(localStorage.getItem('chat_sakura-lounge') || '[]'),
      'arcade-lounge': JSON.parse(localStorage.getItem('chat_arcade-lounge') || '[]'),
      'onsen-hotspring': JSON.parse(localStorage.getItem('chat_onsen-hotspring') || '[]')
    };

    const keys = { up: false, down: false, left: false, right: false };
    const joystick = { active: false, dx: 0, dy: 0 };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const container = document.getElementById('page-lounge-view');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }

    // AUTHENTICATION HANDLERS
    let authMode = 'signin';
    function switchAuthTab(mode) {
      authMode = mode;
      document.getElementById('tab-signin').className = mode === 'signin' ? "py-2 rounded-xl bg-white shadow text-pink-900 transition" : "py-2 rounded-xl transition text-pink-600 hover:text-pink-900";
      document.getElementById('tab-signup').className = mode === 'signup' ? "py-2 rounded-xl bg-white shadow text-pink-900 transition" : "py-2 rounded-xl transition text-pink-600 hover:text-pink-900";
      document.getElementById('username-field').classList.toggle('hidden', mode === 'signin');
      document.getElementById('auth-submit-btn').querySelector('span').textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
    }

    function loginAsGuest() {
      completeUserLogin(null, 'Slime_' + Math.floor(100 + Math.random() * 900));
    }

    function completeUserLogin(user, displayName) {
      currentUser = user;
      localPlayer.name = displayName;
      if (user) localPlayer.id = user.id;
      localStorage.setItem('sakura_avatar_name', displayName);
      document.getElementById('auth-modal').classList.add('hidden');
      initSupabaseChannel(currentChannel);
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      const username = document.getElementById('auth-username').value.trim();

      try {
        if (authMode === 'signup') {
          const { data, error } = await supabaseClient.auth.signUp({ email, password, options: { data: { display_name: username || 'Slime' } } });
          if (error) throw error;
          completeUserLogin(data.user, username || email.split('@')[0]);
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          completeUserLogin(data.user, data.user.user_metadata?.display_name || email.split('@')[0]);
        }
      } catch (err) { alert(err.message); }
    }

    // CANVA DRAWING & PARTICLES
    function initEnvironmentElements() {
      petals = Array.from({ length: 30 }, () => ({
        x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight,
        size: Math.random() * 5 + 3, speedY: Math.random() * 1.2 + 0.6, speedX: Math.random() * 0.8 - 0.4
      }));
    }

    function drawEnvironment() {
      ctx.fillStyle = '#fce7f3'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(244, 114, 182, 0.2)'; ctx.lineWidth = 2;
      for (let x = 0; x < canvas.width; x += 70) {
        for (let y = 0; y < canvas.height; y += 70) ctx.strokeRect(x, y, 70, 70);
      }
    }

    function drawSlime(player, isSelf = false) {
      const { x, y, name, avatarType, direction, isMoving, isJumping, jumpOffset, speechBubble, activeEmote } = player;
      const type = AVATAR_TYPES[avatarType] || AVATAR_TYPES.sakura;

      ctx.save();
      player.bouncePhase = (player.bouncePhase || 0) + (isMoving ? 0.22 : 0.05);
      const groundBounce = isMoving ? Math.abs(Math.sin(player.bouncePhase)) * 8 : Math.sin(player.bouncePhase) * 2;
      const drawY = y - groundBounce - (jumpOffset || 0);

      ctx.translate(x, drawY);
      ctx.fillStyle = type.bodyColor;
      ctx.beginPath(); ctx.arc(0, 0, 18, Math.PI * 0.82, Math.PI * 2.18); ctx.quadraticCurveTo(0, 20, -18, 0); ctx.fill();
      ctx.restore();

      ctx.font = 'bold 10px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = isSelf ? '#ec4899' : 'rgba(255, 255, 255, 0.95)';
      ctx.fillText(name, x, drawY + 31);
    }

    function triggerJump() {
      if (!localPlayer.isJumping) {
        localPlayer.isJumping = true; localPlayer.jumpVelocity = 11; playSound('jump');
      }
    }

    function updatePlayerMovement() {
      let dx = 0, dy = 0;
      if (keys.up) dy -= 1; if (keys.down) dy += 1;
      if (keys.left) dx -= 1; if (keys.right) dx += 1;

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        localPlayer.x += (dx / len) * localPlayer.speed;
        localPlayer.y += (dy / len) * localPlayer.speed;
        localPlayer.isMoving = true;
      } else { localPlayer.isMoving = false; }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawEnvironment();
      updatePlayerMovement();
      drawSlime(localPlayer, true);
      requestAnimationFrame(render);
    }

    // REALTIME CHAT & SUPABASE
    async function initSupabaseChannel(channelName) {
      if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
      currentChannel = channelName;
      document.getElementById('room-indicator').textContent = '#' + channelName;

      realtimeChannel = supabaseClient.channel(`room_${channelName}`);
      realtimeChannel
        .on('broadcast', { event: 'chat-message' }, payload => {
          displayChatMessage(payload.payload); playSound('msg');
        })
        .subscribe();

      renderChatLogForChannel(channelName);
    }

    function renderChatLogForChannel(channel) {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      (chatMemory[channel] || []).forEach(msg => displayChatMessage(msg));
    }

    function displayChatMessage(msg) {
      const container = document.getElementById('chat-messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `flex flex-col ${msg.sender === localPlayer.name ? 'items-end' : 'items-start'} space-y-0.5 animate-in fade-in`;
      msgDiv.innerHTML = `<span class="text-[10px] font-bold text-pink-200">${msg.sender}</span><div class="px-3 py-1.5 rounded-2xl text-xs bg-white text-pink-950">${msg.content}</div>`;
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    document.getElementById('chat-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      const msgObj = { sender: localPlayer.name, content: text, channel: currentChannel };
      displayChatMessage(msgObj);
      if (realtimeChannel) realtimeChannel.send({ type: 'broadcast', event: 'chat-message', payload: msgObj });
    });

    function switchChannel(channelName) {
      initSupabaseChannel(channelName);
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', () => {
      lucide.createIcons();
      resizeCanvas();
      initEnvironmentElements();
      requestAnimationFrame(render);
    });
  </script>
</body>
</html>
