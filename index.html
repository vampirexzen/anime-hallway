<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Endless Anime Hallway - Pixel Sanctuary</title>
    <!-- Tailwind CSS for UI framing -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Press Start 2P for retro aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Supabase Client for Auth & Realtime Sync -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #0b0c10;
            color: #e0e6ed;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: #4f46e5;
            border-radius: 3px;
        }
        .pixel-border {
            border: 4px solid #1f293d;
            box-shadow: inset -4px -4px 0px 0px #0f172a, inset 4px 4px 0px 0px #384152;
        }
        .pixel-btn {
            background: #4f46e5;
            box-shadow: inset -2px -2px 0px 0px #312e81, inset 2px 2px 0px 0px #818cf8;
            transition: all 0.1s ease;
        }
        .pixel-btn:active {
            box-shadow: inset 2px 2px 0px 0px #312e81, inset -2px -2px 0px 0px #818cf8;
            transform: translateY(2px);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between relative bg-slate-950">

    <!-- GAME CANVAS CONTAINER -->
    <div id="canvasContainer" class="absolute inset-0 z-0 flex items-center justify-center bg-black">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- TOP BAR HUD -->
    <div class="relative z-10 p-3 flex justify-between items-center bg-slate-900/80 backdrop-blur-md border-b-2 border-slate-800 text-xs">
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 bg-slate-800/90 px-3 py-1.5 rounded-md border border-slate-700">
                <i class="fa-solid fa-user text-indigo-400"></i>
                <span id="playerTag" class="text-indigo-300 font-bold">AnimeWalker</span>
            </div>
            <div class="flex items-center gap-2 bg-slate-800/90 px-3 py-1.5 rounded-md border border-slate-700">
                <i class="fa-solid fa-location-dot text-amber-400"></i>
                <span id="locationTag" class="text-amber-200">Main Hallway</span>
            </div>
        </div>

        <!-- System Controls -->
        <div class="flex items-center gap-2">
            <!-- Proximity Mic Button -->
            <button id="btnMicToggle" class="pixel-btn px-3 py-2 rounded text-white flex items-center gap-2 bg-rose-600">
                <i id="micIcon" class="fa-solid fa-microphone-slash"></i>
                <span class="hidden md:inline">Mic Off</span>
            </button>
            <!-- Settings / Customizer Button -->
            <button id="btnCustomizer" class="pixel-btn px-3 py-2 rounded text-white flex items-center gap-2 bg-indigo-600">
                <i class="fa-solid fa-gear"></i>
                <span class="hidden md:inline">Settings</span>
            </button>
            <!-- Logout Button -->
            <button id="btnLogout" class="pixel-btn px-3 py-2 rounded text-white flex items-center gap-2 bg-slate-700 hidden">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </div>

    <!-- MAIN CHAT OVERLAY -->
    <div class="relative z-10 p-2 md:p-4 pointer-events-none flex justify-between items-end mb-16 md:mb-0">
        <div class="pointer-events-auto w-80 max-w-[85vw] bg-slate-900/90 border-2 border-indigo-900/60 rounded-lg p-3 flex flex-col h-48 backdrop-blur-md shadow-2xl">
            <div class="text-[10px] text-indigo-400 mb-2 border-b border-indigo-900/40 pb-1 flex justify-between items-center">
                <span><i class="fa-solid fa-comments"></i> Local Proximity Chat</span>
                <span id="peerCount" class="text-slate-400">Online: 1</span>
            </div>
            <div id="chatMessages" class="flex-1 overflow-y-auto space-y-2 pr-1 text-[10px] leading-relaxed">
                <div class="text-emerald-400"><i class="fa-solid fa-circle-info"></i> Welcome! Walk right to enter bonfire rooms and sit by the fire.</div>
            </div>
            <form id="chatForm" class="mt-2 flex gap-1">
                <input id="chatInput" type="text" maxlength="60" placeholder="Type a message..." class="flex-1 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-[10px] text-slate-200 focus:outline-none focus:border-indigo-500">
                <button type="submit" class="pixel-btn bg-indigo-600 text-white px-2 py-1 rounded text-[10px]"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <!-- MOBILE TOUCH CONTROLS -->
    <div id="mobileControls" class="relative z-20 p-4 flex justify-between items-center pointer-events-none mb-2">
        <div class="pointer-events-auto flex gap-2">
            <button id="btnLeft" class="w-14 h-14 bg-slate-800/80 active:bg-indigo-600 border-2 border-slate-600 rounded-lg flex items-center justify-center text-white text-xl shadow-lg">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button id="btnRight" class="w-14 h-14 bg-slate-800/80 active:bg-indigo-600 border-2 border-slate-600 rounded-lg flex items-center justify-center text-white text-xl shadow-lg">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
        <div class="pointer-events-auto flex gap-2">
            <button id="btnSit" class="w-14 h-14 bg-emerald-700/90 active:bg-emerald-600 border-2 border-emerald-400 rounded-full flex flex-col items-center justify-center text-white font-bold text-xs shadow-xl">
                <i class="fa-solid fa-chair text-sm"></i>
                <span class="text-[7px] mt-0.5">SIT</span>
            </button>
            <button id="btnInteract" class="w-16 h-16 bg-amber-600/90 active:bg-amber-500 border-2 border-amber-300 rounded-full flex flex-col items-center justify-center text-white font-bold text-xs shadow-xl">
                <i class="fa-solid fa-door-open text-lg"></i>
                <span class="text-[8px] mt-0.5">DOOR</span>
            </button>
        </div>
    </div>

    <!-- AUTHENTICATION / LOGIN / SIGNUP MODAL -->
    <div id="modalAuth" class="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-indigo-500 rounded-xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
            <h2 class="text-sm text-indigo-400 font-bold"><i class="fa-solid fa-shield-halved"></i> Sanctuary Login</h2>
            <p class="text-[9px] text-slate-400">Sign in with your email & password to save your display name and progress.</p>
            
            <form id="authForm" class="space-y-3 text-xs text-left">
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Email:</label>
                    <input id="authEmail" type="email" required placeholder="user@domain.com" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-200 text-xs">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Password:</label>
                    <input id="authPassword" type="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-200 text-xs">
                </div>
                <div id="displayNameGroup" class="hidden">
                    <label class="block text-[10px] text-slate-400 mb-1">Display Name:</label>
                    <input id="authDisplayName" type="text" maxlength="12" placeholder="AnimeWalker" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-indigo-300 text-xs">
                </div>

                <div id="authError" class="text-[9px] text-rose-400 text-center h-4"></div>

                <button type="submit" id="btnAuthSubmit" class="pixel-btn w-full py-2.5 rounded text-white bg-indigo-600 text-xs font-bold">
                    Login
                </button>
            </form>

            <div class="text-[9px] text-slate-400 pt-2 border-t border-slate-800">
                <span id="authSwitchText">Don't have an account?</span> 
                <button id="btnSwitchAuthMode" class="text-indigo-400 underline font-bold ml-1">Sign Up</button>
            </div>
        </div>
    </div>

    <!-- SETTINGS & PROFILE CUSTOMIZER MODAL -->
    <div id="modalCustomizer" class="fixed inset-0 z-50 bg-black/75 flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 border-2 border-indigo-500 rounded-xl p-5 max-w-sm w-full text-center space-y-4 shadow-2xl">
            <h2 class="text-sm text-indigo-400 font-bold"><i class="fa-solid fa-gear"></i> Game Settings & Profile</h2>
            
            <div class="space-y-3 text-xs text-left">
                <div>
                    <label class="block text-slate-400 mb-1">Display Name:</label>
                    <input id="inputPlayerName" type="text" maxlength="12" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-indigo-300 text-xs">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Hair Color:</label>
                    <input id="colorHair" type="color" value="#fbbf24" class="w-full h-8 bg-transparent cursor-pointer rounded">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Outfit Color:</label>
                    <input id="colorOutfit" type="color" value="#4f46e5" class="w-full h-8 bg-transparent cursor-pointer rounded">
                </div>
            </div>

            <button id="btnCloseCustomizer" class="pixel-btn w-full py-2 rounded text-white bg-indigo-600 text-xs">
                Save Changes
            </button>
        </div>
    </div>

    <!-- GAME ENGINE SCRIPT -->
    <script>
        // --- SUPABASE CLOUD CONFIGURATION ---
        const SUPABASE_URL = 'https://brvyjdtnxzjlrhukngjn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydnlqZHRueHpqbHJodWtuZ2puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTAwMjcsImV4cCI6MjEwODA4NjAyN30.2ib-m3ju3SEhJLaQHQdA8xinenbtN5MltOatIYZSZIE';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const gameChannel = supabaseClient.channel('endless_anime_sanctuary_v4');

        // --- GAME ENGINE STATE & CONSTANTS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        const VIRTUAL_WIDTH = 320;
        const VIRTUAL_HEIGHT = 180;
        let scale = 1;

        const PLAYER_SPEED = 1.5;
        const HALLWAY_GROUND_Y = 145;
        const ROOM_GROUND_Y = 150;
        const BONFIRE_X = VIRTUAL_WIDTH / 2;

        let currentUser = null;
        let localPlayer = {
            id: 'p_' + Math.random().toString(36).substr(2, 9),
            name: 'AnimeWalker',
            email: '',
            x: 40,
            y: HALLWAY_GROUND_Y,
            vx: 0,
            facing: 'right',
            state: 'idle', // 'idle', 'walk', 'sit'
            hairColor: '#fbbf24',
            outfitColor: '#4f46e5',
            currentRoom: null,
            frame: 0,
            animTimer: 0
        };

        let remotePlayers = new Map();
        let particles = [];
        const keys = { left: false, right: false };

        let isMicActive = false;
        let localAudioStream = null;

        const DOOR_SPACING = 90;
        const LEFT_WALL_X = 15;

        function resizeCanvas() {
            const scaleX = window.innerWidth / VIRTUAL_WIDTH;
            const scaleY = window.innerHeight / VIRTUAL_HEIGHT;
            scale = Math.min(scaleX, scaleY);
            canvas.width = VIRTUAL_WIDTH * scale;
            canvas.height = VIRTUAL_HEIGHT * scale;
            ctx.imageSmoothingEnabled = false;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- AUTHENTICATION & SESSION MANAGEMENT ---
        let isSignUpMode = false;
        const modalAuth = document.getElementById('modalAuth');
        const authForm = document.getElementById('authForm');
        const authEmail = document.getElementById('authEmail');
        const authPassword = document.getElementById('authPassword');
        const authDisplayName = document.getElementById('authDisplayName');
        const displayNameGroup = document.getElementById('displayNameGroup');
        const btnAuthSubmit = document.getElementById('btnAuthSubmit');
        const btnSwitchAuthMode = document.getElementById('btnSwitchAuthMode');
        const authSwitchText = document.getElementById('authSwitchText');
        const authError = document.getElementById('authError');
        const btnLogout = document.getElementById('btnLogout');

        btnSwitchAuthMode.addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            if (isSignUpMode) {
                btnAuthSubmit.innerText = "Sign Up";
                authSwitchText.innerText = "Already have an account?";
                btnSwitchAuthMode.innerText = "Login";
                displayNameGroup.classList.remove('hidden');
                authDisplayName.required = true;
            } else {
                btnAuthSubmit.innerText = "Login";
                authSwitchText.innerText = "Don't have an account?";
                btnSwitchAuthMode.innerText = "Sign Up";
                displayNameGroup.classList.add('hidden');
                authDisplayName.required = false;
            }
            authError.innerText = "";
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.innerText = "Processing...";
            const email = authEmail.value.trim();
            const password = authPassword.value.trim();

            if (isSignUpMode) {
                const name = authDisplayName.value.trim() || 'AnimeWalker';
                const { data, error } = await supabaseClient.auth.signUp({
                    email,
                    password,
                    options: { data: { display_name: name } }
                });
                if (error) {
                    authError.innerText = error.message;
                } else {
                    alert("Account created successfully! You are now logged in.");
                    initSession(data.user);
                }
            } else {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    authError.innerText = error.message;
                } else {
                    initSession(data.user);
                }
            }
        });

        async function initSession(user) {
            currentUser = user;
            modalAuth.classList.add('hidden');
            btnLogout.classList.remove('hidden');

            const metadata = user.user_metadata || {};
            localPlayer.id = user.id;
            localPlayer.email = user.email;
            localPlayer.name = metadata.display_name || user.email.split('@')[0];
            
            document.getElementById('playerTag').innerText = localPlayer.name;
            document.getElementById('inputPlayerName').value = localPlayer.name;

            // Start Supabase Realtime channel subscription
            initRealtimeSync();
        }

        btnLogout.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            location.reload();
        });

        // Check existing session on load
        window.addEventListener('load', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.user) {
                initSession(session.user);
            } else {
                modalAuth.classList.remove('hidden');
            }
            gameLoop();
        });

        function initRealtimeSync() {
            gameChannel
                .on('broadcast', { event: 'state' }, ({ payload }) => {
                    if (payload.id !== localPlayer.id) {
                        remotePlayers.set(payload.id, payload);
                        updatePeerCountUI();
                    }
                })
                .on('broadcast', { event: 'chat' }, ({ payload }) => {
                    if (payload.id !== localPlayer.id) {
                        addChatMessage(payload.author, payload.text);
                    }
                })
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        console.log('Realtime synchronization active.');
                    }
                });
        }

        function broadcastPlayerState() {
            if (!currentUser) return;
            gameChannel.send({
                type: 'broadcast',
                event: 'state',
                payload: localPlayer
            });
        }

        function updatePeerCountUI() {
            document.getElementById('peerCount').innerText = `Online: ${remotePlayers.size + 1}`;
        }

        // --- PIXEL ART RENDERING ENGINE ---
        const PixelArt = {
            drawCharacter(ctx, x, y, player, isLocal = false) {
                ctx.save();
                ctx.translate(Math.round(x), Math.round(y));

                if (player.facing === 'left') {
                    ctx.scale(-1, 1);
                }

                const animOffset = player.state === 'walk' ? Math.sin(player.frame * 0.5) * 1.5 : 0;
                const bobbing = player.state === 'idle' ? Math.sin(Date.now() * 0.005) * 0.5 : 0;
                const isSitting = player.state === 'sit';

                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.ellipse(0, 0, 7, 2.5, 0, 0, Math.PI * 2);
                ctx.fill();

                if (isSitting) {
                    // Sitting Pose
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(-3, -2, 3, 3); // Sitting legs
                    ctx.fillStyle = player.outfitColor || '#4f46e5';
                    ctx.fillRect(-4, -9, 8, 6); // Torso sitting
                    ctx.fillStyle = '#ffedd5';
                    ctx.fillRect(-4, -16, 8, 7); // Head sitting
                    ctx.fillStyle = player.hairColor || '#fbbf24';
                    ctx.fillRect(-5, -18, 10, 4);
                } else {
                    // Standing / Walking Pose
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(-3, -4, 2, 4);
                    ctx.fillRect(1, -4, 2, 4);

                    ctx.fillStyle = player.outfitColor || '#4f46e5';
                    ctx.fillRect(-4, -12 + bobbing, 8, 8);

                    ctx.fillStyle = '#f87171';
                    ctx.fillRect(-5, -11 + bobbing, 2, 6);
                    ctx.fillRect(3, -11 + bobbing, 2, 6);

                    ctx.fillStyle = '#ffedd5';
                    ctx.fillRect(-4, -20 + bobbing, 8, 8);

                    ctx.fillStyle = '#1e1b4b';
                    ctx.fillRect(1, -17 + bobbing, 2, 3);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(2, -17 + bobbing, 1, 1);

                    ctx.fillStyle = player.hairColor || '#fbbf24';
                    ctx.fillRect(-5, -22 + bobbing, 10, 4);
                    ctx.fillRect(-5, -18 + bobbing, 3, 5);
                    ctx.fillRect(2, -18 + bobbing, 3, 3);
                }

                ctx.restore();
                ctx.save();
                ctx.font = '5px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillStyle = isLocal ? '#a7f3d0' : '#e0e7ff';
                ctx.fillText(player.name, Math.round(x), Math.round(y - (isSitting ? 20 : 25)));
                ctx.restore();
            },

            drawDoor(ctx, x, y, doorNumber) {
                ctx.save();
                ctx.translate(Math.round(x), Math.round(y));
                ctx.fillStyle = '#331900';
                ctx.fillRect(-12, -32, 24, 32);
                ctx.fillStyle = '#78350f';
                ctx.fillRect(-10, -30, 20, 30);
                ctx.fillStyle = '#451a03';
                ctx.fillRect(-8, -27, 16, 10);
                ctx.fillRect(-8, -14, 16, 12);
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(5, -15, 2, 2);
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(-6, -36, 12, 6);
                ctx.fillStyle = '#f59e0b';
                ctx.font = '4px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText(doorNumber, 0, -31);
                ctx.restore();
            },

            drawSealedWall(ctx, x) {
                ctx.save();
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(x - 15, 0, 15, VIRTUAL_HEIGHT);
                ctx.fillStyle = '#1e293b';
                for (let y = 10; y < VIRTUAL_HEIGHT; y += 12) {
                    ctx.fillRect(x - 12, y, 10, 5);
                }
                ctx.fillStyle = '#dc2626';
                ctx.fillRect(x - 10, 60, 8, 8);
                ctx.fillStyle = '#ffffff';
                ctx.font = '5px "Press Start 2P"';
                ctx.fillText('X', x - 8, 66);
                ctx.restore();
            },

            drawBonfireRoom(ctx) {
                // Background wall
                ctx.fillStyle = '#1e1b4b';
                ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

                // Brick Patterns & Lanterns
                ctx.fillStyle = '#312e81';
                for (let x = 10; x < VIRTUAL_WIDTH; x += 25) {
                    ctx.fillRect(x, 10, 12, 120);
                }
                // Wall Lanterns
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(80, 45, 6, 8);
                ctx.fillRect(234, 45, 6, 8);

                // Floor
                ctx.fillStyle = '#451a03';
                ctx.fillRect(0, ROOM_GROUND_Y, VIRTUAL_WIDTH, VIRTUAL_HEIGHT - ROOM_GROUND_Y);
                ctx.fillStyle = '#78350f';
                ctx.fillRect(0, ROOM_GROUND_Y, VIRTUAL_WIDTH, 2);

                // Sitting Log Benches on both sides of bonfire
                ctx.fillStyle = '#78350f';
                ctx.fillRect(BONFIRE_X - 65, ROOM_GROUND_Y - 6, 28, 6);
                ctx.fillRect(BONFIRE_X + 37, ROOM_GROUND_Y - 6, 28, 6);

                // Bonfire Center
                const frame = Math.floor(Date.now() / 100);
                ctx.fillStyle = '#451a03';
                ctx.fillRect(BONFIRE_X - 10, ROOM_GROUND_Y - 3, 20, 4);
                
                const fireColors = ['#f59e0b', '#ef4444', '#facc15'];
                for (let i = 0; i < 6; i++) {
                    const color = fireColors[(i + frame) % fireColors.length];
                    const fx = BONFIRE_X + (Math.sin(frame * 0.2 + i) * 4);
                    const fy = ROOM_GROUND_Y - 6 - (i * 3);
                    const size = Math.max(1, 6 - i);
                    ctx.fillStyle = color;
                    ctx.fillRect(fx - size / 2, fy, size, size);
                }

                // Warm lighting
                const gradient = ctx.createRadialGradient(BONFIRE_X, ROOM_GROUND_Y - 15, 2, BONFIRE_X, ROOM_GROUND_Y - 15, 75);
                gradient.addColorStop(0, 'rgba(245, 158, 11, 0.3)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(BONFIRE_X, ROOM_GROUND_Y - 15, 75, 0, Math.PI * 2);
                ctx.fill();
            }
        };

        function spawnParticle(x, y, color, vx, vy, life) {
            particles.push({ x, y, color, vx, vy, life, maxLife: life });
        }

        function updateAndDrawParticles(ctx) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
                ctx.fillRect(Math.round(p.x), Math.round(p.y), 1.5, 1.5);
                ctx.globalAlpha = 1.0;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function updateGame() {
            if (localPlayer.state !== 'sit') {
                if (keys.left) {
                    localPlayer.vx = -PLAYER_SPEED;
                    localPlayer.facing = 'left';
                    localPlayer.state = 'walk';
                } else if (keys.right) {
                    localPlayer.vx = PLAYER_SPEED;
                    localPlayer.facing = 'right';
                    localPlayer.state = 'walk';
                } else {
                    localPlayer.vx = 0;
                    localPlayer.state = 'idle';
                }

                localPlayer.x += localPlayer.vx;

                if (localPlayer.currentRoom === null) {
                    if (localPlayer.x < LEFT_WALL_X + 8) localPlayer.x = LEFT_WALL_X + 8;
                } else {
                    if (localPlayer.x < 20) localPlayer.x = 20;
                    if (localPlayer.x > VIRTUAL_WIDTH - 20) localPlayer.x = VIRTUAL_WIDTH - 20;
                }

                if (localPlayer.state === 'walk') {
                    localPlayer.animTimer++;
                    if (localPlayer.animTimer % 8 === 0) {
                        localPlayer.frame++;
                        spawnParticle(localPlayer.x, localPlayer.y, 'rgba(148, 163, 184, 0.4)', (Math.random() - 0.5) * 0.4, -0.2, 12);
                    }
                }
            }

            broadcastPlayerState();
        }

        function drawHallway(cameraX) {
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

            ctx.fillStyle = '#0f172a';
            const startCol = Math.floor(cameraX / 20) - 1;
            for (let i = 0; i < 20; i++) {
                ctx.fillRect((startCol + i) * 20 - cameraX, 20, 18, 100);
            }

            ctx.fillStyle = '#1e1b4b';
            ctx.fillRect(0, HALLWAY_GROUND_Y, VIRTUAL_WIDTH, VIRTUAL_HEIGHT - HALLWAY_GROUND_Y);
            ctx.fillStyle = '#312e81';
            ctx.fillRect(0, HALLWAY_GROUND_Y, VIRTUAL_WIDTH, 2);

            const startDoorIndex = Math.floor((cameraX - 50) / DOOR_SPACING);
            for (let i = 0; i < 5; i++) {
                const doorIdx = Math.max(1, startDoorIndex + i);
                const doorWorldX = doorIdx * DOOR_SPACING;
                const doorScreenX = doorWorldX - cameraX;

                PixelArt.drawDoor(ctx, doorScreenX, HALLWAY_GROUND_Y, `#${doorIdx}`);

                if (Math.abs(localPlayer.x - doorWorldX) < 15 && localPlayer.currentRoom === null) {
                    ctx.save();
                    ctx.font = '5px "Press Start 2P"';
                    ctx.fillStyle = '#facc15';
                    ctx.textAlign = 'center';
                    ctx.fillText('[E] Enter', doorScreenX, HALLWAY_GROUND_Y - 42);
                    ctx.restore();
                }
            }

            PixelArt.drawSealedWall(ctx, LEFT_WALL_X - cameraX);
        }

        function renderGame() {
            ctx.save();
            ctx.scale(scale, scale);

            let cameraX = 0;
            if (localPlayer.currentRoom === null) {
                cameraX = Math.max(0, localPlayer.x - VIRTUAL_WIDTH / 2);
                drawHallway(cameraX);
            } else {
                PixelArt.drawBonfireRoom(ctx);
                PixelArt.drawDoor(ctx, 30, ROOM_GROUND_Y, 'Exit');
                if (Math.abs(localPlayer.x - 30) < 15) {
                    ctx.save();
                    ctx.font = '5px "Press Start 2P"';
                    ctx.fillStyle = '#facc15';
                    ctx.textAlign = 'center';
                    ctx.fillText('[E] Exit', 30, ROOM_GROUND_Y - 42);
                    ctx.restore();
                }
            }

            remotePlayers.forEach(p => {
                if (p.currentRoom === localPlayer.currentRoom) {
                    const screenX = localPlayer.currentRoom === null ? p.x - cameraX : p.x;
                    PixelArt.drawCharacter(ctx, screenX, p.y, p, false);
                }
            });

            const playerScreenX = localPlayer.currentRoom === null ? localPlayer.x - cameraX : localPlayer.x;
            PixelArt.drawCharacter(ctx, playerScreenX, localPlayer.y, localPlayer, true);

            updateAndDrawParticles(ctx);
            ctx.restore();
        }

        function gameLoop() {
            updateGame();
            renderGame();
            requestAnimationFrame(gameLoop);
        }

        function handleInteraction() {
            if (localPlayer.currentRoom === null) {
                const doorIdx = Math.round(localPlayer.x / DOOR_SPACING);
                const doorX = doorIdx * DOOR_SPACING;
                if (Math.abs(localPlayer.x - doorX) < 18 && doorIdx >= 1) {
                    localPlayer.currentRoom = doorIdx;
                    localPlayer.x = 45;
                    localPlayer.y = ROOM_GROUND_Y;
                    localPlayer.state = 'idle';
                    document.getElementById('locationTag').innerText = `Room #${doorIdx}`;
                    addChatMessage('System', `Entered Cozy Room #${doorIdx}`, 'text-amber-400');
                }
            } else {
                if (Math.abs(localPlayer.x - 30) < 18) {
                    const prevRoom = localPlayer.currentRoom;
                    localPlayer.x = prevRoom * DOOR_SPACING;
                    localPlayer.y = HALLWAY_GROUND_Y;
                    localPlayer.currentRoom = null;
                    localPlayer.state = 'idle';
                    document.getElementById('locationTag').innerText = 'Main Hallway';
                    addChatMessage('System', `Exited back to Hallway`, 'text-indigo-400');
                }
            }
        }

        function toggleSit() {
            if (localPlayer.currentRoom !== null) {
                if (localPlayer.state === 'sit') {
                    localPlayer.state = 'idle';
                    localPlayer.y = ROOM_GROUND_Y;
                } else {
                    // Snap to nearest bench
                    const leftBenchX = BONFIRE_X - 50;
                    const rightBenchX = BONFIRE_X + 50;
                    const targetBenchX = Math.abs(localPlayer.x - leftBenchX) < Math.abs(localPlayer.x - rightBenchX) ? leftBenchX : rightBenchX;
                    localPlayer.x = targetBenchX;
                    localPlayer.y = ROOM_GROUND_Y;
                    localPlayer.state = 'sit';
                }
            }
        }

        // --- CONTROLS ---
        window.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
            if (e.key === 'e' || e.key === 'E' || e.key === ' ') handleInteraction();
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') toggleSit();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
        });

        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnInteract = document.getElementById('btnInteract');
        const btnSit = document.getElementById('btnSit');

        const bindTouch = (elem, onPress, onRelease) => {
            elem.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
            elem.addEventListener('touchend', (e) => { e.preventDefault(); onRelease(); });
            elem.addEventListener('mousedown', onPress);
            elem.addEventListener('mouseup', onRelease);
        };

        bindTouch(btnLeft, () => { keys.left = true; }, () => { keys.left = false; });
        bindTouch(btnRight, () => { keys.right = true; }, () => { keys.right = false; });
        btnInteract.addEventListener('click', handleInteraction);
        btnSit.addEventListener('click', toggleSit);

        // --- CHAT SYSTEM ---
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const chatMessages = document.getElementById('chatMessages');

        function addChatMessage(sender, msg, colorClass = 'text-slate-200') {
            const div = document.createElement('div');
            div.className = `${colorClass} break-words`;
            div.innerHTML = `<span class="font-bold">${sender}:</span> ${msg}`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (text.length > 0) {
                addChatMessage(localPlayer.name, text, 'text-indigo-300');
                gameChannel.send({
                    type: 'broadcast',
                    event: 'chat',
                    payload: { id: localPlayer.id, author: localPlayer.name, text }
                });
                chatInput.value = '';
                chatInput.blur();
            }
        });

        // --- PROXIMITY VOICE CHAT ---
        const btnMicToggle = document.getElementById('btnMicToggle');
        const micIcon = document.getElementById('micIcon');

        btnMicToggle.addEventListener('click', async () => {
            if (!isMicActive) {
                try {
                    localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    isMicActive = true;
                    btnMicToggle.classList.remove('bg-rose-600');
                    btnMicToggle.classList.add('bg-emerald-600');
                    micIcon.className = 'fa-solid fa-microphone';
                    addChatMessage('Voice', 'Microphone active.', 'text-emerald-400');
                } catch (err) {
                    addChatMessage('Voice Error', 'Mic permission denied.', 'text-rose-400');
                }
            } else {
                if (localAudioStream) localAudioStream.getTracks().forEach(t => t.stop());
                isMicActive = false;
                btnMicToggle.classList.remove('bg-emerald-600');
                btnMicToggle.classList.add('bg-rose-600');
                micIcon.className = 'fa-solid fa-microphone-slash';
                addChatMessage('Voice', 'Microphone muted.', 'text-amber-400');
            }
        });

        // --- IN-GAME SETTINGS / PROFILE MODAL ---
        const btnCustomizer = document.getElementById('btnCustomizer');
        const modalCustomizer = document.getElementById('modalCustomizer');
        const btnCloseCustomizer = document.getElementById('btnCloseCustomizer');

        btnCustomizer.addEventListener('click', () => modalCustomizer.classList.remove('hidden'));
        btnCloseCustomizer.addEventListener('click', async () => {
            const newName = document.getElementById('inputPlayerName').value.trim() || 'AnimeWalker';
            localPlayer.name = newName;
            localPlayer.hairColor = document.getElementById('colorHair').value;
            localPlayer.outfitColor = document.getElementById('colorOutfit').value;
            document.getElementById('playerTag').innerText = newName;

            // Update user metadata in Supabase
            await supabaseClient.auth.updateUser({
                data: { display_name: newName }
            });

            modalCustomizer.classList.add('hidden');
        });
    </script>
</body>
</html>
