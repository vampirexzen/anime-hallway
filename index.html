<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sakura Slime Lounge 🌸 - 2D Virtual World</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Yuji+Mai&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 50%, #f472b6 100%);
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }

    .font-sakura {
      font-family: 'Yuji Mai', serif;
    }

    /* Glassmorphism Styles */
    .glass {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    .glass-dark {
      background: rgba(255, 241, 248, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(244, 114, 182, 0.35);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(244, 114, 182, 0.4);
    }

    .glass-input:focus {
      background: rgba(255, 255, 255, 0.98);
      border-color: #ec4899;
      outline: none;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.25);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(244, 114, 182, 0.5);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(236, 72, 153, 0.8);
    }

    /* Controls UI */
    .dpad-btn {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(244, 114, 182, 0.5);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .dpad-btn:active {
      background: rgba(236, 72, 153, 0.85);
      color: white;
      transform: scale(0.92);
    }

    /* Animated pulse glow */
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(236, 72, 153, 0.6)); }
      50% { filter: drop-shadow(0 0 14px rgba(236, 72, 153, 0.9)); }
    }
    .glow-effect {
      animation: pulseGlow 3s infinite ease-in-out;
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden select-none">

  <!-- AUTH MODAL OVERLAY -->
  <div id="auth-modal" class="fixed inset-0 z-50 bg-pink-950/40 backdrop-blur-md flex items-center justify-center p-4">
    <div class="glass w-full max-w-md rounded-3xl p-6 md:p-8 shadow-2xl border border-white space-y-5 animate-in fade-in zoom-in-95 duration-200">
      
      <!-- Auth Header -->
      <div class="text-center space-y-1">
        <div class="inline-flex p-3 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-400 text-white shadow-lg shadow-pink-300 mb-1">
          <i data-lucide="sparkles" class="w-7 h-7"></i>
        </div>
        <h2 class="font-sakura text-2xl font-bold text-pink-950">Sakura Slime World</h2>
        <p class="text-xs text-pink-600 font-medium">Sign in to sync your profile & friends across devices</p>
      </div>

      <!-- Auth Tabs -->
      <div class="grid grid-cols-2 gap-1 p-1 bg-pink-100/80 rounded-2xl text-xs font-bold text-pink-800">
        <button id="tab-signin" onclick="switchAuthTab('signin')" class="py-2.5 rounded-xl bg-white shadow text-pink-900 transition">Sign In</button>

      <div class="relative flex items-center justify-center my-2">

        <span class="bg-white/80 px-3 text-[10px] font-bold uppercase text-pink-400 absolute">or</span>

        <i data-lucide="user" class="w-4 h-4 text-pink-500"></i> Continue as Guest Slime

  </div>

  <!-- Top Navigation Header -->
  <header class="h-14 glass px-4 flex items-center justify-between z-30 shrink-0 border-b border-pink-200/60 shadow-sm">

        <button onclick="triggerEmote('🍵')" class="hover:scale-125 active:scale-90 transition text-lg p-1" title="Matcha Tea">🍵</button>
        <button onclick="triggerEmote('😂')" class="hover:scale-125 active:scale-90 transition text-lg p-1" title="Laugh">😂</button>

        <button onclick="triggerEmote('🎮')" class="hover:scale-125 active:scale-90 transition text-lg p-1" title="Gaming">🎮</button>
        <button onclick="triggerEmote('💬')" class="hover:scale-125 active:scale-90 transition text-lg p-1" title="Talk">💬</button>

      <!-- On-Screen Controls Hint Overlay (Fades out) -->

    <!-- Sidebar Chat Box -->
    <aside id="chat-sidebar" class="w-full md:w-80 lg:w-96 glass-dark border-l border-pink-200/80 flex flex-col justify-between absolute md:relative right-0 top-0 bottom-0 z-20 transition-transform duration-300 transform translate-x-full md:translate-x-0 shadow-2xl md:shadow-none">
      
      <!-- Sidebar Channels Header -->
      <div class="p-3.5 border-b border-pink-200/80 bg-white/60 flex flex-col gap-2">

          <span class="text-xs font-bold text-pink-800 uppercase tracking-wider flex items-center gap-1.5">

  <!-- Customization Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="glass w-full max-w-md rounded-3xl p-6 shadow-2xl border border-white space-y-5 animate-in fade-in zoom-in-95 duration-200">
      <div class="flex items-center justify-between border-b border-pink-200/80 pb-3">
        <div class="flex items-center gap-2">
          <i data-lucide="sparkles" class="w-5 h-5 text-pink-600"></i>
          <h3 class="font-bold text-pink-950 text-lg">Customize Slime Companion</h3>
        </div>
        <button onclick="toggleSettingsModal()" class="text-pink-700 hover:text-pink-900 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Username Customization -->
      <div class="space-y-1.5">
        <label class="text-xs font-bold text-pink-800 uppercase tracking-wider">Display Name</label>
        <input type="text" id="setting-username" maxlength="15" class="glass-input w-full px-3.5 py-2.5 rounded-xl text-sm font-semibold text-pink-950" placeholder="Your Slime Name..." />
      </div>

      <!-- Slime Preset Selection -->
      <div class="space-y-2">
        <label class="text-xs font-bold text-pink-800 uppercase tracking-wider">Choose Slime Style & Accessory</label>
        <div class="grid grid-cols-2 gap-3" id="avatar-picker">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <!-- Save Button -->
      <button onclick="saveAvatarSettings()" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 rounded-2xl shadow-lg shadow-pink-300 transition active:scale-95 flex items-center justify-center gap-2">
        <i data-lucide="check" class="w-5 h-5"></i> Save & Bouncing Around
      </button>
    </div>
  </div>

  <script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = 'https://brvyjdtnxzjlrhukngjn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydnlqZHRueHpqbHJodWtuZ2puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTAwMjcsImV4cCI6MjEwODA4NjAyN30.2ib-m3ju3SEhJLaQHQdA8xinenbtN5MltOatIYZSZIE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- SOUND EFFECTS SYNTHESIZER (Web Audio API) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'bounce') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'emote') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.2); // A5
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'msg') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        }
      } catch (e) {
        // Ignore audio failures on muted browsers
      }
    }

    // --- SLIME TYPES & ACCESSORIES PRESETS ---
    const AVATAR_TYPES = {
      sakura: { name: 'Sakura Slime', bodyColor: '#f472b6', accentColor: '#fb7185', accessory: '🌸' },
      spirit: { name: 'Ocean Neko', bodyColor: '#38bdf8', accentColor: '#0284c7', accessory: '🐱' },
      fox:    { name: 'Kitsune Slime', bodyColor: '#fb923c', accentColor: '#c2410c', accessory: '🦊' },
      matcha: { name: 'Matcha Boba', bodyColor: '#4ade80', accentColor: '#15803d', accessory: '🍵' },
      crown:  { name: 'Royal Slime', bodyColor: '#a855f7', accentColor: '#7e22ce', accessory: '👑' },
      bunny:  { name: 'Bunny Slime', bodyColor: '#f43f5e', accentColor: '#be123c', accessory: '🐰' }
    };

    // --- GAME & PLAYER STATE ---
    let currentUser = null;
    let localPlayer = {
      id: 'usr_' + Math.random().toString(36).substring(2, 9),
      name: localStorage.getItem('sakura_avatar_name') || 'Slime_' + Math.floor(100 + Math.random() * 900),
      avatarType: localStorage.getItem('sakura_avatar_type') || 'sakura',
      x: 400,
      y: 300,
      targetX: 400,
      targetY: 300,
      speed: 4.5,
      direction: 'down',
      isMoving: false,
      bounceOffset: 0,
      bouncePhase: 0,
      scaleX: 1,
      scaleY: 1,
      speechBubble: null,
      activeEmote: null // { emoji: '', expiresAt: 0 }
    };

    let remotePlayers = {};
    let floatingParticles = [];
    let currentChannel = 'sakura-lounge';
    let realtimeChannel = null;
    let petals = [];

    // --- PERSISTENT CHAT MEMORY ---
    const chatMemory = {
      'sakura-lounge': JSON.parse(localStorage.getItem('chat_sakura-lounge') || '[]'),
      'gaming-shrine': JSON.parse(localStorage.getItem('chat_gaming-shrine') || '[]'),
      'arcade-lounge': JSON.parse(localStorage.getItem('chat_arcade-lounge') || '[]')
    };

    // Keyboard state
    const keys = { up: false, down: false, left: false, right: false };

    // Canvas Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const container = document.getElementById('canvas-container');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }

    // --- AUTHENTICATION HANDLERS ---
    let authMode = 'signin'; // 'signin' or 'signup'

    function switchAuthTab(mode) {
      authMode = mode;
      const tabSignIn = document.getElementById('tab-signin');
      const tabSignUp = document.getElementById('tab-signup');
      const usernameField = document.getElementById('username-field');
      const submitBtn = document.getElementById('auth-submit-btn');

      if (mode === 'signin') {
        tabSignIn.className = "py-2.5 rounded-xl bg-white shadow text-pink-900 transition";
        tabSignUp.className = "py-2.5 rounded-xl transition text-pink-600 hover:text-pink-900";
        usernameField.classList.add('hidden');
        submitBtn.querySelector('span').textContent = 'Sign In';
      } else {
        tabSignUp.className = "py-2.5 rounded-xl bg-white shadow text-pink-900 transition";
        tabSignIn.className = "py-2.5 rounded-xl transition text-pink-600 hover:text-pink-900";
        usernameField.classList.remove('hidden');
        submitBtn.querySelector('span').textContent = 'Create Account';
      }
      hideAuthAlert();
    }

    function showAuthAlert(msg, isError = true) {
      const alert = document.getElementById('auth-alert');
      alert.classList.remove('hidden', 'bg-rose-100', 'text-rose-800', 'border-rose-300', 'bg-emerald-100', 'text-emerald-800', 'border-emerald-300');
      if (isError) {
        alert.classList.add('bg-rose-100', 'text-rose-800', 'border-rose-300');
      } else {
        alert.classList.add('bg-emerald-100', 'text-emerald-800', 'border-emerald-300');
      }
      alert.textContent = msg;
    }

    function hideAuthAlert() {
      document.getElementById('auth-alert').classList.add('hidden');
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      const username = document.getElementById('auth-username').value.trim();

      hideAuthAlert();

      try {
        if (authMode === 'signup') {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { display_name: username || 'Slime' } }
          });
          if (error) throw error;
          
          showAuthAlert('Account created successfully! Logging you in...', false);
          setTimeout(() => completeUserLogin(data.user, username || email.split('@')[0]), 1000);
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;

          showAuthAlert('Welcome back! Loading world...', false);
          const dispName = data.user.user_metadata?.display_name || email.split('@')[0];
          setTimeout(() => completeUserLogin(data.user, dispName), 800);
        }
      } catch (err) {
        showAuthAlert(err.message || 'Authentication failed. Please try again.');
      }
    }

    function loginAsGuest() {
      const guestName = 'Slime_' + Math.floor(100 + Math.random() * 900);
      completeUserLogin(null, guestName);
    }

    function completeUserLogin(user, displayName) {
      currentUser = user;
      localPlayer.name = displayName;
      if (user) localPlayer.id = user.id;

      localStorage.setItem('sakura_avatar_name', displayName);

      // UI updates
      document.getElementById('auth-modal').classList.add('hidden');
      document.getElementById('user-profile-badge').classList.remove('hidden');
      document.getElementById('user-display-name').textContent = displayName;

      // Initialize Supabase realtime channel after login
      initSupabaseChannel(currentChannel);
    }

    async function handleSignOut() {
      if (currentUser) {
        await supabaseClient.auth.signOut();
      }
      location.reload();
    }

    // --- PETALS & PARTICLES ANIMATIONS ---
    function initPetals() {
      petals = [];
      for (let i = 0; i < 50; i++) {
        petals.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          size: Math.random() * 6 + 4,
          speedY: Math.random() * 1.2 + 0.6,
          speedX: Math.random() * 0.8 - 0.4,
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.03
        });
      }
    }

    function updateAndDrawPetals() {
      ctx.fillStyle = 'rgba(251, 207, 232, 0.85)';
      petals.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX + Math.sin(p.y * 0.015) * 0.4;
        p.rotation += p.rotSpeed;

        if (p.y > canvas.height + 15) {
          p.y = -15;
          p.x = Math.random() * canvas.width;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    // Floating Emote Particles System
    function addFloatingParticle(x, y, text) {
      for (let i = 0; i < 4; i++) {
        floatingParticles.push({
          x: x + (Math.random() - 0.5) * 20,
          y: y - 20,
          vx: (Math.random() - 0.5) * 1.5,
          vy: -Math.random() * 2 - 1.5,
          alpha: 1,
          size: Math.random() * 8 + 14,
          text: text
        });
      }
    }

    function updateAndDrawParticles() {
      for (let i = floatingParticles.length - 1; i >= 0; i--) {
        const p = floatingParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.02;

        if (p.alpha <= 0) {
          floatingParticles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.font = `${p.size}px sans-serif`;
        ctx.fillText(p.text, p.x, p.y);
        ctx.restore();
      }
    }

    // --- MAP & ENVIRONMENT DRAWING ---
    function drawEnvironment() {
      const w = canvas.width;
      const h = canvas.height;

      if (currentChannel === 'sakura-lounge') {
        // Soft Tatami Zen Floor
        ctx.fillStyle = '#fce7f3';
        ctx.fillRect(0, 0, w, h);

        // Tatami Tiles
        ctx.strokeStyle = 'rgba(244, 114, 182, 0.25)';
        ctx.lineWidth = 2;
        const tileSize = 90;
        for (let x = 0; x < w; x += tileSize) {
          for (let y = 0; y < h; y += tileSize) {
            ctx.strokeRect(x, y, tileSize, tileSize);
          }
        }

        // Zen Koi Pond
        drawPond(w / 2, h / 2 + 60, 130, 70);

        // Blooming Sakura Trees
        drawSakuraTree(110, 110, 52);
        drawSakuraTree(w - 110, 110, 52);
        drawSakuraTree(120, h - 120, 48);
        drawSakuraTree(w - 120, h - 120, 48);

        // Stone Lanterns
        drawLantern(220, 100);
        drawLantern(w - 220, 100);

      } else if (currentChannel === 'gaming-shrine') {
        // Red Shrine Courtyard
        ctx.fillStyle = '#fbcfe8';
        ctx.fillRect(0, 0, w, h);

        // Stone Tile Pattern
        ctx.strokeStyle = 'rgba(225, 29, 72, 0.15)';
        ctx.lineWidth = 1.5;
        for (let x = 0; x < w; x += 60) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
        }

        // Torii Gate
        drawToriiGate(w / 2, 130);

        // Framing Cherry Trees
        drawSakuraTree(80, 120, 42);
        drawSakuraTree(w - 80, 120, 42);
        drawSakuraTree(w / 2 - 200, 180, 45);
        drawSakuraTree(w / 2 + 200, 180, 45);

        drawLantern(w / 2 - 110, 160);
        drawLantern(w / 2 + 110, 160);

      } else if (currentChannel === 'arcade-lounge') {
        // Cyber Arcade Room
        ctx.fillStyle = '#2e1065';
        ctx.fillRect(0, 0, w, h);

        // Cyber Grid Lines
        ctx.strokeStyle = 'rgba(236, 72, 153, 0.25)';
        ctx.lineWidth = 1;
        for (let x = 0; x < w; x += 50) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
        }
        for (let y = 0; y < h; y += 50) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }

        // Neon Cabinets
        drawArcadeCabinet(120, 100, '#ec4899', 'PAC-SLIME');
        drawArcadeCabinet(220, 100, '#8b5cf6', 'NEON BOUNCE');
        drawArcadeCabinet(w - 220, 100, '#06b6d4', 'BOBA HERO');
        drawArcadeCabinet(w - 120, 100, '#f59e0b', 'CHIBI KOI');
      }

      // Outer Glow Frame
      ctx.lineWidth = 8;
      ctx.strokeStyle = 'rgba(244, 114, 182, 0.4)';
      ctx.strokeRect(0, 0, w, h);
    }

    // --- MAP HELPERS ---
    function drawSakuraTree(x, y, radius) {
      // Tree Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
      ctx.beginPath();
      ctx.ellipse(x, y + radius * 0.7, radius * 0.9, radius * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      // Trunk
      ctx.strokeStyle = '#7c2d12';
      ctx.lineWidth = Math.max(6, radius * 0.2);
      ctx.beginPath();
      ctx.moveTo(x, y + radius * 0.6);
      ctx.quadraticCurveTo(x - 5, y + 10, x, y - radius * 0.2);
      ctx.stroke();

      // Canopy Clusters
      const clusters = [
        { dx: 0, dy: -radius * 0.4, r: radius * 0.6, color: '#f472b6' },
        { dx: -radius * 0.4, dy: -radius * 0.1, r: radius * 0.5, color: '#ec4899' },
        { dx: radius * 0.4, dy: -radius * 0.1, r: radius * 0.5, color: '#f472b6' },
        { dx: -radius * 0.2, dy: -radius * 0.6, r: radius * 0.45, color: '#fbcfe8' },
        { dx: radius * 0.2, dy: -radius * 0.6, r: radius * 0.45, color: '#fbcfe8' }
      ];

      clusters.forEach(c => {
        ctx.fillStyle = c.color;
        ctx.beginPath();
        ctx.arc(x + c.dx, y + c.dy, c.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawPond(x, y, rx, ry) {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.45)';
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Lily Pads
      ctx.fillStyle = '#22c55e';
      ctx.beginPath(); ctx.arc(x - 30, y - 10, 12, 0, Math.PI * 1.8); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 40, y + 10, 15, 0, Math.PI * 1.8); ctx.fill();
    }

    function drawToriiGate(x, y) {
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(x - 60, y - 60, 12, 80);
      ctx.fillRect(x + 48, y - 60, 12, 80);
      ctx.fillRect(x - 80, y - 60, 160, 14);
      ctx.fillRect(x - 70, y - 42, 140, 10);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(x - 84, y - 66, 168, 6);
    }

    function drawLantern(x, y) {
      const glow = ctx.createRadialGradient(x, y, 4, x, y, 28);
      glow.addColorStop(0, 'rgba(253, 224, 71, 0.6)');
      glow.addColorStop(1, 'rgba(253, 224, 71, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(x, y, 28, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#f97316';
      ctx.beginPath(); ctx.roundRect(x - 10, y - 12, 20, 24, 4); ctx.fill();
      ctx.fillStyle = '#451a03';
      ctx.fillRect(x - 12, y - 16, 24, 4);
      ctx.fillRect(x - 12, y + 12, 24, 4);
    }

    function drawArcadeCabinet(x, y, color, title) {
      ctx.fillStyle = '#1e1b4b';
      ctx.fillRect(x - 22, y - 40, 44, 70);
      ctx.fillStyle = color;
      ctx.fillRect(x - 20, y - 38, 40, 15);
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(x - 18, y - 20, 36, 26);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 7px "Plus Jakarta Sans"';
      ctx.textAlign = 'center';
      ctx.fillText(title, x, y - 7);
    }

    // --- REFINED BOUNCY SLIME ANIMATION & DRAWING ---
    function drawSlime(player, isSelf = false) {
      const { x, y, name, avatarType, direction, isMoving, speechBubble, activeEmote } = player;
      const type = AVATAR_TYPES[avatarType] || AVATAR_TYPES.sakura;

      ctx.save();

      // Dynamic Bounce & Squish Calculations
      player.bouncePhase = (player.bouncePhase || 0) + (isMoving ? 0.22 : 0.05);
      const bounceHeight = isMoving ? Math.abs(Math.sin(player.bouncePhase)) * 12 : Math.sin(player.bouncePhase) * 2;
      
      // Squish/Stretch scale factor
      const scaleX = isMoving ? 1 + Math.sin(player.bouncePhase) * 0.15 : 1 + Math.sin(player.bouncePhase) * 0.03;
      const scaleY = isMoving ? 1 - Math.sin(player.bouncePhase) * 0.15 : 1 - Math.sin(player.bouncePhase) * 0.03;

      const drawY = y - bounceHeight;

      ctx.translate(x, drawY);

      // Shadow on Ground
      ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
      ctx.beginPath();
      ctx.ellipse(0, y - drawY + 16, 18 * scaleX, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      // Apply Squish Scale
      ctx.scale(scaleX, scaleY);

      // Slime Body (Organic Jelly Shape)
      ctx.fillStyle = type.bodyColor;
      ctx.beginPath();
      ctx.arc(0, 0, 20, Math.PI * 0.82, Math.PI * 2.18);
      ctx.quadraticCurveTo(0, 22, -20, 0);
      ctx.fill();

      // Shiny Top Highlight Overlay
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.beginPath();
      ctx.ellipse(-6, -10, 7, 3.5, -Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();

      // Outline
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Expressive Face Calculations
      let eyeOffsetX = 0;
      if (direction === 'left') eyeOffsetX = -5;
      if (direction === 'right') eyeOffsetX = 5;

      if (direction !== 'up') {
        // Cute Blinking Eyes
        const blink = Math.sin(Date.now() * 0.003) > 0.96 ? 0.2 : 1;

        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.ellipse(-6 + eyeOffsetX, -2, 2.5, 3 * blink, 0, 0, Math.PI * 2);
        ctx.ellipse(6 + eyeOffsetX, -2, 2.5, 3 * blink, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eye Light Reflections
        if (blink > 0.5) {
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(-7 + eyeOffsetX, -3, 1, 0, Math.PI * 2);
          ctx.arc(5 + eyeOffsetX, -3, 1, 0, Math.PI * 2);
          ctx.fill();
        }

        // Rosy Blush
        ctx.fillStyle = 'rgba(244, 114, 182, 0.7)';
        ctx.beginPath();
        ctx.ellipse(-9 + eyeOffsetX, 3, 4, 2, 0, 0, Math.PI * 2);
        ctx.ellipse(9 + eyeOffsetX, 3, 4, 2, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Slime Accessory / Hat
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(type.accessory, 0 + eyeOffsetX, -20);

      ctx.restore(); // Restore transform before rendering UI overlay tags

      // Local Player Highlight Ring
      if (isSelf) {
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(x, y + 16, 22, 9, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Name Tag
      ctx.font = 'bold 11px "Plus Jakarta Sans", sans-serif';
      const nameWidth = ctx.measureText(name).width + 16;
      ctx.fillStyle = isSelf ? '#ec4899' : 'rgba(255, 255, 255, 0.92)';
      ctx.beginPath();
      ctx.roundRect(x - nameWidth / 2, drawY + 24, nameWidth, 18, 9);
      ctx.fill();
      ctx.strokeStyle = 'rgba(244, 114, 182, 0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = isSelf ? '#ffffff' : '#831843';
      ctx.textAlign = 'center';
      ctx.fillText(name, x, drawY + 37);

      // Active Floating Emote ABOVE Slime
      if (activeEmote && activeEmote.expiresAt > Date.now()) {
        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(activeEmote.emoji, x, drawY - 45);
      }

      // SPEECH BUBBLE WITH CRISP MULTI-LINE WRAPPING
      if (speechBubble && speechBubble.expiresAt > Date.now()) {
        drawSpeechBubble(x, drawY - 35, speechBubble.text);
      }
    }

    function drawSpeechBubble(x, y, text) {
      ctx.font = '600 12px "Plus Jakarta Sans", sans-serif';
      
      const maxLineWidth = 160;
      const words = text.split(' ');
      let lines = [];
      let currentLine = '';

      words.forEach(word => {
        const testLine = currentLine ? currentLine + ' ' + word : word;
        if (ctx.measureText(testLine).width > maxLineWidth) {
          lines.push(currentLine);
          currentLine = word;
        } else {
          currentLine = testLine;
        }
      });
      if (currentLine) lines.push(currentLine);

      const lineHeight = 16;
      const padding = 10;
      let maxMeasuredWidth = 0;
      lines.forEach(l => {
        const w = ctx.measureText(l).width;
        if (w > maxMeasuredWidth) maxMeasuredWidth = w;
      });

      const bubbleWidth = Math.max(60, maxMeasuredWidth + padding * 2);
      const bubbleHeight = lines.length * lineHeight + padding * 1.2;
      const bubbleX = x - bubbleWidth / 2;
      const bubbleY = y - bubbleHeight;

      // Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.beginPath();
      ctx.roundRect(bubbleX + 2, bubbleY + 2, bubbleWidth, bubbleHeight, 12);
      ctx.fill();

      // Body
      ctx.fillStyle = 'rgba(255, 255, 255, 0.98)';
      ctx.beginPath();
      ctx.roundRect(bubbleX, bubbleY, bubbleWidth, bubbleHeight, 12);
      ctx.fill();

      ctx.strokeStyle = '#ec4899';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Tail
      ctx.fillStyle = 'rgba(255, 255, 255, 0.98)';
      ctx.beginPath();
      ctx.moveTo(x - 6, bubbleY + bubbleHeight - 1);
      ctx.lineTo(x, bubbleY + bubbleHeight + 7);
      ctx.lineTo(x + 6, bubbleY + bubbleHeight - 1);
      ctx.fill();

      // Text Lines
      ctx.fillStyle = '#831843';
      ctx.textAlign = 'center';
      lines.forEach((line, index) => {
        ctx.fillText(line, x, bubbleY + padding + 11 + index * lineHeight);
      });
    }

    // --- CONTROLS, PHYSICS & SLIME INTERACTIONS ---
    function updatePlayerMovement() {
      let dx = 0;
      let dy = 0;

      if (keys.up) { dy -= 1; localPlayer.direction = 'up'; }
      if (keys.down) { dy += 1; localPlayer.direction = 'down'; }
      if (keys.left) { dx -= 1; localPlayer.direction = 'left'; }
      if (keys.right) { dx += 1; localPlayer.direction = 'right'; }

      const prevMoving = localPlayer.isMoving;

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        localPlayer.x += (dx / len) * localPlayer.speed;
        localPlayer.y += (dy / len) * localPlayer.speed;

        localPlayer.targetX = localPlayer.x;
        localPlayer.targetY = localPlayer.y;
        localPlayer.isMoving = true;
      } else {
        // Target move click interpolation
        const distX = localPlayer.targetX - localPlayer.x;
        const distY = localPlayer.targetY - localPlayer.y;
        const distance = Math.hypot(distX, distY);

        if (distance > 4) {
          localPlayer.x += (distX / distance) * localPlayer.speed;
          localPlayer.y += (distY / distance) * localPlayer.speed;
          localPlayer.isMoving = true;

          if (Math.abs(distX) > Math.abs(distY)) {
            localPlayer.direction = distX > 0 ? 'right' : 'left';
          } else {
            localPlayer.direction = distY > 0 ? 'down' : 'up';
          }
        } else {
          localPlayer.isMoving = false;
        }
      }

      // Play bounce audio on move start
      if (!prevMoving && localPlayer.isMoving) {
        playSound('bounce');
      }

      // Unrestricted Freedom Traversal Clamping
      localPlayer.x = Math.max(25, Math.min(canvas.width - 25, localPlayer.x));
      localPlayer.y = Math.max(25, Math.min(canvas.height - 25, localPlayer.y));

      // Slime-to-Slime Proximity Hug / Soft Bounce Physics
      Object.values(remotePlayers).forEach(p => {
        const dist = Math.hypot(localPlayer.x - p.x, localPlayer.y - p.y);
        if (dist < 32 && dist > 0) {
          // Gentle push bounce away
          const pushX = (localPlayer.x - p.x) / dist;
          const pushY = (localPlayer.y - p.y) / dist;
          localPlayer.x += pushX * 2;
          localPlayer.y += pushY * 2;
        }
      });

      // Broadcast Realtime Movement Stream
      if (localPlayer.isMoving && realtimeChannel) {
        broadcastState();
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Map & Petals
      drawEnvironment();
      updateAndDrawPetals();

      // Click Ripple Target Ring
      const targetDist = Math.hypot(localPlayer.targetX - localPlayer.x, localPlayer.targetY - localPlayer.y);
      if (targetDist > 8) {
        ctx.strokeStyle = 'rgba(236, 72, 153, 0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(localPlayer.targetX, localPlayer.targetY, 10, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Render Remote Players
      Object.values(remotePlayers).forEach(p => {
        drawSlime(p, false);
      });

      // Update & Draw Local Player Slime
      updatePlayerMovement();
      drawSlime(localPlayer, true);

      // Particles
      updateAndDrawParticles();

      requestAnimationFrame(render);
    }

    // --- REALTIME SUPABASE CHANNEL & PRESENCE ---
    async function initSupabaseChannel(channelName) {
      if (realtimeChannel) {
        supabaseClient.removeChannel(realtimeChannel);
      }

      currentChannel = channelName;
      document.getElementById('room-indicator').textContent = '#' + channelName;

      realtimeChannel = supabaseClient.channel(`room_${channelName}`, {
        config: { presence: { key: localPlayer.id } }
      });

      realtimeChannel
        .on('presence', { event: 'sync' }, () => {
          const state = realtimeChannel.presenceState();
          remotePlayers = {};
          let count = 1;

          Object.keys(state).forEach(key => {
            if (key !== localPlayer.id) {
              const presences = state[key];
              if (presences && presences.length > 0) {
                remotePlayers[key] = presences[0];
                count++;
              }
            }
          });

          document.getElementById('player-count').textContent = `${count} Online`;
        })
        .on('presence', { event: 'leave' }, ({ key }) => {
          delete remotePlayers[key];
        })
        .on('broadcast', { event: 'player-move' }, payload => {
          const p = payload.payload;
          if (p.id !== localPlayer.id) {
            remotePlayers[p.id] = { ...remotePlayers[p.id], ...p };
          }
        })
        .on('broadcast', { event: 'chat-message' }, payload => {
          const msg = payload.payload;
          saveChatMessageToMemory(msg.channel || currentChannel, msg);
          
          if ((msg.channel || currentChannel) === currentChannel) {
            displayChatMessage(msg);
            playSound('msg');
          }

          if (msg.playerId === localPlayer.id) {
            localPlayer.speechBubble = { text: msg.content, expiresAt: Date.now() + 6500 };
          } else if (remotePlayers[msg.playerId]) {
            remotePlayers[msg.playerId].speechBubble = { text: msg.content, expiresAt: Date.now() + 6500 };
          }
        })
        .on('broadcast', { event: 'player-emote' }, payload => {
          const data = payload.payload;
          if (remotePlayers[data.playerId]) {
            remotePlayers[data.playerId].activeEmote = { emoji: data.emoji, expiresAt: Date.now() + 3500 };
            addFloatingParticle(remotePlayers[data.playerId].x, remotePlayers[data.playerId].y, data.emoji);
          }
        })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await realtimeChannel.track({
              id: localPlayer.id,
              name: localPlayer.name,
              avatarType: localPlayer.avatarType,
              x: localPlayer.x,
              y: localPlayer.y,
              direction: localPlayer.direction
            });
          }
        });

      renderChatLogForChannel(channelName);
    }

    function saveChatMessageToMemory(channel, msg) {
      if (!chatMemory[channel]) chatMemory[channel] = [];
      chatMemory[channel].push(msg);
      if (chatMemory[channel].length > 50) chatMemory[channel].shift();
      
      try {
        localStorage.setItem(`chat_${channel}`, JSON.stringify(chatMemory[channel]));
      } catch(e) {}
    }

    function renderChatLogForChannel(channel) {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';

      const messages = chatMemory[channel] || [];

      if (messages.length === 0) {
        container.innerHTML = `<div class="text-center text-xs text-pink-500 my-6 italic">Welcome to #${channel}! Bounce & send a message 🌸</div>`;
        return;
      }

      messages.forEach(msg => displayChatMessage(msg));
    }

    function broadcastState() {
      if (!realtimeChannel) return;
      realtimeChannel.send({
        type: 'broadcast',
        event: 'player-move',
        payload: {
          id: localPlayer.id,
          name: localPlayer.name,
          avatarType: localPlayer.avatarType,
          x: localPlayer.x,
          y: localPlayer.y,
          direction: localPlayer.direction,
          isMoving: localPlayer.isMoving
        }
      });
    }

    // Trigger Emote Action
    function triggerEmote(emoji) {
      playSound('emote');
      localPlayer.activeEmote = { emoji: emoji, expiresAt: Date.now() + 3500 };
      addFloatingParticle(localPlayer.x, localPlayer.y, emoji);

      if (realtimeChannel) {
        realtimeChannel.send({
          type: 'broadcast',
          event: 'player-emote',
          payload: { playerId: localPlayer.id, emoji: emoji }
        });
      }
    }

    // Submit Chat Message
    document.getElementById('chat-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();

      if (!text) return;
      input.value = '';

      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const msgObj = {
        playerId: localPlayer.id,
        sender: localPlayer.name,
        content: text,
        time: timeStr,
        channel: currentChannel
      };

      playSound('msg');
      localPlayer.speechBubble = { text: text, expiresAt: Date.now() + 6500 };

      saveChatMessageToMemory(currentChannel, msgObj);
      displayChatMessage(msgObj);

      if (realtimeChannel) {
        realtimeChannel.send({
          type: 'broadcast',
          event: 'chat-message',
          payload: msgObj
        });
      }
    });

    function displayChatMessage(msg) {
      const container = document.getElementById('chat-messages');
      const isSelf = msg.sender === localPlayer.name;

      const msgDiv = document.createElement('div');
      msgDiv.className = `flex flex-col ${isSelf ? 'items-end' : 'items-start'} space-y-1 animate-in fade-in slide-in-from-bottom-2 duration-150`;

      msgDiv.innerHTML = `
        <div class="flex items-center gap-1.5 px-1">
          <span class="text-[11px] font-bold text-pink-900">${escapeHtml(msg.sender)}</span>
          <span class="text-[9px] text-pink-400">${msg.time || ''}</span>
        </div>
        <div class="px-3.5 py-2 rounded-2xl text-xs max-w-[88%] shadow-sm ${
          isSelf 
            ? 'bg-pink-500 text-white rounded-tr-none' 
            : 'bg-white/95 text-pink-950 border border-pink-100 rounded-tl-none font-medium'
        }">
          ${escapeHtml(msg.content)}
        </div>
      `;

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // --- INPUT LISTENERS ---
    window.addEventListener('keydown', e => {
      if (document.activeElement.tagName === 'INPUT') return;

      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    });

    // Unrestricted Movement Tap/Click Anywhere
    canvas.addEventListener('pointerdown', e => {
      const rect = canvas.getBoundingClientRect();
      localPlayer.targetX = e.clientX - rect.left;
      localPlayer.targetY = e.clientY - rect.top;

      // Check if clicked another player slime to trigger high-five emote!
      Object.values(remotePlayers).forEach(p => {
        const clickDist = Math.hypot(localPlayer.targetX - p.x, localPlayer.targetY - p.y);
        if (clickDist < 35) {
          triggerEmote('❤️');
        }
      });
    });

    // Virtual D-Pad
    function startMove(dir, ev) { if (ev) ev.preventDefault(); keys[dir] = true; }
    function stopMove(dir, ev) { if (ev) ev.preventDefault(); keys[dir] = false; }

    // Switch Room Channel
    function switchChannel(channelName) {
      if (currentChannel === channelName) return;

      document.querySelectorAll('.chan-btn').forEach(btn => {
        btn.classList.remove('bg-pink-500', 'text-white', 'shadow-sm');
        btn.classList.add('text-pink-800');
      });

      const activeBtn = document.getElementById(`chan-btn-${channelName}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-pink-500', 'text-white', 'shadow-sm');
        activeBtn.classList.remove('text-pink-800');
      }

      initSupabaseChannel(channelName);
    }

    // --- SETTINGS MODAL ---
    function renderAvatarPicker() {
      const picker = document.getElementById('avatar-picker');
      picker.innerHTML = Object.keys(AVATAR_TYPES).map(key => {
        const type = AVATAR_TYPES[key];
        const isSelected = localPlayer.avatarType === key;

        return `
          <div 
            onclick="selectAvatarType('${key}')"
            class="p-3 rounded-2xl border-2 cursor-pointer transition flex items-center gap-3 ${
              isSelected 
                ? 'border-pink-500 bg-pink-100/80 shadow-sm' 
                : 'border-pink-200/60 hover:bg-white/60'
            }"
          >
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-sm shrink-0" style="background-color: ${type.bodyColor}">
              ${type.accessory}
            </div>
            <span class="text-xs font-bold text-pink-900">${type.name}</span>
          </div>
        `;
      }).join('');
    }

    function selectAvatarType(key) {
      localPlayer.avatarType = key;
      renderAvatarPicker();
    }

    function toggleSettingsModal() {
      const modal = document.getElementById('settings-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        document.getElementById('setting-username').value = localPlayer.name;
        renderAvatarPicker();
      }
    }

    function saveAvatarSettings() {
      const newName = document.getElementById('setting-username').value.trim();
      if (newName) {
        localPlayer.name = newName;
        localStorage.setItem('sakura_avatar_name', localPlayer.name);
        document.getElementById('user-display-name').textContent = newName;
      }
      localStorage.setItem('sakura_avatar_type', localPlayer.avatarType);

      if (realtimeChannel) {
        realtimeChannel.track({
          id: localPlayer.id,
          name: localPlayer.name,
          avatarType: localPlayer.avatarType,
          x: localPlayer.x,
          y: localPlayer.y
        });
      }

      toggleSettingsModal();
    }

    function toggleChatSidebar() {
      const sidebar = document.getElementById('chat-sidebar');
      sidebar.classList.toggle('translate-x-full');
    }

    setTimeout(() => {
      const hint = document.getElementById('controls-hint');
      if (hint) hint.style.opacity = '0.35';
    }, 7000);

    // --- INITIALIZATION ---
    window.addEventListener('resize', resizeCanvas);

    window.addEventListener('load', async () => {
      lucide.createIcons();
      resizeCanvas();
      initPetals();

      localPlayer.x = canvas.width / 2;
      localPlayer.y = canvas.height / 2 + 30;
      localPlayer.targetX = localPlayer.x;
      localPlayer.targetY = localPlayer.y;

      // Check existing Supabase session
      const { data } = await supabaseClient.auth.getSession();
      if (data.session) {
        const user = data.session.user;
        const dispName = user.user_metadata?.display_name || user.email.split('@')[0];
        completeUserLogin(user, dispName);
      }

      requestAnimationFrame(render);
    });
  </script>
</body>
</html>
