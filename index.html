<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Cozy Pokémon Café & Lounge ☕🌸</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* Viewport & Lock Rules */
    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      width: 100dvw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      background: #2b1f1a;
      font-family: 'Quicksand', sans-serif;
    }

    .font-heading {
      font-family: 'Fredoka', sans-serif;
    }

    /* Cozy Glassmorphism */
    .glass-cozy {
      background: rgba(255, 248, 240, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(234, 179, 133, 0.4);
    }

    .glass-dark {
      background: rgba(43, 31, 26, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(234, 179, 133, 0.2);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px solid #d4a373;
    }

    .glass-input:focus {
      border-color: #bc6c25;
      outline: none;
      box-shadow: 0 0 0 3px rgba(188, 108, 37, 0.2);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #dda15e;
      border-radius: 10px;
    }

    /* Mobile Virtual Joystick */
    .joystick-base {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      position: relative;
      touch-action: none;
    }
    .joystick-stick {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #dda15e 0%, #bc6c25 100%);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      position: absolute;
      top: 23px;
      left: 23px;
      pointer-events: none;
      transition: transform 0.04s ease-out;
    }

    .cozy-btn {
      background: #fefae0;
      border: 2px solid #dda15e;
      color: #603813;
      box-shadow: 0 4px 0 #bc6c25;
      transition: all 0.1s ease;
    }
    .cozy-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #bc6c25;
    }
  </style>
</head>
<body class="flex flex-col h-full w-full overflow-hidden select-none bg-[#2b1f1a]">

  <!-- AUTH MODAL OVERLAY -->
  <div id="auth-modal" class="fixed inset-0 z-50 bg-[#2b1f1a]/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="glass-cozy w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 animate-in fade-in zoom-in-95 duration-200">
      <div class="text-center space-y-1">
        <div class="inline-flex p-3 rounded-2xl bg-[#dda15e] text-white shadow-md mb-1">
          <i data-lucide="coffee" class="w-7 h-7"></i>
        </div>
        <h2 class="font-heading text-2xl font-bold text-[#603813]">Cozy Pokémon Café</h2>
        <p class="text-xs text-[#bc6c25] font-semibold">Grab a seat, order coffee & hang out with friends!</p>
      </div>

      <div class="grid grid-cols-2 gap-1 p-1 bg-[#fefae0] rounded-2xl text-xs font-bold border border-[#dda15e]/50">
        <button id="tab-signin" onclick="switchAuthTab('signin')" class="py-2 rounded-xl bg-[#bc6c25] text-white shadow transition">Sign In</button>
        <button id="tab-signup" onclick="switchAuthTab('signup')" class="py-2 rounded-xl transition text-[#603813] hover:text-[#bc6c25]">Sign Up</button>
      </div>

      <div id="auth-alert" class="hidden text-xs p-3 rounded-xl border font-medium"></div>

      <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-3">
        <div class="space-y-1">
          <label class="text-[10px] font-bold text-[#603813] uppercase tracking-wider">Email</label>
          <input type="email" id="auth-email" required placeholder="trainer@cafe.com" class="glass-input w-full px-3.5 py-2 rounded-xl text-xs font-semibold text-[#2b1f1a]" />
        </div>
        <div class="space-y-1">
          <label class="text-[10px] font-bold text-[#603813] uppercase tracking-wider">Password</label>
          <input type="password" id="auth-password" required minlength="6" placeholder="••••••••" class="glass-input w-full px-3.5 py-2 rounded-xl text-xs font-semibold text-[#2b1f1a]" />
        </div>
        <div id="username-field" class="space-y-1 hidden">
          <label class="text-[10px] font-bold text-[#603813] uppercase tracking-wider">Trainer Name</label>
          <input type="text" id="auth-username" maxlength="15" placeholder="Ash_Ketchum" class="glass-input w-full px-3.5 py-2 rounded-xl text-xs font-semibold text-[#2b1f1a]" />

        <button type="submit" id="auth-submit-btn" class="w-full bg-[#bc6c25] hover:bg-[#dda15e] text-white font-bold py-2.5 rounded-2xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2 text-xs mt-2 border border-[#dda15e]">

      <div class="relative flex items-center justify-center my-1">
        <div class="border-t border-[#dda15e]/50 w-full"></div>
        <span class="bg-[#fefae0] px-3 text-[10px] font-bold uppercase text-[#bc6c25] absolute">or</span>

      <button onclick="loginAsGuest()" class="w-full bg-[#fefae0] hover:bg-[#faedcd] text-[#603813] font-bold py-2 rounded-2xl border border-[#dda15e] transition active:scale-95 text-xs flex items-center justify-center gap-1.5 shadow-sm">

      </div>

  <!-- MAIN VIEWPORT CONTAINER -->

        <button onclick="switchChannel('cozy-cafe')" id="quick-btn-cozy-cafe" class="quick-chan-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-[#bc6c25] text-white shadow transition whitespace-nowrap">

        <button onclick="triggerEmote('🌸')" class="hover:scale-125 active:scale-90 transition text-lg" title="Blossom">🌸</button>
        <button onclick="triggerEmote('❤️')" class="hover:scale-125 active:scale-90 transition text-lg" title="Heart">❤️</button>
        <button onclick="triggerEmote('✨')" class="hover:scale-125 active:scale-90 transition text-lg" title="Sparkles">✨</button>
        <button onclick="triggerEmote('🍰')" class="hover:scale-125 active:scale-90 transition text-lg" title="Cake">🍰</button>

      <!-- Mobile D-Pad Joystick -->

      <!-- Mobile Action Buttons -->
      <div class="absolute bottom-3 right-3 z-20 pointer-events-auto md:hidden flex flex-col gap-2">
        <button onclick="sitAtNearestChair()" class="w-12 h-12 rounded-full bg-[#fefae0] border-2 border-[#bc6c25] text-[#603813] text-xs font-bold shadow-lg active:scale-90 flex items-center justify-center">

    <!-- SIDEBAR CHAT DRAWER -->

        <div class="grid grid-cols-3 gap-1">

          <button onclick="switchChannel('zen-garden')" id="chan-btn-zen-garden" class="chan-btn px-2 py-1.5 rounded-xl text-[10px] sm:text-xs font-medium text-[#faedcd] hover:bg-[#3d2b23] transition">

          <button onclick="switchChannel('pixel-plaza')" id="chan-btn-pixel-plaza" class="chan-btn px-2 py-1.5 rounded-xl text-[10px] sm:text-xs font-medium text-[#faedcd] hover:bg-[#3d2b23] transition">
            🎪 Plaza

        </div>

      <!-- Chat Log Stream -->
      <div id="chat-messages" class="flex-1 overflow-y-auto p-3 space-y-2.5"></div>

  <!-- MOBILE BOTTOM FLOATING NAVIGATION BAR -->

  <!-- CUSTOMIZATION SETTINGS MODAL -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="glass-cozy w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-4 animate-in fade-in zoom-in-95 max-h-[90dvh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-[#dda15e]/50 pb-2">
        <div class="flex items-center gap-2">
          <i data-lucide="palette" class="w-5 h-5 text-[#bc6c25]"></i>
          <h3 class="font-heading font-bold text-[#603813] text-base">Trainer & Pokémon Partner</h3>

      <button onclick="saveAvatarSettings()" class="w-full bg-[#bc6c25] hover:bg-[#dda15e] text-white font-bold py-2.5 rounded-2xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2 text-xs border border-[#dda15e]">
        <i data-lucide="check" class="w-4 h-4"></i> Save & Continue
      </button>

  <script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = 'https://brvyjdtnxzjlrhukngjn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydnlqZHRueHpqbHJodWtuZ2puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTAwMjcsImV4cCI6MjEwODA4NjAyN30.2ib-m3ju3SEhJLaQHQdA8xinenbtN5MltOatIYZSZIE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- PROCEDURAL AUDIO SYNTHESIZER (LO-FI CHILL MUSIC) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let musicPlaying = false;
    let musicMasterGain = null;
    let musicTimer = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
        musicMasterGain = audioCtx.createGain();
        musicMasterGain.gain.value = 0.25;
        musicMasterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'bounce') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.1);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'jump') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(250, now);
          osc.frequency.exponentialRampToValueAtTime(500, now + 0.15);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'sit') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(330, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.18);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
          osc.start(now); osc.stop(now + 0.18);
        } else if (type === 'msg') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(660, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        }
      } catch (e) {}
    }

    const LOFI_CHORDS = [
      [261.63, 329.63, 392.00, 493.88], // Cmaj7
      [220.00, 261.63, 329.63, 392.00], // Amin7
      [174.61, 220.00, 261.63, 329.63], // Fmaj7
      [196.00, 246.94, 293.66, 349.23]  // G7
    ];

    function playLofiMelody() {
      if (!musicPlaying || !audioCtx) return;
      const now = audioCtx.currentTime;
      const chord = LOFI_CHORDS[Math.floor(Math.random() * LOFI_CHORDS.length)];
      const freq = chord[Math.floor(Math.random() * chord.length)];

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.08, now + 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 2.2);

      osc.connect(gain);
      gain.connect(musicMasterGain);
      osc.start(now);
      osc.stop(now + 2.2);

      musicTimer = setTimeout(playLofiMelody, Math.random() * 800 + 500);
    }

    function toggleBackgroundMusic() {
      initAudio();
      musicPlaying = !musicPlaying;
      const icon = document.getElementById('music-icon');
      const btn = document.getElementById('music-toggle-btn');

      if (musicPlaying) {

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      const username = document.getElementById('auth-username').value.trim();

      try {
        if (authMode === 'signup') {
          const { data, error } = await supabaseClient.auth.signUp({
            email, password, options: { data: { trainer_name: username || 'Trainer' } }
          });
          if (error) throw error;
          showAuthAlert('Account created successfully!', false);
          setTimeout(() => completeUserLogin(data.user, username || email.split('@')[0]), 800);
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          showAuthAlert('Welcome back!', false);
          const dispName = data.user.user_metadata?.trainer_name || email.split('@')[0];
          setTimeout(() => completeUserLogin(data.user, dispName), 800);
        }
      } catch (err) {
        showAuthAlert(err.message || 'Authentication failed.');

    }

    // --- FLOATING PARTICLES ---
    function addFloatingParticle(x, y, text) {
      for (let i = 0; i < 3; i++) {
        floatingParticles.push({
          x: x + (Math.random() - 0.5) * 20,
          y: y - 20,
          vx: (Math.random() - 0.5) * 1.5,
          vy: -Math.random() * 2 - 1,
          alpha: 1,
          size: Math.random() * 6 + 14,
          text: text
        });
      }
    }

    function updateAndDrawParticles() {
      for (let i = floatingParticles.length - 1; i >= 0; i--) {
        const p = floatingParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.02;

        if (p.alpha <= 0) {
          floatingParticles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.font = `${p.size}px sans-serif`;
        ctx.fillText(p.text, p.x, p.y);
        ctx.restore();
      }
    }

    // --- ENVIRONMENT & ROOM RENDERING ---
    function drawEnvironment() {
      const w = canvas.width;
      const h = canvas.height;

      if (currentChannel === 'cozy-cafe') {
        // Wooden Floor Tile Café
        ctx.fillStyle = '#d4a373';
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = '#bc6c25';
        ctx.lineWidth = 1.5;
        for (let x = 0; x < w; x += 60) {
          for (let y = 0; y < h; y += 60) {
            ctx.strokeRect(x, y, 60, 60);
          }
        }

        // Counter bar at top
        ctx.fillStyle = '#603813';
        ctx.fillRect(w * 0.2, 20, w * 0.6, 50);
        ctx.fillStyle = '#dda15e';
        ctx.fillRect(w * 0.22, 25, w * 0.56, 12);
        
        // Coffee Machine & Pastries on counter
        ctx.fillStyle = '#a8dadc';
        ctx.fillRect(w * 0.45, 30, 24, 25);
        ctx.fillStyle = '#fefae0';
        ctx.beginPath(); ctx.arc(w * 0.35, 42, 8, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(w * 0.65, 42, 8, 0, Math.PI * 2); ctx.fill();

        // Draw Tables & Chairs
        tables.forEach(t => {
          ctx.fillStyle = '#8b5a2b';
          ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#5c3a21'; ctx.lineWidth = 4; ctx.stroke();
          // Coffee cup on table
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(t.x, t.y, 8, 0, Math.PI * 2); ctx.fill();
        });

        chairs.forEach(c => {
          ctx.fillStyle = c.occupiedBy ? '#e07a5f' : '#dda15e';
          ctx.beginPath(); ctx.arc(c.x, c.y, 16, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#603813'; ctx.lineWidth = 2.5; ctx.stroke();
        });

      } else if (currentChannel === 'zen-garden') {
        // Zen Stone & Grass Garden
        ctx.fillStyle = '#2d6a4f';
        ctx.fillRect(0, 0, w, h);

        // Stone pathway
        ctx.fillStyle = '#52796f';
        ctx.beginPath(); ctx.ellipse(w * 0.5, h * 0.5, 120, 200, 0, 0, Math.PI * 2); ctx.fill();

        // Koi Pond
        ctx.fillStyle = '#1d3557';
        ctx.beginPath(); ctx.ellipse(w * 0.75, h * 0.25, 70, 45, 0.2, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#457b9d'; ctx.lineWidth = 3; ctx.stroke();

        // Cherry Blossom Tree
        drawSakuraTree(w * 0.25, h * 0.25, 60);

        // Benches
        chairs.forEach(c => {
          ctx.fillStyle = '#8b5a2b';
          ctx.beginPath(); ctx.roundRect(c.x - 20, c.y - 10, 40, 20, 6); ctx.fill();
          ctx.strokeStyle = '#3d2b23'; ctx.lineWidth = 2; ctx.stroke();
        });

      } else if (currentChannel === 'pixel-plaza') {
        // Town Plaza Cobblestone
        ctx.fillStyle = '#adb5bd';
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = '#6c757d';
        ctx.lineWidth = 1;
        for (let x = 0; x < w; x += 40) {
          for (let y = 0; y < h; y += 40) {
            ctx.strokeRect(x, y, 40, 40);
          }
        }

        // Fountain in center
        ctx.fillStyle = '#457b9d';
        ctx.beginPath(); ctx.arc(w * 0.5, h * 0.5, 50, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f1faee';
        ctx.beginPath(); ctx.arc(w * 0.5, h * 0.5, 25, 0, Math.PI * 2); ctx.fill();

        chairs.forEach(c => {
          ctx.fillStyle = '#6c584c';
          ctx.beginPath(); ctx.roundRect(c.x - 18, c.y - 8, 36, 16, 4); ctx.fill();
        });
      }

      // Outer room border frame
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#bc6c25';
      ctx.strokeRect(0, 0, w, h);
    }

    function drawSakuraTree(x, y, radius) {
      ctx.fillStyle = '#5c3a21';
      ctx.fillRect(x - 8, y, 16, radius);
      ctx.fillStyle = '#ffb703';
      ctx.beginPath(); ctx.arc(x, y - 10, radius, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff70a6';
      ctx.beginPath(); ctx.arc(x - 15, y - 20, radius * 0.6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 15, y - 20, radius * 0.6, 0, Math.PI * 2); ctx.fill();
    }

    // --- CHARACTER & POKÉMON RENDERING ---
    function drawAvatar(player, isSelf = false) {
      const { x, y, name, avatarType, direction, isMoving, isJumping, isSitting, jumpOffset, speechBubble, activeEmote } = player;
      const poke = POKEMON_AVATARS[avatarType] || POKEMON_AVATARS.pikachu;

      ctx.save();

      player.bouncePhase = (player.bouncePhase || 0) + (isMoving ? 0.25 : 0.04);
      const groundBounce = isSitting ? 0 : (isMoving ? Math.abs(Math.sin(player.bouncePhase)) * 6 : Math.sin(player.bouncePhase) * 2);
      const drawY = y - groundBounce - (jumpOffset || 0);

      ctx.translate(x, drawY);

      // Shadow
      if (!isSitting) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.beginPath();
        const shadowSize = Math.max(4, 14 - (jumpOffset || 0) * 0.2);
        ctx.ellipse(0, y - drawY + 14, shadowSize, 5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Pokémon Companion Body
      ctx.fillStyle = poke.bodyColor;
      ctx.beginPath();
      ctx.arc(0, 0, 16, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = poke.accent;
      ctx.lineWidth = 2;
      ctx.stroke();

      // Face features
      ctx.fillStyle = '#2b1f1a';
      ctx.beginPath();
      ctx.arc(-5, -2, 2, 0, Math.PI * 2);
      ctx.arc(5, -2, 2, 0, Math.PI * 2);
      ctx.fill();

      // Cheeks / Accent
      ctx.fillStyle = poke.accent;
      ctx.beginPath();
      ctx.arc(-8, 3, 3, 0, Math.PI * 2);
      ctx.arc(8, 3, 3, 0, Math.PI * 2);
      ctx.fill();

      // Icon on head
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(poke.icon, 0, -16);

      ctx.restore();

      // Self Ring Indicator
      if (isSelf) {
        ctx.strokeStyle = '#bc6c25';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(x, y + 14, 16, 6, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Name Badge
      ctx.font = 'bold 10px "Quicksand", sans-serif';
      const nameWidth = ctx.measureText(name).width + 12;
      ctx.fillStyle = isSelf ? '#bc6c25' : 'rgba(255, 255, 255, 0.95)';
      ctx.beginPath();
      ctx.roundRect(x - nameWidth / 2, drawY + 18, nameWidth, 16, 8);
      ctx.fill();

      ctx.fillStyle = isSelf ? '#ffffff' : '#603813';
      ctx.textAlign = 'center';
      ctx.fillText(name, x, drawY + 29);

      // Emote & Speech Bubbles
      if (activeEmote && activeEmote.expiresAt > Date.now()) {
        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(activeEmote.emoji, x, drawY - 38);
      }

      if (speechBubble && speechBubble.expiresAt > Date.now()) {
        drawSpeechBubble(x, drawY - 28, speechBubble.text);
      }
    }

    function drawSpeechBubble(x, y, text) {
      ctx.font = '700 11px "Quicksand", sans-serif';
      const bubbleWidth = Math.min(140, ctx.measureText(text).width + 16);
      const bubbleHeight = 22;
      const bubbleX = x - bubbleWidth / 2;
      const bubbleY = y - bubbleHeight;

      ctx.fillStyle = 'rgba(254, 250, 224, 0.98)';
      ctx.beginPath(); ctx.roundRect(bubbleX, bubbleY, bubbleWidth, bubbleHeight, 10); ctx.fill();
      ctx.strokeStyle = '#bc6c25'; ctx.lineWidth = 1.5; ctx.stroke();

      ctx.fillStyle = '#603813'; ctx.textAlign = 'center';
      ctx.fillText(text, x, bubbleY + 15);
    }

    // --- MOVEMENT & SEATING MECHANICS ---
    function triggerJump() {
      if (!localPlayer.isJumping && !localPlayer.isSitting) {
        localPlayer.isJumping = true;
        localPlayer.jumpVelocity = 10;
        playSound('jump');
      }
    }

    function sitAtNearestChair() {
      if (localPlayer.isSitting) {
        // Stand up
        localPlayer.isSitting = false;
        if (localPlayer.seatedChairId) {
          const ch = chairs.find(c => c.id === localPlayer.seatedChairId);
          if (ch) ch.occupiedBy = null;
          localPlayer.seatedChairId = null;
        }
        document.getElementById('seating-banner').classList.add('hidden');
        playSound('sit');
        broadcastState();
        return;
      }

      // Find nearest chair
      let nearest = null;
      let minDist = 45;
      chairs.forEach(c => {
        if (!c.occupiedBy) {
          const dist = Math.hypot(localPlayer.x - c.x, localPlayer.y - c.y);
          if (dist < minDist) {
            minDist = dist;
            nearest = c;
          }
        }
      });

      if (nearest) {
        localPlayer.isSitting = true;
        localPlayer.seatedChairId = nearest.id;
        localPlayer.x = nearest.x;
        localPlayer.y = nearest.y;
        localPlayer.targetX = nearest.x;
        localPlayer.targetY = nearest.y;
        nearest.occupiedBy = localPlayer.id;

        document.getElementById('seating-banner').classList.remove('hidden');
        document.getElementById('seating-text').textContent = '🪑 Sitting at café chair! Press Sit/Stand to get up.';
        playSound('sit');
        broadcastState();
      } else {
        // Check if near any chair to show prompt
        let closeChair = chairs.find(c => Math.hypot(localPlayer.x - c.x, localPlayer.y - c.y) < 70);
        if (closeChair) {
          showSeatingPrompt(closeChair);
        }
      }
    }

    function showSeatingPrompt(chair) {
      if (chair.occupiedBy) return;
      document.getElementById('seating-banner').classList.remove('hidden');
      document.getElementById('seating-text').textContent = '🪑 Press Sit to relax in chair!';
    }

    function updatePlayerMovement() {
      if (localPlayer.isSitting) return;

      let dx = 0; let dy = 0;
      if (keys.up) dy -= 1;
      if (keys.down) dy += 1;
      if (keys.left) dx -= 1;
      if (keys.right) dx += 1;

      if (joystick.active) { dx = joystick.dx; dy = joystick.dy; }

      if (localPlayer.isJumping) {
        localPlayer.jumpOffset = (localPlayer.jumpOffset || 0) + localPlayer.jumpVelocity;
        localPlayer.jumpVelocity -= 0.8;
        if (localPlayer.jumpOffset <= 0) {
          localPlayer.jumpOffset = 0;
          localPlayer.isJumping = false;
          playSound('bounce');
        }
      }

      const prevMoving = localPlayer.isMoving;

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        localPlayer.x += (dx / len) * localPlayer.speed;
        localPlayer.y += (dy / len) * localPlayer.speed;
        localPlayer.targetX = localPlayer.x;
        localPlayer.targetY = localPlayer.y;
        localPlayer.isMoving = true;
        localPlayer.direction = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      } else {
        const distX = localPlayer.targetX - localPlayer.x;
        const distY = localPlayer.targetY - localPlayer.y;
        const distance = Math.hypot(distX, distY);

        if (distance > 4) {
          localPlayer.x += (distX / distance) * localPlayer.speed;
          localPlayer.y += (distY / distance) * localPlayer.speed;
          localPlayer.isMoving = true;
          localPlayer.direction = Math.abs(distX) > Math.abs(distY) ? (distX > 0 ? 'right' : 'left') : (distY > 0 ? 'down' : 'up');
        } else {
          localPlayer.isMoving = false;
        }
      }

      if (!prevMoving && localPlayer.isMoving) playSound('bounce');

      localPlayer.x = Math.max(20, Math.min(canvas.width - 20, localPlayer.x));
      localPlayer.y = Math.max(20, Math.min(canvas.height - 20, localPlayer.y));

      // Check proximity to chairs for prompt
      let nearbyChair = chairs.find(c => !c.occupiedBy && Math.hypot(localPlayer.x - c.x, localPlayer.y - c.y) < 55);
      if (nearbyChair) {
        document.getElementById('seating-banner').classList.remove('hidden');
        document.getElementById('seating-text').textContent = '🪑 Press Sit to relax!';
      } else {
        document.getElementById('seating-banner').classList.add('hidden');
      }

      if (localPlayer.isMoving && realtimeChannel) broadcastState();
    }

    // --- MAIN GAME LOOP ---
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawEnvironment();

      // Remote Players
      Object.values(remotePlayers).forEach(p => drawAvatar(p, false));

      // Local Player
      updatePlayerMovement();
      drawAvatar(localPlayer, true);

      // Particles
      updateAndDrawParticles();

      requestAnimationFrame(render);
    }

    // --- REALTIME SUPABASE SYSTEM ---
    async function initSupabaseChannel(channelName) {
      if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);

      currentChannel = channelName;
      document.getElementById('room-indicator').textContent = '#' + channelName;
      setupRoomFurnishing();

      realtimeChannel = supabaseClient.channel(`room_${channelName}`, {
        config: { presence: { key: localPlayer.id } }
      });

      realtimeChannel
        .on('presence', { event: 'sync' }, () => {
          const state = realtimeChannel.presenceState();
          remotePlayers = {};
          let count = 1;
          Object.keys(state).forEach(key => {
            if (key !== localPlayer.id && state[key][0]) {
              remotePlayers[key] = state[key][0];
              count++;
            }
          });
          document.getElementById('player-count').textContent = count;
        })
        .on('broadcast', { event: 'player-move' }, payload => {
          const p = payload.payload;
          if (p.id !== localPlayer.id) remotePlayers[p.id] = { ...remotePlayers[p.id], ...p };
        })
        .on('broadcast', { event: 'chat-message' }, payload => {
          const msg = payload.payload;
          saveChatMessageToMemory(msg.channel || currentChannel, msg);
          if ((msg.channel || currentChannel) === currentChannel) {
            displayChatMessage(msg);
            playSound('msg');
          }
          if (msg.playerId === localPlayer.id) {
            localPlayer.speechBubble = { text: msg.content, expiresAt: Date.now() + 6000 };
          } else if (remotePlayers[msg.playerId]) {
            remotePlayers[msg.playerId].speechBubble = { text: msg.content, expiresAt: Date.now() + 6000 };
          }
        })
        .on('broadcast', { event: 'player-emote' }, payload => {
          const data = payload.payload;
          if (remotePlayers[data.playerId]) {
            remotePlayers[data.playerId].activeEmote = { emoji: data.emoji, expiresAt: Date.now() + 3000 };
            addFloatingParticle(remotePlayers[data.playerId].x, remotePlayers[data.playerId].y, data.emoji);
          }
        })
        .subscribe(async status => {
          if (status === 'SUBSCRIBED') {
            await realtimeChannel.track({
              id: localPlayer.id,
              name: localPlayer.name,
              avatarType: localPlayer.avatarType,
              x: localPlayer.x,
              y: localPlayer.y,
              direction: localPlayer.direction,
              isSitting: localPlayer.isSitting
            });
          }
        });

      renderChatLogForChannel(channelName);
    }

    function saveChatMessageToMemory(channel, msg) {
      if (!chatMemory[channel]) chatMemory[channel] = [];
      chatMemory[channel].push(msg);
      if (chatMemory[channel].length > 40) chatMemory[channel].shift();
      try { localStorage.setItem(`chat_${channel}`, JSON.stringify(chatMemory[channel])); } catch(e) {}
    }

    function renderChatLogForChannel(channel) {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      const messages = chatMemory[channel] || [];
      if (messages.length === 0) {
        container.innerHTML = `<div class="text-center text-[10px] text-[#dda15e] my-4 italic">Welcome to #${channel}! Grab a coffee & chat ☕</div>`;
        return;
      }
      messages.forEach(msg => displayChatMessage(msg));
    }

    function broadcastState() {
      if (!realtimeChannel) return;
      realtimeChannel.send({
        type: 'broadcast',
        event: 'player-move',
        payload: {
          id: localPlayer.id,
          name: localPlayer.name,
          avatarType: localPlayer.avatarType,
          x: localPlayer.x,
          y: localPlayer.y,
          direction: localPlayer.direction,
          isMoving: localPlayer.isMoving,
          isSitting: localPlayer.isSitting
        }
      });
    }

    function triggerEmote(emoji) {
      playSound('msg');
      localPlayer.activeEmote = { emoji: emoji, expiresAt: Date.now() + 3000 };
      addFloatingParticle(localPlayer.x, localPlayer.y, emoji);

      if (realtimeChannel) {
        realtimeChannel.send({
          type: 'broadcast',
          event: 'player-emote',
          payload: { playerId: localPlayer.id, emoji: emoji }
        });
      }
    }

    document.getElementById('chat-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const msgObj = {
        playerId: localPlayer.id,
        sender: localPlayer.name,
        content: text,
        time: timeStr,
        channel: currentChannel
      };

      playSound('msg');
      localPlayer.speechBubble = { text: text, expiresAt: Date.now() + 6000 };

      saveChatMessageToMemory(currentChannel, msgObj);
      displayChatMessage(msgObj);

      if (realtimeChannel) {
        realtimeChannel.send({ type: 'broadcast', event: 'chat-message', payload: msgObj });
      }
    });

    function displayChatMessage(msg) {
      const container = document.getElementById('chat-messages');
      const isSelf = msg.sender === localPlayer.name;

      const msgDiv = document.createElement('div');
      msgDiv.className = `flex flex-col ${isSelf ? 'items-end' : 'items-start'} space-y-0.5 animate-in fade-in`;

      msgDiv.innerHTML = `
        <div class="flex items-center gap-1 px-1">
          <span class="text-[10px] font-bold text-[#dda15e]">${escapeHtml(msg.sender)}</span>
          <span class="text-[8px] text-[#dda15e]/60">${msg.time || ''}</span>
        </div>
        <div class="px-3 py-1.5 rounded-2xl text-xs max-w-[88%] shadow-sm ${
          isSelf ? 'bg-[#bc6c25] text-white rounded-tr-none font-semibold' : 'bg-[#fefae0] text-[#603813] rounded-tl-none font-semibold'
        }">
          ${escapeHtml(msg.content)}
        </div>
      `;

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div'); div.innerText = text; return div.innerHTML;
    }

    // --- CONTROLS & LISTENERS ---
    window.addEventListener('keydown', e => {
      if (document.activeElement.tagName === 'INPUT') return;
      if (e.key === ' ' || e.key === 'Spacebar') {
        if (chairs.some(c => !c.occupiedBy && Math.hypot(localPlayer.x - c.x, localPlayer.y - c.y) < 60)) {
          sitAtNearestChair();
        } else {
          triggerJump();
        }
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    });

    // Mobile Joystick Logic
    const joystickBase = document.getElementById('joystick-container');
    const joystickStick = document.getElementById('joystick-stick');

    if (joystickBase) {
      joystickBase.addEventListener('touchstart', e => { e.preventDefault(); joystick.active = true; updateJoystickPos(e.touches[0]); }, { passive: false });
      joystickBase.addEventListener('touchmove', e => { e.preventDefault(); if (joystick.active) updateJoystickPos(e.touches[0]); }, { passive: false });
      joystickBase.addEventListener('touchend', e => { e.preventDefault(); joystick.active = false; joystick.dx = 0; joystick.dy = 0; joystickStick.style.transform = `translate(0px, 0px)`; }, { passive: false });
    }

    function updateJoystickPos(touch) {
      const rect = joystickBase.getBoundingClientRect();
      let dx = touch.clientX - (rect.left + rect.width / 2);
      let dy = touch.clientY - (rect.top + rect.height / 2);
      const dist = Math.hypot(dx, dy);
      const maxDist = rect.width / 2 - 8;

      if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
      joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
      joystick.dx = dx / maxDist; joystick.dy = dy / maxDist;
    }

    // Canvas Tap Navigation
    canvas.addEventListener('pointerdown', e => {
      if (e.target !== canvas) return;
      const rect = canvas.getBoundingClientRect();
      const tx = e.clientX - rect.left;
      const ty = e.clientY - rect.top;

      // Check if clicking chair
      let clickedChair = chairs.find(c => Math.hypot(tx - c.x, ty - c.y) < 30);
      if (clickedChair && !clickedChair.occupiedBy) {
        localPlayer.isSitting = true;
        localPlayer.seatedChairId = clickedChair.id;
        localPlayer.x = clickedChair.x;
        localPlayer.y = clickedChair.y;
        localPlayer.targetX = clickedChair.x;
        localPlayer.targetY = clickedChair.y;
        clickedChair.occupiedBy = localPlayer.id;
        playSound('sit');
        broadcastState();
        return;
      }

      if (localPlayer.isSitting) {
        localPlayer.isSitting = false;
        if (localPlayer.seatedChairId) {
          const ch = chairs.find(c => c.id === localPlayer.seatedChairId);
          if (ch) ch.occupiedBy = null;
          localPlayer.seatedChairId = null;
        }
      }

      localPlayer.targetX = tx;
      localPlayer.targetY = ty;
    });

    function switchChannel(channelName) {
      if (currentChannel === channelName) return;

      if (localPlayer.isSitting) {
        localPlayer.isSitting = false;
        localPlayer.seatedChairId = null;
      }

      document.querySelectorAll('.chan-btn, .quick-chan-btn').forEach(btn => {
        btn.classList.remove('bg-[#bc6c25]', 'text-white', 'shadow');
        btn.classList.add('text-[#faedcd]', 'text-[#603813]');
      });

      const activeBtn = document.getElementById(`chan-btn-${channelName}`);
      const quickBtn = document.getElementById(`quick-btn-${channelName}`);
      
      if (activeBtn) activeBtn.classList.add('bg-[#bc6c25]', 'text-white', 'shadow');
      if (quickBtn) quickBtn.classList.add('bg-[#bc6c25]', 'text-white', 'shadow');

      initSupabaseChannel(channelName);
    }

    // CUSTOMIZATION SETTINGS
    function renderAvatarPicker() {
      const picker = document.getElementById('avatar-picker');
      picker.innerHTML = Object.keys(POKEMON_AVATARS).map(key => {
        const poke = POKEMON_AVATARS[key];
        const isSelected = localPlayer.avatarType === key;
        return `
          <div 
            onclick="selectAvatarType('${key}')"
            class="p-2.5 rounded-2xl border cursor-pointer transition flex items-center gap-2.5 ${
              isSelected ? 'border-[#bc6c25] bg-[#fefae0] shadow' : 'border-[#dda15e]/50 hover:bg-[#fefae0]/60'
            }"
          >
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-sm shrink-0" style="background-color: ${poke.bodyColor}">
              ${poke.icon}
            </div>
            <span class="text-xs font-bold text-[#603813]">${poke.name}</span>
          </div>
        `;
      }).join('');
    }

    function selectAvatarType(key) {
      localPlayer.avatarType = key;
      renderAvatarPicker();
    }

    function toggleSettingsModal() {
      const modal = document.getElementById('settings-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        document.getElementById('setting-username').value = localPlayer.name;
        renderAvatarPicker();
      }
    }

    function saveAvatarSettings() {
      const newName = document.getElementById('setting-username').value.trim();
      if (newName) {
        localPlayer.name = newName;
        localStorage.setItem('trainer_name', localPlayer.name);
      }
      localStorage.setItem('pokemon_avatar', localPlayer.avatarType);

      if (realtimeChannel) {
        realtimeChannel.track({
          id: localPlayer.id,
          name: localPlayer.name,
          avatarType: localPlayer.avatarType,
          x: localPlayer.x,
          y: localPlayer.y
        });
      }
      toggleSettingsModal();
    }

    function toggleChatSidebar() {
      document.getElementById('chat-sidebar').classList.toggle('translate-x-full');
    }

    // INITIALIZATION
    window.addEventListener('resize', resizeCanvas);

    window.addEventListener('load', async () => {
      lucide.createIcons();
      resizeCanvas();

      localPlayer.x = canvas.width / 2;
      localPlayer.y = canvas.height / 2 + 30;
      localPlayer.targetX = localPlayer.x;
      localPlayer.targetY = localPlayer.y;

      const { data } = await supabaseClient.auth.getSession();
      if (data?.session?.user) {
        const user = data.session.user;
        const dispName = user.user_metadata?.trainer_name || user.email.split('@')[0];
        completeUserLogin(user, dispName);
      }

      requestAnimationFrame(render);
    });
  </script>
</body>
</html>
