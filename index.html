<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sakura Slime World & Dungeon 🌸</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Yuji+Mai&display=swap" rel="stylesheet">

  <style>
    * {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 50%, #f472b6 100%);
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      margin: 0;
    }
    .font-sakura { font-family: 'Yuji Mai', serif; }
    .glass {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
    }
    .glass-dark {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(244, 114, 182, 0.3);
    }
    /* Falling Petals Animation */
    .petal {
      position: fixed;
      background-color: #fbcfe8;
      border-radius: 150% 0 150% 0;
      opacity: 0.7;
      pointer-events: none;
      z-index: 0;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { opacity: 0.8; top: -10%; transform: translateX(0) rotate(0deg); }
      100% { opacity: 0.2; top: 110%; transform: translateX(80px) rotate(360deg); }
    }
    #canvas-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
    ::-webkit-scrollbar-thumb { background: rgba(244,114,182,0.4); border-radius: 10px; }
  </style>
</head>
<body class="flex flex-col md:flex-row h-screen w-screen p-2 sm:p-4 gap-3 relative overflow-hidden">

  <!-- Petals background container -->
  <div id="petals-container"></div>

  <!-- Left Sidebar Controls & Navigation -->
  <aside class="w-full md:w-80 glass rounded-3xl shadow-2xl flex flex-col justify-between p-4 z-20 shrink-0 border border-pink-200/60 max-h-[96vh]">
    <div class="overflow-y-auto pr-1">
      
      <!-- Title Header -->
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-pink-200/60">
        <div class="flex items-center gap-2.5">
          <div class="bg-pink-500 text-white p-2 rounded-2xl shadow-md shadow-pink-300">
            <i data-lucide="flower-2" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="font-sakura text-base text-pink-900 font-bold">Sakura Slime World</h1>
            <p class="text-[10px] text-pink-600 font-medium">Virtual Lounge & RPG Dungeon</p>
          </div>
        </div>
      </div>

      <!-- User Profile & Level Stats Card -->
      <div class="bg-white/80 p-3 rounded-2xl border border-pink-200 shadow-sm mb-3">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2.5">
            <div id="user-avatar-badge" class="w-9 h-9 rounded-full bg-pink-500 text-white font-bold flex items-center justify-center text-xs shadow">
              🌸
            </div>
            <div>
              <p id="user-name-display" class="text-xs font-bold text-pink-950 truncate max-w-[100px]">Slime Hero</p>
              <p id="user-level-badge" class="text-[10px] text-pink-600 font-bold">Lvl 1 Adventurer</p>
            </div>
          </div>
          <button onclick="openCustomizer()" class="px-2.5 py-1.5 bg-pink-100 hover:bg-pink-200 text-pink-700 rounded-xl text-xs font-semibold transition flex items-center gap-1 shadow-xs">
            <i data-lucide="palette" class="w-3.5 h-3.5"></i> Customize
          </button>
        </div>
        <!-- EXP Progress Bar -->
        <div class="w-full bg-pink-100/80 h-2 rounded-full overflow-hidden border border-pink-200">
          <div id="exp-bar" class="bg-gradient-to-r from-emerald-400 to-green-500 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <p id="exp-text" class="text-[9px] text-right text-pink-600 mt-0.5 font-medium">EXP: 0 / 100</p>
      </div>

      <!-- Room Selector Zones -->
      <h2 class="text-[11px] font-bold text-pink-700 uppercase tracking-wider mb-2 px-1">Select Room Zone</h2>
      <div class="grid grid-cols-2 gap-1.5 mb-3">
        <button onclick="switchRoom('park')" id="btn-room-park" class="room-nav-btn flex items-center gap-2 px-2.5 py-2.5 rounded-xl text-xs font-semibold bg-pink-500 text-white shadow-sm transition">
          <i data-lucide="trees" class="w-4 h-4"></i> Swing Park
        </button>
        <button onclick="switchRoom('disco')" id="btn-room-disco" class="room-nav-btn flex items-center gap-2 px-2.5 py-2.5 rounded-xl text-xs font-medium text-pink-800 bg-white/60 hover:bg-pink-100 transition">
          <i data-lucide="disc" class="w-4 h-4"></i> Disco Club
        </button>
        <button onclick="switchRoom('onsen')" id="btn-room-onsen" class="room-nav-btn flex items-center gap-2 px-2.5 py-2.5 rounded-xl text-xs font-medium text-pink-800 bg-white/60 hover:bg-pink-100 transition">
          <i data-lucide="waves" class="w-4 h-4"></i> Onsen Spa
        </button>
        <button onclick="switchRoom('dungeon')" id="btn-room-dungeon" class="room-nav-btn flex items-center gap-2 px-2.5 py-2.5 rounded-xl text-xs font-bold text-purple-900 bg-purple-200/80 border border-purple-300 hover:bg-purple-300 transition">
          <i data-lucide="skull" class="w-4 h-4"></i> RPG Dungeon
        </button>
      </div>

      <!-- Live Room Chat Box -->
      <div class="flex flex-col h-36 bg-white/60 rounded-2xl border border-pink-200/60 p-2.5 shadow-inner">
        <h3 class="text-[11px] font-bold text-pink-800 mb-1.5 flex items-center gap-1">
          <i data-lucide="message-square" class="w-3.5 h-3.5 text-pink-500"></i> Room Chat Feed
        </h3>
        <div id="chat-messages" class="flex-1 overflow-y-auto space-y-1.5 text-[11px] pr-1">
          <p class="text-pink-400 italic text-center mt-4 text-[10px]">Welcome! Say hello in the room.</p>
        </div>
      </div>
    </div>

    <!-- Chat Input Form -->
    <form id="chat-form" class="flex items-center gap-1.5 mt-2 pt-2 border-t border-pink-200/60">
      <input 
        type="text" 
        id="chat-input" 
        placeholder="Type a message..." 
        autocomplete="off" 
        maxlength="90"
        class="flex-1 bg-white/80 border border-pink-300/50 rounded-xl px-3 py-2 text-xs text-pink-955 placeholder-pink-400 focus:outline-none focus:ring-2 focus:ring-pink-400 shadow-inner"
      />
      <button type="submit" class="bg-pink-500 hover:bg-pink-600 text-white p-2.5 rounded-xl shadow-md shadow-pink-300 transition">
        <i data-lucide="send" class="w-3.5 h-3.5"></i>
      </button>
    </form>
  </aside>

  <!-- Main Canvas Play Area -->
  <main class="flex-1 glass rounded-3xl shadow-2xl flex flex-col h-full relative overflow-hidden border border-pink-200/60">
    
    <!-- Top Floating Overlay Bar -->
    <div class="absolute top-4 left-4 right-4 z-20 flex items-center justify-between pointer-events-none">
      <div class="bg-white/80 backdrop-blur border border-pink-200 px-3 py-1.5 rounded-2xl flex items-center gap-2.5 shadow-sm pointer-events-auto">
        <span id="room-title-badge" class="text-xs font-bold text-pink-900">🌸 Swing Park Zone</span>
        <span class="text-[10px] text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full border border-emerald-200 font-semibold flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="online-count">1</span> Online
        </span>
      </div>

      <!-- Zoom In / Zoom Out Controls -->
      <div class="flex items-center gap-1.5 pointer-events-auto">
        <button onclick="adjustZoom(-0.1)" class="w-8 h-8 bg-white/80 hover:bg-white border border-pink-200 text-pink-900 rounded-xl font-bold text-sm shadow flex items-center justify-center">
          -
        </button>
        <span id="zoom-level-text" class="text-[11px] font-mono text-pink-900 bg-white/80 border border-pink-200 px-2 py-1 rounded-xl shadow-xs">100%</span>
        <button onclick="adjustZoom(0.1)" class="w-8 h-8 bg-white/80 hover:bg-white border border-pink-200 text-pink-900 rounded-xl font-bold text-sm shadow flex items-center justify-center">
          +
        </button>
      </div>
    </div>

    <!-- Canvas Wrapper with locked Aspect Ratio -->
    <div id="canvas-wrapper">
      <canvas id="gameCanvas" width="960" height="540"></canvas>
    </div>

    <!-- Mobile Action Touch Controls (Jump & Acid Shoot) -->
    <div class="absolute bottom-4 right-4 z-20 flex items-center gap-3 md:hidden pointer-events-auto">
      <button id="btn-action-shoot" onclick="shootAcid()" class="hidden w-14 h-14 bg-gradient-to-tr from-emerald-600 to-green-400 text-white font-bold rounded-full shadow-lg shadow-emerald-500/40 border-2 border-white/60 flex flex-col items-center justify-center text-[10px] active:scale-95 transition">
        <i data-lucide="crosshair" class="w-5 h-5"></i> SHOOT
      </button>
      <button onclick="triggerJump()" class="w-14 h-14 bg-gradient-to-tr from-pink-500 to-rose-400 text-white font-bold rounded-full shadow-lg shadow-pink-500/40 border-2 border-white/60 flex flex-col items-center justify-center text-[10px] active:scale-95 transition">
        <i data-lucide="arrow-up" class="w-5 h-5"></i> JUMP
      </button>
    </div>
  </main>

  <!-- Slime Customizer Modal -->
  <div id="customizer-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="glass w-full max-w-md rounded-3xl p-6 shadow-2xl border border-pink-200 space-y-4">
      <div class="flex items-center justify-between pb-2 border-b border-pink-200">
        <h2 class="font-sakura text-lg text-pink-900 font-bold">Customize Your Slime</h2>
        <button onclick="closeCustomizer()" class="text-pink-500 hover:text-pink-700 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Name Input -->
      <div>
        <label class="text-xs font-bold text-pink-800 block mb-1">Slime Name</label>
        <input type="text" id="modal-name-input" maxlength="15" class="w-full bg-white/80 border border-pink-300 rounded-xl px-3 py-2 text-xs text-pink-950 focus:outline-none focus:ring-2 focus:ring-pink-400" />
      </div>

      <!-- Color Palette -->
      <div>
        <label class="text-xs font-bold text-pink-800 block mb-1.5">Slime Color</label>
        <div class="flex items-center gap-3">
          <button onclick="selectColor('#f472b6')" class="w-8 h-8 rounded-full bg-pink-400 border-2 border-white shadow color-pick-btn" data-color="#f472b6"></button>
          <button onclick="selectColor('#38bdf8')" class="w-8 h-8 rounded-full bg-sky-400 border-2 border-white shadow color-pick-btn" data-color="#38bdf8"></button>
          <button onclick="selectColor('#34d399')" class="w-8 h-8 rounded-full bg-emerald-400 border-2 border-white shadow color-pick-btn" data-color="#34d399"></button>
          <button onclick="selectColor('#a78bfa')" class="w-8 h-8 rounded-full bg-purple-400 border-2 border-white shadow color-pick-btn" data-color="#a78bfa"></button>
          <button onclick="selectColor('#fbbf24')" class="w-8 h-8 rounded-full bg-amber-400 border-2 border-white shadow color-pick-btn" data-color="#fbbf24"></button>
        </div>
      </div>

      <!-- Accessory Selector -->
      <div>
        <label class="text-xs font-bold text-pink-800 block mb-1.5">Accessory</label>
        <div class="grid grid-cols-4 gap-2">
          <button onclick="selectAccessory('none')" class="acc-btn p-2 rounded-xl bg-white/70 border border-pink-200 text-xs font-semibold text-pink-900 hover:bg-pink-100 transition" data-acc="none">None</button>
          <button onclick="selectAccessory('flower')" class="acc-btn p-2 rounded-xl bg-white/70 border border-pink-200 text-xs font-semibold text-pink-900 hover:bg-pink-100 transition" data-acc="flower">🌸 Flower</button>
          <button onclick="selectAccessory('crown')" class="acc-btn p-2 rounded-xl bg-white/70 border border-pink-200 text-xs font-semibold text-pink-900 hover:bg-pink-100 transition" data-acc="crown">👑 Crown</button>
          <button onclick="selectAccessory('ninja')" class="acc-btn p-2 rounded-xl bg-white/70 border border-pink-200 text-xs font-semibold text-pink-900 hover:bg-pink-100 transition" data-acc="ninja">🥷 Ninja</button>
        </div>
      </div>

      <button onclick="saveCustomization()" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-md shadow-pink-300 transition">
        Save & Apply
      </button>
    </div>
  </div>

  <script>
    // Supabase Credentials
    const SUPABASE_URL = 'https://brvyjdtnxzjlrhukngjn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydnlqZHRueHpqbHJodWtuZ2puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTAwMjcsImV4cCI6MjEwODA4NjAyN30.2ib-m3ju3SEhJLaQHQdA8xinenbtN5MltOatIYZSZIE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Player State
    let myId = 'user_' + Math.random().toString(36).substring(2, 9);
    let myName = localStorage.getItem('slime_name') || ('Slime_' + Math.floor(100 + Math.random() * 900));
    let myLevel = parseInt(localStorage.getItem('slime_lvl') || '1');
    let myExp = parseInt(localStorage.getItem('slime_exp') || '0');
    let expToNext = myLevel * 100;

    let currentRoom = 'park';
    let myColor = localStorage.getItem('slime_color') || '#f472b6';
    let myAccessory = localStorage.getItem('slime_acc') || 'flower';

    // Position & Physics
    let myX = 480, myY = 270;
    let targetX = 480, targetY = 270;
    let jumpZ = 0, jumpVelocity = 0;
    let isJumping = false;
    let zoomLevel = 1.0;

    // Projectiles & Dungeon Enemies
    let acidProjectiles = [];
    let dungeonEnemies = [];

    // Multiplayer State
    let players = {};
    let chatBubbles = {};
    let roomChannel = null;

    // Input Keys
    const keys = {};

    // Canvas
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      updatePlayerStatsUI();
      setupCanvasScale();
      window.addEventListener('resize', setupCanvasScale);
      setupControls();
      connectRealtime();
      createPetals();
      requestAnimationFrame(gameLoop);
    });

    // Ratio Scaling for Desktop & Mobile
    function setupCanvasScale() {
      const wrapper = document.getElementById('canvas-wrapper');
      const w = wrapper.clientWidth;
      const h = wrapper.clientHeight;
      const aspect = 960 / 540;

      let renderW = w;
      let renderH = w / aspect;

      if (renderH > h) {
        renderH = h;
        renderW = h * aspect;
      }

      canvas.style.width = `${renderW}px`;
      canvas.style.height = `${renderH}px`;
    }

    function adjustZoom(delta) {
      zoomLevel = Math.max(0.7, Math.min(1.5, zoomLevel + delta));
      document.getElementById('zoom-level-text').textContent = `${Math.round(zoomLevel * 100)}%`;
    }

    function updatePlayerStatsUI() {
      localStorage.setItem('slime_name', myName);
      localStorage.setItem('slime_lvl', myLevel);
      localStorage.setItem('slime_exp', myExp);
      localStorage.setItem('slime_color', myColor);
      localStorage.setItem('slime_acc', myAccessory);

      document.getElementById('user-name-display').textContent = myName;
      document.getElementById('user-level-badge').textContent = `Lvl ${myLevel} Adventurer`;
      document.getElementById('user-avatar-badge').style.backgroundColor = myColor;

      expToNext = myLevel * 100;
      const pct = Math.min(100, Math.floor((myExp / expToNext) * 100));
      document.getElementById('exp-bar').style.width = `${pct}%`;
      document.getElementById('exp-text').textContent = `EXP: ${myExp} / ${expToNext}`;
    }

    // Customizer Modal Handlers
    function openCustomizer() {
      document.getElementById('modal-name-input').value = myName;
      document.getElementById('customizer-modal').classList.remove('hidden');
    }
    function closeCustomizer() {
      document.getElementById('customizer-modal').classList.add('hidden');
    }
    function selectColor(c) { myColor = c; }
    function selectAccessory(acc) { myAccessory = acc; }
    function saveCustomization() {
      const val = document.getElementById('modal-name-input').value.trim();
      if (val) myName = val;
      updatePlayerStatsUI();
      closeCustomizer();
      broadcastPosition();
    }

    // Switch Rooms
    function switchRoom(roomName) {
      currentRoom = roomName;
      document.querySelectorAll('.room-nav-btn').forEach(btn => {
        btn.classList.remove('bg-pink-500', 'text-white', 'shadow-sm', 'font-semibold');
        btn.classList.add('text-pink-800', 'bg-white/60');
      });
      const activeBtn = document.getElementById(`btn-room-${roomName}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-pink-500', 'text-white', 'shadow-sm', 'font-semibold');
        activeBtn.classList.remove('text-pink-800', 'bg-white/60');
      }

      const titles = {
        park: '🌸 Swing Park Zone',
        disco: '🪩 Disco Club Zone',
        onsen: '♨️ Onsen Spa Zone',
        dungeon: '⚔️ Monster Dungeon Portal'
      };
      document.getElementById('room-title-badge').textContent = titles[roomName] || roomName;

      const shootBtn = document.getElementById('btn-action-shoot');
      if (roomName === 'dungeon') {
        shootBtn.classList.remove('hidden');
        spawnDungeonEnemies();
      } else {
        shootBtn.classList.add('hidden');
      }

      players = {};
      chatBubbles = {};
      connectRealtime();
    }

    // Realtime Sync
    function connectRealtime() {
      if (roomChannel) supabaseClient.removeChannel(roomChannel);

      roomChannel = supabaseClient.channel(`room:${currentRoom}`, {
        config: { presence: { key: myId } }
      });

      roomChannel
        .on('broadcast', { event: 'move' }, p => {
          if (p.payload.id !== myId) players[p.payload.id] = p.payload;
        })
        .on('broadcast', { event: 'chat' }, p => {
          triggerChatBubble(p.payload.id, p.payload.text);
          appendChatLog(p.payload.name, p.payload.text);
        })
        .on('broadcast', { event: 'shoot' }, p => {
          if (p.payload.id !== myId) {
            acidProjectiles.push({
              x: p.payload.x, y: p.payload.y,
              vx: p.payload.vx, vy: p.payload.vy,
              color: '#34d399', life: 60
            });
          }
        })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await roomChannel.track({ id: myId, name: myName, level: myLevel, room: currentRoom });
            broadcastPosition();
          }
        });

      roomChannel.on('presence', { event: 'sync' }, () => {
        const state = roomChannel.presenceState();
        let total = 0;
        Object.values(state).forEach(presences => total += presences.length);
        document.getElementById('online-count').textContent = total;
      });
    }

    function broadcastPosition() {
      if (!roomChannel) return;
      roomChannel.send({
        type: 'broadcast',
        event: 'move',
        payload: { id: myId, name: myName, level: myLevel, x: myX, y: myY, jumpZ, color: myColor, accessory: myAccessory }
      });
    }

    // Dungeon combat & acid shooting
    function shootAcid() {
      if (currentRoom !== 'dungeon') return;

      let angle = Math.atan2(targetY - myY, targetX - myX);
      if (Math.abs(targetX - myX) < 5 && Math.abs(targetY - myY) < 5) {
        angle = -Math.PI / 2;
      }

      const speed = 7;
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;

      acidProjectiles.push({ x: myX, y: myY - 10, vx, vy, color: '#34d399', life: 60 });

      if (roomChannel) {
        roomChannel.send({
          type: 'broadcast',
          event: 'shoot',
          payload: { id: myId, x: myX, y: myY - 10, vx, vy }
        });
      }
    }

    function spawnDungeonEnemies() {
      dungeonEnemies = [];
      for (let i = 0; i < 6; i++) {
        dungeonEnemies.push({
          id: i,
          x: 120 + Math.random() * 720,
          y: 100 + Math.random() * 340,
          hp: 2, maxHp: 2
        });
      }
    }

    // Chat handling
    document.getElementById('chat-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      triggerChatBubble(myId, text);
      appendChatLog(myName, text);

      if (roomChannel) {
        roomChannel.send({
          type: 'broadcast',
          event: 'chat',
          payload: { id: myId, name: myName, text }
        });
      }
    });

    function triggerChatBubble(id, text) {
      chatBubbles[id] = { text, timer: 160 };
    }

    function appendChatLog(name, text) {
      const box = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = "bg-white/80 p-1.5 rounded-xl border border-pink-200/50";
      div.innerHTML = `<span class="font-bold text-pink-900">${escapeHtml(name)}:</span> <span class="text-pink-950">${escapeHtml(text)}</span>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.innerText = s;
      return d.innerHTML;
    }

    // Controls & Events
    function setupControls() {
      window.addEventListener('keydown', e => {
        if (document.activeElement.tagName === 'INPUT') return;
        keys[e.code] = true;
        if (e.code === 'Space') triggerJump();
        if (e.code === 'KeyF') shootAcid();
      });

      window.addEventListener('keyup', e => { keys[e.code] = false; });

      canvas.addEventListener('pointerdown', e => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        targetX = (e.clientX - rect.left) * scaleX;
        targetY = (e.clientY - rect.top) * scaleY;

        if (currentRoom === 'dungeon') shootAcid();
      });
    }

    function triggerJump() {
      if (!isJumping) {
        isJumping = true;
        jumpVelocity = 7;
      }
    }

    // Game Loop
    let lastBroadcastTime = 0;
    function gameLoop(time) {
      updatePhysics();
      renderScene();

      if (time - lastBroadcastTime > 80) {
        broadcastPosition();
        lastBroadcastTime = time;
      }

      requestAnimationFrame(gameLoop);
    }

    function updatePhysics() {
      let dx = 0, dy = 0;
      if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

      const spd = 3.5;
      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        myX += (dx / len) * spd;
        myY += (dy / len) * spd;
        targetX = myX; targetY = myY;
      } else {
        const dist = Math.hypot(targetX - myX, targetY - myY);
        if (dist > 3) {
          myX += ((targetX - myX) / dist) * spd;
          myY += ((targetY - myY) / dist) * spd;
        }
      }

      myX = Math.max(30, Math.min(canvas.width - 30, myX));
      myY = Math.max(50, Math.min(canvas.height - 30, myY));

      if (isJumping) {
        jumpZ += jumpVelocity;
        jumpVelocity -= 0.5;
        if (jumpZ <= 0) {
          jumpZ = 0;
          isJumping = false;
        }
      }

      // Acid collision update
      for (let i = acidProjectiles.length - 1; i >= 0; i--) {
        const p = acidProjectiles[i];
        p.x += p.vx; p.y += p.vy;
        p.life--;

        if (currentRoom === 'dungeon') {
          dungeonEnemies.forEach(e => {
            if (e.hp > 0 && Math.hypot(p.x - e.x, p.y - e.y) < 24) {
              e.hp--;
              p.life = 0;
              if (e.hp <= 0) {
                myExp += 25;
                if (myExp >= expToNext) {
                  myLevel++;
                  myExp -= expToNext;
                  triggerChatBubble(myId, `🎉 LEVEL UP! LVL ${myLevel}!`);
                }
                updatePlayerStatsUI();
              }
            }
          });
        }
        if (p.life <= 0) acidProjectiles.splice(i, 1);
      }
    }

    // Render Scene
    function renderScene() {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Apply Zoom around center
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(zoomLevel, zoomLevel);
      ctx.translate(-canvas.width / 2, -canvas.height / 2);

      drawRoomEnvironment();

      if (currentRoom === 'dungeon') {
        dungeonEnemies.forEach(e => { if (e.hp > 0) drawEnemy(e); });
      }

      acidProjectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill();
      });

      Object.values(players).forEach(p => {
        drawSlime(p.x, p.y, p.jumpZ || 0, p.name, p.level || 1, p.color, p.accessory || 'flower', p.id);
      });

      drawSlime(myX, myY, jumpZ, myName, myLevel, myColor, myAccessory, myId);

      ctx.restore();
    }

    function drawRoomEnvironment() {
      if (currentRoom === 'park') {
        ctx.fillStyle = '#bbf7d0';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Swings
        ctx.strokeStyle = '#f472b6'; ctx.lineWidth = 4;
        ctx.strokeRect(200, 100, 120, 80);
        ctx.fillStyle = '#db2777';
        ctx.fillRect(220, 150, 20, 6); ctx.fillRect(280, 150, 20, 6);

        drawSakuraTree(100, 120);
        drawSakuraTree(860, 400);
      } else if (currentRoom === 'disco') {
        ctx.fillStyle = '#1e1b4b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const t = Date.now() * 0.003;
        for (let x = 80; x < canvas.width - 80; x += 60) {
          for (let y = 80; y < canvas.height - 80; y += 60) {
            const h = Math.floor((x + y + t * 100) % 360);
            ctx.fillStyle = `hsla(${h}, 80%, 60%, 0.4)`;
            ctx.fillRect(x, y, 56, 56);
          }
        }
      } else if (currentRoom === 'onsen') {
        ctx.fillStyle = '#a7f3d0';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0284c7';
        ctx.beginPath(); ctx.ellipse(480, 270, 220, 130, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 6; ctx.stroke();
      } else if (currentRoom === 'dungeon') {
        ctx.fillStyle = '#31103f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(244, 114, 182, 0.15)'; ctx.lineWidth = 2;
        for (let x = 0; x < canvas.width; x += 60) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 60) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
      }
    }

    function drawSakuraTree(x, y) {
      ctx.fillStyle = '#f472b6';
      ctx.beginPath(); ctx.arc(x, y - 30, 45, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#78350f';
      ctx.fillRect(x - 8, y - 10, 16, 35);
    }

    function drawEnemy(e) {
      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.arc(e.x, e.y, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.fillRect(e.x - 16, e.y - 26, 32, 5);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(e.x - 16, e.y - 26, (e.hp / e.maxHp) * 32, 5);
    }

    function drawSlime(x, y, z, name, level, color, acc, id) {
      const renderY = y - z;

      // Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.beginPath(); ctx.ellipse(x, y + 10, 16, 6, 0, 0, Math.PI * 2); ctx.fill();

      // Slime Body
      const squish = z > 0 ? 0.85 : 1.0;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(x, renderY, 18 * (2 - squish), 16 * squish, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.stroke();

      // Eyes
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x - 5, renderY - 3, 3, 0, Math.PI * 2);
      ctx.arc(x + 5, renderY - 3, 3, 0, Math.PI * 2);
      ctx.fill();

      // Accessories
      if (acc === 'flower') {
        ctx.fillStyle = '#fb7185';
        ctx.beginPath(); ctx.arc(x + 8, renderY - 12, 6, 0, Math.PI * 2); ctx.fill();
      } else if (acc === 'crown') {
        ctx.fillStyle = '#facc15';
        ctx.fillRect(x - 8, renderY - 22, 16, 6);
      } else if (acc === 'ninja') {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(x - 14, renderY - 10, 28, 6);
      }

      // Name Badge
      ctx.fillStyle = '#831843';
      ctx.font = 'bold 11px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`Lvl ${level} ${name}`, x, renderY - 26);

      // Chat Bubble
      if (chatBubbles[id] && chatBubbles[id].timer > 0) {
        chatBubbles[id].timer--;
        const bText = chatBubbles[id].text;

        ctx.font = '11px "Plus Jakarta Sans", sans-serif';
        const tw = ctx.measureText(bText).width;
        const bw = Math.max(tw + 16, 36);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.strokeStyle = '#f472b6'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.roundRect(x - bw / 2, renderY - 58, bw, 24, 8);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#831843';
        ctx.fillText(bText, x, renderY - 42);
      }
    }

    function createPetals() {
      const container = document.getElementById('petals-container');
      for (let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.className = 'petal';
        const size = Math.random() * 10 + 6;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.left = `${Math.random() * 100}vw`;
        p.style.animationDuration = `${Math.random() * 7 + 5}s`;
        p.style.animationDelay = `${Math.random() * 5}s`;
        container.appendChild(p);
      }
    }
  </script>
</body>
