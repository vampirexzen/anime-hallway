<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sakura World 🌸 - 2D Virtual Realtime Chatroom</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Yuji+Mai&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 50%, #f472b6 100%);
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }

    .font-sakura {
      font-family: 'Yuji Mai', serif;
    }

    /* Glassmorphism Styles */
    .glass {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    .glass-dark {
      background: rgba(255, 241, 248, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(244, 114, 182, 0.35);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(244, 114, 182, 0.4);
    }

    .glass-input:focus {
      background: rgba(255, 255, 255, 0.98);
      border-color: #ec4899;
      outline: none;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.25);
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(244, 114, 182, 0.5);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(236, 72, 153, 0.8);
    }

    /* Controls UI */
    .dpad-btn {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(244, 114, 182, 0.5);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .dpad-btn:active {
      background: rgba(236, 72, 153, 0.85);
      color: white;
      transform: scale(0.92);
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden select-none">

  <!-- Top Navigation Header -->
  <header class="h-14 glass px-4 flex items-center justify-between z-30 shrink-0 border-b border-pink-200/60 shadow-sm">
    <div class="flex items-center gap-3">
      <div class="bg-gradient-to-tr from-pink-500 to-rose-400 text-white p-2 rounded-xl shadow-md shadow-pink-300">
        <i data-lucide="flower-2" class="w-5 h-5 animate-spin" style="animation-duration: 12s;"></i>
      </div>
      <div>
        <h1 class="font-sakura text-lg text-pink-950 font-bold tracking-wide leading-none">Sakura World 🌸</h1>
        <p class="text-[10px] text-pink-600 font-semibold tracking-wider uppercase mt-0.5" id="room-indicator">#sakura-lounge</p>
      </div>
    </div>

    <!-- Right Header Tools -->
    <div class="flex items-center gap-2">
      <!-- Active Players Counter -->
      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-pink-100/80 border border-pink-200/80 text-pink-800 text-xs font-semibold">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="player-count">1 Online</span>
      </div>

      <!-- Settings / Customization Modal Button -->
      <button onclick="toggleSettingsModal()" class="p-2 rounded-xl bg-white/80 hover:bg-pink-100 text-pink-800 transition border border-pink-200/60 shadow-sm active:scale-95 flex items-center gap-1 text-xs font-semibold" title="Customize Avatar">
        <i data-lucide="user-cog" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Avatar</span>
      </button>

      <!-- Toggle Chat Drawer Button -->
      <button onclick="toggleChatSidebar()" class="p-2 rounded-xl bg-pink-500 hover:bg-pink-600 text-white transition shadow-md shadow-pink-300 active:scale-95 md:hidden" title="Toggle Chat">
        <i data-lucide="message-square" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- Main View Area (Canvas + Sidebar) -->
  <div class="flex-1 flex relative overflow-hidden">

    <!-- Game World Canvas Container -->
    <div class="flex-1 relative bg-pink-900/10 flex items-center justify-center overflow-hidden" id="canvas-container">
      <canvas id="gameCanvas" class="block w-full h-full cursor-pointer touch-none"></canvas>

      <!-- On-Screen Controls Hint Overlay (Fades out) -->
      <div id="controls-hint" class="absolute top-4 left-4 pointer-events-none glass px-3.5 py-2 rounded-2xl border border-pink-200/80 shadow-md text-xs text-pink-950 flex items-center gap-2 transition-opacity duration-500 z-10">
        <i data-lucide="gamepad-2" class="w-4 h-4 text-pink-600"></i>
        <span>Move: <strong class="text-pink-700">WASD / Arrows / Tap Screen</strong></span>
      </div>

      <!-- On-Screen Virtual Touch D-Pad (Visible on Mobile) -->
      <div class="absolute bottom-6 left-6 z-20 grid grid-cols-3 gap-1.5 w-36 h-36 md:hidden pointer-events-auto">
        <div></div>
        <button ontouchstart="startMove('up', event)" ontouchend="stopMove('up', event)" onmousedown="startMove('up', event)" onmouseup="stopMove('up', event)" class="dpad-btn rounded-t-2xl flex items-center justify-center font-bold text-pink-800 text-xl shadow">▲</button>
        <div></div>
        <button ontouchstart="startMove('left', event)" ontouchend="stopMove('left', event)" onmousedown="startMove('left', event)" onmouseup="stopMove('left', event)" class="dpad-btn rounded-l-2xl flex items-center justify-center font-bold text-pink-800 text-xl shadow">◀</button>
        <div class="dpad-btn rounded-lg bg-pink-200/50 flex items-center justify-center text-[10px] text-pink-700 font-bold">PAD</div>
        <button ontouchstart="startMove('right', event)" ontouchend="stopMove('right', event)" onmousedown="startMove('right', event)" onmouseup="stopMove('right', event)" class="dpad-btn rounded-r-2xl flex items-center justify-center font-bold text-pink-800 text-xl shadow">▶</button>
        <div></div>
        <button ontouchstart="startMove('down', event)" ontouchend="stopMove('down', event)" onmousedown="startMove('down', event)" onmouseup="stopMove('down', event)" class="dpad-btn rounded-b-2xl flex items-center justify-center font-bold text-pink-800 text-xl shadow">▼</button>
        <div></div>
      </div>
    </div>

    <!-- Sidebar Chat Box -->
    <aside id="chat-sidebar" class="w-full md:w-80 lg:w-96 glass-dark border-l border-pink-200/80 flex flex-col justify-between absolute md:relative right-0 top-0 bottom-0 z-20 transition-transform duration-300 transform translate-x-full md:translate-x-0 shadow-2xl md:shadow-none">
      
      <!-- Sidebar Channels Header -->
      <div class="p-3.5 border-b border-pink-200/80 bg-white/60 flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-pink-800 uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="compass" class="w-3.5 h-3.5"></i> Zen World Rooms
          </span>
          <button onclick="toggleChatSidebar()" class="md:hidden text-pink-700 hover:text-pink-900 p-1">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        
        <!-- Channels Selector Buttons -->
        <div class="grid grid-cols-3 gap-1.5">
          <button onclick="switchChannel('sakura-lounge')" id="chan-btn-sakura-lounge" class="chan-btn px-2 py-1.5 rounded-xl text-xs font-semibold bg-pink-500 text-white shadow-sm transition">
            🌸 Lounge
          </button>
          <button onclick="switchChannel('gaming-shrine')" id="chan-btn-gaming-shrine" class="chan-btn px-2 py-1.5 rounded-xl text-xs font-medium text-pink-800 hover:bg-pink-200/60 transition">
            ⛩️ Shrine
          </button>
          <button onclick="switchChannel('arcade-lounge')" id="chan-btn-arcade-lounge" class="chan-btn px-2 py-1.5 rounded-xl text-xs font-medium text-pink-800 hover:bg-pink-200/60 transition">
            🕹️ Arcade
          </button>
        </div>
      </div>

      <!-- Chat Log Stream -->
      <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3">
        <!-- Messages rendered dynamically with persistence -->
      </div>

      <!-- Input Bar -->
      <div class="p-3 bg-white/70 border-t border-pink-200/80">
        <form id="chat-form" class="flex items-center gap-2">
          <input 
            type="text" 
            id="chat-input" 
            placeholder="Type a message & press Enter..." 
            maxlength="120"
            autocomplete="off"
            class="glass-input flex-1 px-3.5 py-2.5 rounded-xl text-sm text-pink-950 placeholder-pink-400 font-medium"
          />
          <button 
            type="submit" 
            class="bg-pink-500 hover:bg-pink-600 text-white p-2.5 rounded-xl shadow-md shadow-pink-300 transition shrink-0 active:scale-95"
          >
            <i data-lucide="send" class="w-4 h-4"></i>
          </button>
        </form>
      </div>
    </aside>
  </div>

  <!-- Customization Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="glass w-full max-w-md rounded-3xl p-6 shadow-2xl border border-white space-y-5 animate-in fade-in zoom-in-95 duration-200">
      <div class="flex items-center justify-between border-b border-pink-200/80 pb-3">
        <div class="flex items-center gap-2">
          <i data-lucide="sparkles" class="w-5 h-5 text-pink-600"></i>
          <h3 class="font-bold text-pink-950 text-lg">Customize Your Character</h3>
        </div>
        <button onclick="toggleSettingsModal()" class="text-pink-700 hover:text-pink-900 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Username Customization -->
      <div class="space-y-1.5">
        <label class="text-xs font-bold text-pink-800 uppercase tracking-wider">Display Name</label>
        <input type="text" id="setting-username" maxlength="15" class="glass-input w-full px-3.5 py-2.5 rounded-xl text-sm font-semibold text-pink-950" placeholder="Your Avatar Name..." />
      </div>

      <!-- Avatar Selection -->
      <div class="space-y-2">
        <label class="text-xs font-bold text-pink-800 uppercase tracking-wider">Choose Chibi Companion</label>
        <div class="grid grid-cols-2 gap-3" id="avatar-picker">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <!-- Save Button -->
      <button onclick="saveAvatarSettings()" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 rounded-2xl shadow-lg shadow-pink-300 transition active:scale-95 flex items-center justify-center gap-2">
        <i data-lucide="check" class="w-5 h-5"></i> Save Avatar & Explore
      </button>
    </div>
  </div>

  <script>
    // --- SUPABASE CONFIGURATION (Realtime Channel & Presence) ---
    const SUPABASE_URL = 'https://brvyjdtnxzjlrhukngjn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydnlqZHRueHpqbHJodWtuZ2puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTAwMjcsImV4cCI6MjEwODA4NjAyN30.2ib-m3ju3SEhJLaQHQdA8xinenbtN5MltOatIYZSZIE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- AVATAR TYPES & PRESETS ---
    const AVATAR_TYPES = {
      sakura: { name: 'Sakura Chibi', bodyColor: '#f472b6', accentColor: '#fb7185', earType: 'flower', item: '🌸' },
      spirit: { name: 'Ocean Neko', bodyColor: '#38bdf8', accentColor: '#0284c7', earType: 'cat', item: '🌊' },
      fox:    { name: 'Kitsune Fox', bodyColor: '#fb923c', accentColor: '#c2410c', earType: 'fox', item: '🦊' },
      ninja:  { name: 'Matcha Slime', bodyColor: '#4ade80', accentColor: '#15803d', earType: 'ribbon', item: '🍵' }
    };

    // --- GAME & PLAYER STATE ---
    let localPlayer = {
      id: 'usr_' + Math.random().toString(36).substring(2, 9),
      name: localStorage.getItem('sakura_avatar_name') || 'Wanderer_' + Math.floor(100 + Math.random() * 900),
      avatarType: localStorage.getItem('sakura_avatar_type') || 'sakura',
      x: 400,
      y: 300,
      targetX: 400,
      targetY: 300,
      vx: 0,
      vy: 0,
      speed: 4.2,
      direction: 'down',
      isMoving: false,
      speechBubble: null // { text: '', expiresAt: 0 }
    };

    let remotePlayers = {};
    let currentChannel = 'sakura-lounge';
    let realtimeChannel = null;
    let petals = [];

    // --- PERSISTENT CHAT STORAGE (Client-side memory + LocalStorage buffer) ---
    const chatMemory = {
      'sakura-lounge': JSON.parse(localStorage.getItem('chat_sakura-lounge') || '[]'),
      'gaming-shrine': JSON.parse(localStorage.getItem('chat_gaming-shrine') || '[]'),
      'arcade-lounge': JSON.parse(localStorage.getItem('chat_arcade-lounge') || '[]')
    };

    // Keyboard Controls
    const keys = { up: false, down: false, left: false, right: false };

    // --- CANVAS SETUP ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const container = document.getElementById('canvas-container');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      
      // Clamp player inside view
      localPlayer.x = Math.max(40, Math.min(canvas.width - 40, localPlayer.x));
      localPlayer.y = Math.max(40, Math.min(canvas.height - 40, localPlayer.y));
    }

    // --- PETAL PARTICLES ---
    function initPetals() {
      petals = [];
      const count = 45;
      for (let i = 0; i < count; i++) {
        petals.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          size: Math.random() * 6 + 4,
          speedY: Math.random() * 1.2 + 0.6,
          speedX: Math.random() * 0.8 - 0.4,
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.03
        });
      }
    }

    function updateAndDrawPetals() {
      ctx.fillStyle = 'rgba(251, 207, 232, 0.8)';
      petals.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX + Math.sin(p.y * 0.015) * 0.4;
        p.rotation += p.rotSpeed;

        if (p.y > canvas.height + 15) {
          p.y = -15;
          p.x = Math.random() * canvas.width;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    // --- MAP DRAWING (ROOM SPECIFIC TREES & DETAILS) ---
    function drawEnvironment() {
      const w = canvas.width;
      const h = canvas.height;

      if (currentChannel === 'sakura-lounge') {
        // Soft Tatami Zen Floor
        ctx.fillStyle = '#fce7f3';
        ctx.fillRect(0, 0, w, h);

        // Tatami Floor Mats
        ctx.strokeStyle = 'rgba(244, 114, 182, 0.25)';
        ctx.lineWidth = 2;
        const tileSize = 90;
        for (let x = 0; x < w; x += tileSize) {
          for (let y = 0; y < h; y += tileSize) {
            ctx.strokeRect(x, y, tileSize, tileSize);
          }
        }

        // Zen Koi Pond in Center Bottom
        drawPond(w / 2, h / 2 + 80, 120, 60);

        // Multiple Blossoming Sakura Trees (4 Trees around map)
        drawSakuraTree(110, 110, 48);
        drawSakuraTree(w - 110, 110, 48);
        drawSakuraTree(120, h - 120, 44);
        drawSakuraTree(w - 120, h - 120, 44);

        // Lanterns & Mats
        drawLantern(220, 90);
        drawLantern(w - 220, 90);

      } else if (currentChannel === 'gaming-shrine') {
        // Red Shrine Courtyard
        ctx.fillStyle = '#fbcfe8';
        ctx.fillRect(0, 0, w, h);

        // Stone Tile Pattern
        ctx.strokeStyle = 'rgba(225, 29, 72, 0.15)';
        ctx.lineWidth = 1.5;
        for (let x = 0; x < w; x += 60) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, h);
          ctx.stroke();
        }

        // Torii Gate Shrine Center
        drawToriiGate(w / 2, 130);

        // 5 Cherry Blossom Trees framing the Shrine
        drawSakuraTree(80, 120, 42);
        drawSakuraTree(w - 80, 120, 42);
        drawSakuraTree(w / 2 - 200, 180, 45);
        drawSakuraTree(w / 2 + 200, 180, 45);
        drawSakuraTree(w / 2, h - 100, 50);

        // Stone Lanterns
        drawLantern(w / 2 - 110, 160);
        drawLantern(w / 2 + 110, 160);

      } else if (currentChannel === 'arcade-lounge') {
        // Neon Pink Arcade Room
        ctx.fillStyle = '#2e1065';
        ctx.fillRect(0, 0, w, h);

        // Cyber Grid Lines
        ctx.strokeStyle = 'rgba(236, 72, 153, 0.25)';
        ctx.lineWidth = 1;
        for (let x = 0; x < w; x += 50) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
        }
        for (let y = 0; y < h; y += 50) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }

        // Glowing Arcade Cabinets
        drawArcadeCabinet(120, 100, '#ec4899', 'PAC-SAKURA');
        drawArcadeCabinet(220, 100, '#8b5cf6', 'NEON DASH');
        drawArcadeCabinet(w - 220, 100, '#06b6d4', 'BOBA HERO');
        drawArcadeCabinet(w - 120, 100, '#f59e0b', 'CHIBI KOI');

        // Indoor Sakura Pots in Arcade
        drawPottedSakuraTree(90, h - 120);
        drawPottedSakuraTree(w - 90, h - 120);
      }

      // Outer Room Border
      ctx.lineWidth = 10;
      ctx.strokeStyle = 'rgba(244, 114, 182, 0.4)';
      ctx.strokeRect(0, 0, w, h);
    }

    // --- ENVIRONMENT HELPERS ---
    function drawSakuraTree(x, y, radius) {
      // Tree Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
      ctx.beginPath();
      ctx.ellipse(x, y + radius * 0.7, radius * 0.9, radius * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      // Trunk
      ctx.strokeStyle = '#7c2d12';
      ctx.lineWidth = Math.max(6, radius * 0.2);
      ctx.beginPath();
      ctx.moveTo(x, y + radius * 0.6);
      ctx.quadraticCurveTo(x - 5, y + 10, x, y - radius * 0.2);
      ctx.stroke();

      // Fluffy Sakura Canopy
      const clusters = [
        { dx: 0, dy: -radius * 0.4, r: radius * 0.6, color: '#f472b6' },
        { dx: -radius * 0.4, dy: -radius * 0.1, r: radius * 0.5, color: '#ec4899' },
        { dx: radius * 0.4, dy: -radius * 0.1, r: radius * 0.5, color: '#f472b6' },
        { dx: -radius * 0.2, dy: -radius * 0.6, r: radius * 0.45, color: '#fbcfe8' },
        { dx: radius * 0.2, dy: -radius * 0.6, r: radius * 0.45, color: '#fbcfe8' }
      ];

      clusters.forEach(c => {
        ctx.fillStyle = c.color;
        ctx.beginPath();
        ctx.arc(x + c.dx, y + c.dy, c.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawPottedSakuraTree(x, y) {
      // Pot
      ctx.fillStyle = '#ec4899';
      ctx.beginPath();
      ctx.roundRect(x - 18, y + 10, 36, 25, 6);
      ctx.fill();

      drawSakuraTree(x, y - 10, 32);
    }

    function drawPond(x, y, rx, ry) {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.45)';
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Lily Pads
      ctx.fillStyle = '#22c55e';
      ctx.beginPath(); ctx.arc(x - 30, y - 10, 12, 0, Math.PI * 1.8); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 40, y + 10, 15, 0, Math.PI * 1.8); ctx.fill();
    }

    function drawToriiGate(x, y) {
      ctx.fillStyle = '#dc2626';
      // Pillars
      ctx.fillRect(x - 60, y - 60, 12, 80);
      ctx.fillRect(x + 48, y - 60, 12, 80);
      // Top Beams
      ctx.fillRect(x - 80, y - 60, 160, 14);
      ctx.fillRect(x - 70, y - 42, 140, 10);
      // Black Accent Top
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(x - 84, y - 66, 168, 6);
    }

    function drawLantern(x, y) {
      // Glow
      const glow = ctx.createRadialGradient(x, y, 4, x, y, 28);
      glow.addColorStop(0, 'rgba(253, 224, 71, 0.6)');
      glow.addColorStop(1, 'rgba(253, 224, 71, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(x, y, 28, 0, Math.PI * 2); ctx.fill();

      // Body
      ctx.fillStyle = '#f97316';
      ctx.beginPath(); ctx.roundRect(x - 10, y - 12, 20, 24, 4); ctx.fill();
      ctx.fillStyle = '#451a03';
      ctx.fillRect(x - 12, y - 16, 24, 4);
      ctx.fillRect(x - 12, y + 12, 24, 4);
    }

    function drawArcadeCabinet(x, y, color, title) {
      ctx.fillStyle = '#1e1b4b';
      ctx.fillRect(x - 22, y - 40, 44, 70);
      ctx.fillStyle = color;
      ctx.fillRect(x - 20, y - 38, 40, 15); // Screen header
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(x - 18, y - 20, 36, 26); // Screen

      // Screen glow text
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 7px "Plus Jakarta Sans"';
      ctx.textAlign = 'center';
      ctx.fillText(title, x, y - 7);
    }

    // --- REFINED AVATAR & SPEECH BUBBLE RENDERING ---
    function drawAvatar(player, isSelf = false) {
      const { x, y, name, avatarType, direction, speechBubble } = player;
      const type = AVATAR_TYPES[avatarType] || AVATAR_TYPES.sakura;

      ctx.save();
      ctx.translate(x, y);

      // Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
      ctx.beginPath();
      ctx.ellipse(0, 18, 18, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Walking bounce effect
      const bounce = player.isMoving ? Math.sin(Date.now() * 0.018) * 3.5 : 0;

      // Body Slime/Chibi Shape
      ctx.fillStyle = type.bodyColor;
      ctx.beginPath();
      ctx.arc(0, bounce, 18, Math.PI * 0.85, Math.PI * 2.15);
      ctx.quadraticCurveTo(0, 20 + bounce, -18, bounce);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Expressive Face Features
      let eyeOffsetX = 0;
      if (direction === 'left') eyeOffsetX = -5;
      if (direction === 'right') eyeOffsetX = 5;

      if (direction !== 'up') {
        // Eyes
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(-5 + eyeOffsetX, -2 + bounce, 2.5, 0, Math.PI * 2);
        ctx.arc(5 + eyeOffsetX, -2 + bounce, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Eye highlights
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-6 + eyeOffsetX, -3 + bounce, 1, 0, Math.PI * 2);
        ctx.arc(4 + eyeOffsetX, -3 + bounce, 1, 0, Math.PI * 2);
        ctx.fill();

        // Cute Blush
        ctx.fillStyle = 'rgba(244, 114, 182, 0.65)';
        ctx.beginPath();
        ctx.ellipse(-8 + eyeOffsetX, 3 + bounce, 3.5, 2, 0, 0, Math.PI * 2);
        ctx.ellipse(8 + eyeOffsetX, 3 + bounce, 3.5, 2, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Accessory / Accessory Item
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(type.item, 10 + eyeOffsetX, -12 + bounce);

      // Self Highlight Ring
      if (isSelf) {
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(0, 18, 22, 10, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Name Tag
      ctx.font = 'bold 11px "Plus Jakarta Sans", sans-serif';
      const nameWidth = ctx.measureText(name).width + 14;
      ctx.fillStyle = isSelf ? '#ec4899' : 'rgba(255, 255, 255, 0.9)';
      ctx.beginPath();
      ctx.roundRect(-nameWidth / 2, 24, nameWidth, 18, 9);
      ctx.fill();
      ctx.strokeStyle = 'rgba(244, 114, 182, 0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = isSelf ? '#ffffff' : '#831843';
      ctx.fillText(name, 0, 37);

      // SPEECH BUBBLE (STABLE & NEVER TRUNCATED PREMATURELY)
      if (speechBubble && speechBubble.expiresAt > Date.now()) {
        drawSpeechBubble(speechBubble.text);
      }

      ctx.restore();
    }

    function drawSpeechBubble(text) {
      ctx.font = '600 12px "Plus Jakarta Sans", sans-serif';
      
      // Multi-line text wrapping logic for speech bubbles
      const maxLineWidth = 160;
      const words = text.split(' ');
      let lines = [];
      let currentLine = '';

      words.forEach(word => {
        const testLine = currentLine ? currentLine + ' ' + word : word;
        if (ctx.measureText(testLine).width > maxLineWidth) {
          lines.push(currentLine);
          currentLine = word;
        } else {
          currentLine = testLine;
        }
      });
      if (currentLine) lines.push(currentLine);

      const lineHeight = 16;
      const padding = 10;
      let maxMeasuredWidth = 0;
      lines.forEach(l => {
        const w = ctx.measureText(l).width;
        if (w > maxMeasuredWidth) maxMeasuredWidth = w;
      });

      const bubbleWidth = Math.max(60, maxMeasuredWidth + padding * 2);
      const bubbleHeight = lines.length * lineHeight + padding * 1.2;
      const bubbleX = -bubbleWidth / 2;
      const bubbleY = -35 - bubbleHeight;

      // Bubble Outer Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
      ctx.beginPath();
      ctx.roundRect(bubbleX + 2, bubbleY + 2, bubbleWidth, bubbleHeight, 12);
      ctx.fill();

      // Bubble Body (Glass White)
      ctx.fillStyle = 'rgba(255, 255, 255, 0.98)';
      ctx.beginPath();
      ctx.roundRect(bubbleX, bubbleY, bubbleWidth, bubbleHeight, 12);
      ctx.fill();

      ctx.strokeStyle = '#ec4899';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Bubble Pointer Tail
      ctx.fillStyle = 'rgba(255, 255, 255, 0.98)';
      ctx.beginPath();
      ctx.moveTo(-6, bubbleY + bubbleHeight - 1);
      ctx.lineTo(0, bubbleY + bubbleHeight + 7);
      ctx.lineTo(6, bubbleY + bubbleHeight - 1);
      ctx.fill();

      // Render Text Lines
      ctx.fillStyle = '#831843';
      ctx.textAlign = 'center';
      lines.forEach((line, index) => {
        ctx.fillText(line, 0, bubbleY + padding + 11 + index * lineHeight);
      });
    }

    // --- CONTROLS & SMOOTH PHYSICS MOVEMENT ---
    function updatePlayerMovement() {
      let dx = 0;
      let dy = 0;

      if (keys.up) { dy -= 1; localPlayer.direction = 'up'; }
      if (keys.down) { dy += 1; localPlayer.direction = 'down'; }
      if (keys.left) { dx -= 1; localPlayer.direction = 'left'; }
      if (keys.right) { dx += 1; localPlayer.direction = 'right'; }

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        localPlayer.x += (dx / len) * localPlayer.speed;
        localPlayer.y += (dy / len) * localPlayer.speed;

        localPlayer.targetX = localPlayer.x;
        localPlayer.targetY = localPlayer.y;
        localPlayer.isMoving = true;
      } else {
        // Smooth Click-to-Move Target Pursuit
        const distX = localPlayer.targetX - localPlayer.x;
        const distY = localPlayer.targetY - localPlayer.y;
        const distance = Math.hypot(distX, distY);

        if (distance > 4) {
          localPlayer.x += (distX / distance) * localPlayer.speed;
          localPlayer.y += (distY / distance) * localPlayer.speed;
          localPlayer.isMoving = true;

          if (Math.abs(distX) > Math.abs(distY)) {
            localPlayer.direction = distX > 0 ? 'right' : 'left';
          } else {
            localPlayer.direction = distY > 0 ? 'down' : 'up';
          }
        } else {
          localPlayer.isMoving = false;
        }
      }

      // Canvas Boundary Clamping
      localPlayer.x = Math.max(30, Math.min(canvas.width - 30, localPlayer.x));
      localPlayer.y = Math.max(40, Math.min(canvas.height - 40, localPlayer.y));

      // Broadcast Realtime Movement Stream
      if (localPlayer.isMoving && realtimeChannel) {
        broadcastState();
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Environment & Petals
      drawEnvironment();
      updateAndDrawPetals();

      // Click Target Indicator Ring
      const targetDist = Math.hypot(localPlayer.targetX - localPlayer.x, localPlayer.targetY - localPlayer.y);
      if (targetDist > 8) {
        ctx.strokeStyle = 'rgba(236, 72, 153, 0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(localPlayer.targetX, localPlayer.targetY, 10, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Draw Remote Players
      Object.values(remotePlayers).forEach(p => {
        drawAvatar(p, false);
      });

      // Update & Draw Local Player
      updatePlayerMovement();
      drawAvatar(localPlayer, true);

      requestAnimationFrame(render);
    }

    // --- REALTIME CHANNELS & PERSISTENT CHAT LOGIC ---
    async function initSupabaseChannel(channelName) {
      if (realtimeChannel) {
        supabaseClient.removeChannel(realtimeChannel);
      }

      currentChannel = channelName;
      document.getElementById('room-indicator').textContent = '#' + channelName;

      realtimeChannel = supabaseClient.channel(`room_${channelName}`, {
        config: { presence: { key: localPlayer.id } }
      });

      realtimeChannel
        .on('presence', { event: 'sync' }, () => {
          const state = realtimeChannel.presenceState();
          remotePlayers = {};
          let count = 1;

          Object.keys(state).forEach(key => {
            if (key !== localPlayer.id) {
              const presences = state[key];
              if (presences && presences.length > 0) {
                remotePlayers[key] = presences[0];
                count++;
              }
            }
          });

          document.getElementById('player-count').textContent = `${count} Online`;
        })
        .on('presence', { event: 'leave' }, ({ key }) => {
          delete remotePlayers[key];
        })
        .on('broadcast', { event: 'player-move' }, payload => {
          const p = payload.payload;
          if (p.id !== localPlayer.id) {
            remotePlayers[p.id] = { ...remotePlayers[p.id], ...p };
          }
        })
        .on('broadcast', { event: 'chat-message' }, payload => {
          const msg = payload.payload;
          
          // Save to local channel buffer
          saveChatMessageToMemory(msg.channel || currentChannel, msg);
          
          // If message is for current active room, render immediately
          if ((msg.channel || currentChannel) === currentChannel) {
            displayChatMessage(msg);
          }

          // Speech Bubble Trigger
          if (msg.playerId === localPlayer.id) {
            localPlayer.speechBubble = { text: msg.content, expiresAt: Date.now() + 6000 };
          } else if (remotePlayers[msg.playerId]) {
            remotePlayers[msg.playerId].speechBubble = { text: msg.content, expiresAt: Date.now() + 6000 };
          }
        })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await realtimeChannel.track({
              id: localPlayer.id,
              name: localPlayer.name,
              avatarType: localPlayer.avatarType,
              x: localPlayer.x,
              y: localPlayer.y,
              direction: localPlayer.direction
            });
          }
        });

      // Render Persistent Chat History for this channel
      renderChatLogForChannel(channelName);
    }

    function saveChatMessageToMemory(channel, msg) {
      if (!chatMemory[channel]) chatMemory[channel] = [];
      chatMemory[channel].push(msg);
      // Keep max 50 recent messages per channel
      if (chatMemory[channel].length > 50) chatMemory[channel].shift();
      
      // Save buffer in LocalStorage
      try {
        localStorage.setItem(`chat_${channel}`, JSON.stringify(chatMemory[channel]));
      } catch(e) {}
    }

    function renderChatLogForChannel(channel) {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';

      const messages = chatMemory[channel] || [];

      if (messages.length === 0) {
        container.innerHTML = `<div class="text-center text-xs text-pink-500 my-6 italic">Welcome to #${channel}! Send a message to start chatting 🌸</div>`;
        return;
      }

      messages.forEach(msg => {
        displayChatMessage(msg);
      });
    }

    function broadcastState() {
      if (!realtimeChannel) return;
      realtimeChannel.send({
        type: 'broadcast',
        event: 'player-move',
        payload: {
          id: localPlayer.id,
          name: localPlayer.name,
          avatarType: localPlayer.avatarType,
          x: localPlayer.x,
          y: localPlayer.y,
          direction: localPlayer.direction,
          isMoving: localPlayer.isMoving
        }
      });
    }

    // Submit Chat Message
    document.getElementById('chat-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();

      if (!text) return;
      input.value = '';

      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const msgObj = {
        playerId: localPlayer.id,
        sender: localPlayer.name,
        content: text,
        time: timeStr,
        channel: currentChannel
      };

      // Set local speech bubble
      localPlayer.speechBubble = { text: text, expiresAt: Date.now() + 6000 };

      // Save to memory and view
      saveChatMessageToMemory(currentChannel, msgObj);
      displayChatMessage(msgObj);

      // Broadcast to other players in room
      if (realtimeChannel) {
        realtimeChannel.send({
          type: 'broadcast',
          event: 'chat-message',
          payload: msgObj
        });
      }
    });

    function displayChatMessage(msg) {
      const container = document.getElementById('chat-messages');
      const isSelf = msg.sender === localPlayer.name;

      const msgDiv = document.createElement('div');
      msgDiv.className = `flex flex-col ${isSelf ? 'items-end' : 'items-start'} space-y-1 animate-in fade-in slide-in-from-bottom-2 duration-150`;

      msgDiv.innerHTML = `
        <div class="flex items-center gap-1.5 px-1">
          <span class="text-[11px] font-bold text-pink-900">${escapeHtml(msg.sender)}</span>
          <span class="text-[9px] text-pink-400">${msg.time || ''}</span>
        </div>
        <div class="px-3.5 py-2 rounded-2xl text-xs max-w-[88%] shadow-sm ${
          isSelf 
            ? 'bg-pink-500 text-white rounded-tr-none' 
            : 'bg-white/95 text-pink-950 border border-pink-100 rounded-tl-none font-medium'
        }">
          ${escapeHtml(msg.content)}
        </div>
      `;

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // --- INPUT EVENT LISTENERS ---
    window.addEventListener('keydown', e => {
      if (document.activeElement.tagName === 'INPUT') return;

      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    });

    // Click/Tap to Move
    canvas.addEventListener('pointerdown', e => {
      const rect = canvas.getBoundingClientRect();
      localPlayer.targetX = e.clientX - rect.left;
      localPlayer.targetY = e.clientY - rect.top;
    });

    // Mobile D-Pad Handlers
    function startMove(dir, ev) { 
      if (ev) ev.preventDefault();
      keys[dir] = true; 
    }
    function stopMove(dir, ev) { 
      if (ev) ev.preventDefault();
      keys[dir] = false; 
    }

    // Switch Room / Channel
    function switchChannel(channelName) {
      if (currentChannel === channelName) return;

      document.querySelectorAll('.chan-btn').forEach(btn => {
        btn.classList.remove('bg-pink-500', 'text-white', 'shadow-sm');
        btn.classList.add('text-pink-800');
      });

      const activeBtn = document.getElementById(`chan-btn-${channelName}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-pink-500', 'text-white', 'shadow-sm');
        activeBtn.classList.remove('text-pink-800');
      }

      initSupabaseChannel(channelName);
    }

    // --- AVATAR SETTINGS MODAL ---
    function renderAvatarPicker() {
      const picker = document.getElementById('avatar-picker');
      picker.innerHTML = Object.keys(AVATAR_TYPES).map(key => {
        const type = AVATAR_TYPES[key];
        const isSelected = localPlayer.avatarType === key;

        return `
          <div 
            onclick="selectAvatarType('${key}')"
            class="p-3 rounded-2xl border-2 cursor-pointer transition flex items-center gap-3 ${
              isSelected 
                ? 'border-pink-500 bg-pink-100/80 shadow-sm' 
                : 'border-pink-200/60 hover:bg-white/60'
            }"
          >
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-sm shrink-0" style="background-color: ${type.bodyColor}">
              ${type.item}
            </div>
            <span class="text-xs font-bold text-pink-900">${type.name}</span>
          </div>
        `;
      }).join('');
    }

    function selectAvatarType(key) {
      localPlayer.avatarType = key;
      renderAvatarPicker();
    }

    function toggleSettingsModal() {
      const modal = document.getElementById('settings-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        document.getElementById('setting-username').value = localPlayer.name;
        renderAvatarPicker();
      }
    }

    function saveAvatarSettings() {
      const newName = document.getElementById('setting-username').value.trim();
      if (newName) {
        localPlayer.name = newName;
        localStorage.setItem('sakura_avatar_name', localPlayer.name);
      }
      localStorage.setItem('sakura_avatar_type', localPlayer.avatarType);

      if (realtimeChannel) {
        realtimeChannel.track({
          id: localPlayer.id,
          name: localPlayer.name,
          avatarType: localPlayer.avatarType,
          x: localPlayer.x,
          y: localPlayer.y
        });
      }

      toggleSettingsModal();
    }

    function toggleChatSidebar() {
      const sidebar = document.getElementById('chat-sidebar');
      sidebar.classList.toggle('translate-x-full');
    }

    // Controls hint auto fade
    setTimeout(() => {
      const hint = document.getElementById('controls-hint');
      if (hint) hint.style.opacity = '0.35';
    }, 7000);

    // --- INITIALIZATION ---
    window.addEventListener('resize', resizeCanvas);

    window.addEventListener('load', () => {
      lucide.createIcons();
      resizeCanvas();
      initPetals();

      // Spawn player in central map area
      localPlayer.x = canvas.width / 2;
      localPlayer.y = canvas.height / 2 + 30;
      localPlayer.targetX = localPlayer.x;
      localPlayer.targetY = localPlayer.y;

      initSupabaseChannel('sakura-lounge');
      requestAnimationFrame(render);
    });
  </script>
</body>
</html>
