<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Virtual Lounge 🌸</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Yuji+Mai&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 50%, #f472b6 100%);
      min-height: 100vh;
      overflow: hidden;
    }
    .font-sakura { font-family: 'Yuji Mai', serif; }
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
    }
    /* Falling Petals */
    .petal {
      position: fixed;
      background-color: #fbcfe8;
      border-radius: 150% 0 150% 0;
      opacity: 0.7;
      pointer-events: none;
      z-index: 0;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { opacity: 0.8; top: -10%; transform: translateX(0) rotate(0deg); }
      100% { opacity: 0.2; top: 110%; transform: translateX(80px) rotate(360deg); }
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body class="flex items-center justify-center h-screen p-2 sm:p-4 relative">

  <!-- Petals background container -->
  <div id="petals-container"></div>

  <!-- Main Container -->
  <div class="glass w-full max-w-6xl h-[95vh] rounded-3xl shadow-2xl flex flex-col md:flex-row overflow-hidden z-10 relative">
    
    <!-- Sidebar: Chat & Room Info -->
    <aside class="w-full md:w-80 bg-white/50 border-b md:border-b-0 md:border-r border-pink-200/60 flex flex-col justify-between p-4 z-20">
      <div>
        <!-- Title -->
        <div class="flex items-center gap-3 pb-3 mb-3 border-b border-pink-200/60">
          <div class="bg-pink-500 text-white p-2.5 rounded-2xl shadow-md shadow-pink-300">
            <i data-lucide="flower-2" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="font-sakura text-lg text-pink-900 font-bold">Sakura Lounge</h1>
            <p class="text-[11px] text-pink-600">Virtual 2D Room</p>
          </div>
        </div>

        <!-- Rooms -->
        <h2 class="text-xs font-bold text-pink-700 uppercase tracking-wider mb-2 px-1">Rooms</h2>
        <div class="space-y-1 mb-4">
          <button onclick="switchRoom('sakura-lounge')" id="room-sakura-lounge" class="room-btn w-full flex items-center gap-2.5 px-3 py-2 rounded-xl font-semibold text-xs transition bg-pink-500 text-white shadow-sm">
            <i data-lucide="cherry" class="w-4 h-4"></i> Sakura Shrine
          </button>
          <button onclick="switchRoom('gaming-room')" id="room-gaming-room" class="room-btn w-full flex items-center gap-2.5 px-3 py-2 rounded-xl font-medium text-xs text-pink-800 hover:bg-pink-100/80 transition">
            <i data-lucide="gamepad-2" class="w-4 h-4"></i> Arcade Room
          </button>
        </div>

        <!-- Chat Feed Box -->
        <div class="flex flex-col h-48 md:h-64 bg-white/60 rounded-2xl border border-pink-200/60 p-3 overflow-hidden shadow-inner">
          <h3 class="text-xs font-bold text-pink-800 mb-2 flex items-center gap-1.5">
            <i data-lucide="message-square" class="w-3.5 h-3.5 text-pink-500"></i> Live Room Chat
          </h3>
          <div id="chat-messages" class="flex-1 overflow-y-auto space-y-2 text-xs pr-1">
            <p class="text-pink-400 italic text-center mt-6">Welcome! Say hello in the room.</p>
          </div>
        </div>
      </div>

      <!-- Controls Info & User Profile -->
      <div class="space-y-3 mt-3">
        <div class="bg-pink-100/60 p-2.5 rounded-xl border border-pink-200/50 text-[11px] text-pink-800 space-y-1">
          <p class="font-bold flex items-center gap-1"><i data-lucide="info" class="w-3 h-3"></i> Controls:</p>
          <p>• Use <b>WASD</b> or <b>Arrow Keys</b> to walk</p>
          <p>• Click anywhere on canvas to walk there</p>
        </div>

        <div class="flex items-center justify-between pt-2 border-t border-pink-200/60">
          <div class="flex items-center gap-2.5">
            <div id="my-avatar-icon" class="w-9 h-9 rounded-full bg-pink-500 text-white font-bold flex items-center justify-center text-sm shadow-sm">🌸</div>
            <div class="overflow-hidden">
              <p id="my-name-display" class="text-xs font-semibold text-pink-900 truncate">Player</p>
              <p class="text-[10px] text-emerald-600 font-medium">Online</p>
            </div>
          </div>
          <button onclick="changeName()" class="text-pink-600 hover:text-pink-800 p-1.5 rounded-lg hover:bg-pink-100 transition" title="Change Name">
            <i data-lucide="settings" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Game Canvas Area -->
    <main class="flex-1 flex flex-col h-full bg-pink-50/40 relative overflow-hidden">
      
      <!-- Top Bar -->
      <div class="px-4 py-3 border-b border-pink-200/60 flex items-center justify-between bg-white/40 z-10">
        <div class="flex items-center gap-2">
          <span id="current-room-badge" class="font-bold text-pink-900 text-sm">🌸 Sakura Shrine</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs px-2.5 py-1 bg-pink-100 text-pink-700 rounded-full font-medium border border-pink-200 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="online-count">1</span> Users Here
          </span>
        </div>
      </div>

      <!-- Canvas Viewport -->
      <div id="canvas-container" class="flex-1 relative flex items-center justify-center overflow-hidden cursor-crosshair">
        <canvas id="gameCanvas" class="shadow-lg rounded-2xl bg-gradient-to-br from-pink-100 to-rose-200 border border-pink-300/50"></canvas>
      </div>

      <!-- Chat Input Bar -->
      <footer class="p-3 bg-white/50 border-t border-pink-200/60 z-10">
        <form id="chat-form" class="flex items-center gap-2">
          <input 
            type="text" 
            id="chat-input" 
            placeholder="Type a message to chat & talk..." 
            autocomplete="off"
            maxlength="100"
            class="flex-1 px-4 py-2.5 rounded-xl text-xs bg-white/80 border border-pink-300/50 text-pink-950 placeholder-pink-400 focus:outline-none focus:ring-2 focus:ring-pink-400 shadow-inner"
          />
          <button 
            type="submit" 
            class="bg-pink-500 hover:bg-pink-600 text-white px-4 py-2.5 rounded-xl text-xs font-semibold shadow-md shadow-pink-300 transition flex items-center gap-1"
          >
            <i data-lucide="send" class="w-3.5 h-3.5"></i> Send
          </button>
        </form>
      </footer>
    </main>
  </div>

  <script>
    // Supabase Credentials
    const SUPABASE_URL = 'https://brvyjdtnxzjlrhukngjn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydnlqZHRueHpqbHJodWtuZ2puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTAwMjcsImV4cCI6MjEwODA4NjAyN30.2ib-m3ju3SEhJLaQHQdA8xinenbtN5MltOatIYZSZIE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // User State
    let myId = 'user_' + Math.random().toString(36).substr(2, 9);
    let myName = localStorage.getItem('sakura_name') || ('Visitor_' + Math.floor(100 + Math.random() * 900));
    let currentRoom = 'sakura-lounge';
    let myColor = localStorage.getItem('sakura_color') || ['#f472b6', '#ec4899', '#fb7185', '#e879f9', '#c084fc'][Math.floor(Math.random() * 5)];

    // Player position & movement
    let myX = 400, myY = 250;
    let targetX = 400, targetY = 250;
    const speed = 3.5;
    const keys = {};

    // Other players dictionary & chat bubbles
    let players = {};
    let chatBubbles = {}; // { userId: { text, timer } }

    // Supabase Realtime Channel
    let roomChannel = null;

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initUserProfile();
      initCanvasSize();
      setupCanvasEvents();
      setupKeyboardControls();
      connectRealtimeRoom();
      createPetals();
      requestAnimationFrame(gameLoop);
    });

    function initUserProfile() {
      localStorage.setItem('sakura_name', myName);
      localStorage.setItem('sakura_color', myColor);
      document.getElementById('my-name-display').textContent = myName;
      document.getElementById('my-avatar-icon').style.backgroundColor = myColor;
      document.getElementById('my-avatar-icon').textContent = myName.charAt(0).toUpperCase();
    }

    function changeName() {
      const newName = prompt('Enter your visitor name:', myName);
      if (newName && newName.trim()) {
        myName = newName.trim();
        initUserProfile();
        broadcastPosition();
      }
    }

    function initCanvasSize() {
      const canvas = document.getElementById('gameCanvas');
      canvas.width = 750;
      canvas.height = 420;
    }

    // Connect to Supabase Realtime (Broadcast + Presence - NO database required!)
    function connectRealtimeRoom() {
      if (roomChannel) {
        supabaseClient.removeChannel(roomChannel);
      }

      roomChannel = supabaseClient.channel(`room:${currentRoom}`, {
        config: { presence: { key: myId } }
      });

      // Listen for broadcasts (Movement & Chat)
      roomChannel
        .on('broadcast', { event: 'move' }, payload => {
          if (payload.payload.id !== myId) {
            players[payload.payload.id] = payload.payload;
          }
        })
        .on('broadcast', { event: 'chat' }, payload => {
          triggerChatBubble(payload.payload.id, payload.payload.text);
          appendChatLog(payload.payload.name, payload.payload.text);
        })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await roomChannel.track({
              id: myId,
              name: myName,
              x: myX,
              y: myY,
              color: myColor,
              room: currentRoom
            });
            broadcastPosition();
          }
        });

      // Track online count via Presence
      roomChannel.on('presence', { event: 'sync' }, () => {
        const state = roomChannel.presenceState();
        let total = 0;
        Object.values(state).forEach(presences => {
          total += presences.length;
        });
        document.getElementById('online-count').textContent = total;
      });
    }

    function switchRoom(roomName) {
      currentRoom = roomName;
      document.getElementById('current-room-badge').textContent = roomName === 'sakura-lounge' ? '🌸 Sakura Shrine' : '🕹️ Arcade Room';
      
      document.querySelectorAll('.room-btn').forEach(btn => {
        btn.classList.remove('bg-pink-500', 'text-white', 'shadow-sm', 'font-semibold');
        btn.classList.add('text-pink-800', 'font-medium');
      });
      document.getElementById(`room-${roomName}`).classList.add('bg-pink-500', 'text-white', 'shadow-sm', 'font-semibold');
      document.getElementById(`room-${roomName}`).classList.remove('text-pink-800', 'font-medium');

      players = {};
      document.getElementById('chat-messages').innerHTML = `<p class="text-pink-400 italic text-center mt-6">Joined #${roomName}. Say hello!</p>`;
      
      connectRealtimeRoom();
    }

    // Broadcast Position
    function broadcastPosition() {
      if (!roomChannel) return;
      roomChannel.send({
        type: 'broadcast',
        event: 'move',
        payload: { id: myId, name: myName, x: myX, y: myY, color: myColor }
      });
    }

    // Chat handling
    document.getElementById('chat-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      // Show locally immediately
      triggerChatBubble(myId, text);
      appendChatLog(myName, text);

      // Broadcast to others
      if (roomChannel) {
        roomChannel.send({
          type: 'broadcast',
          event: 'chat',
          payload: { id: myId, name: myName, text: text }
        });
      }
    });

    function triggerChatBubble(id, text) {
      chatBubbles[id] = { text: text, timer: 180 }; // displays for ~3 seconds
    }

    function appendChatLog(name, text) {
      const container = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = "bg-white/80 p-2 rounded-xl border border-pink-200/50 shadow-xs";
      div.innerHTML = `<span class="font-bold text-pink-900">${escapeHtml(name)}:</span> <span class="text-pink-950">${escapeHtml(text)}</span>`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.innerText = str;
      return d.innerHTML;
    }

    // Input & Movement setup
    function setupKeyboardControls() {
      window.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === 'INPUT') return;
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
          e.preventDefault();
        }
        keys[e.code] = true;
      });
      window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
      });
    }

    function setupCanvasEvents() {
      const canvas = document.getElementById('gameCanvas');
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        targetX = e.clientX - rect.left;
        targetY = e.clientY - rect.top;
      });
    }

    // Game Loop
    let lastBroadcast = 0;
    function gameLoop(timestamp) {
      updatePlayer();
      renderGame();

      // Throttle position broadcast
      if (timestamp - lastBroadcast > 80) {
        broadcastPosition();
        lastBroadcast = timestamp;
      }

      requestAnimationFrame(gameLoop);
    }

    function updatePlayer() {
      let dx = 0, dy = 0;
      if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        myX += (dx / len) * speed;
        myY += (dy / len) * speed;
        targetX = myX;
        targetY = myY;
      } else {
        // Move towards click target
        const distX = targetX - myX;
        const distY = targetY - myY;
        const dist = Math.hypot(distX, distY);
        if (dist > 2) {
          myX += (distX / dist) * speed;
          myY += (distY / dist) * speed;
        }
      }

      // Boundaries
      const canvas = document.getElementById('gameCanvas');
      myX = Math.max(30, Math.min(canvas.width - 30, myX));
      myY = Math.max(40, Math.min(canvas.height - 30, myY));
    }

    function renderGame() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Room Background Decorations
      drawRoomDecor(ctx, canvas);

      // Draw Other Players
      Object.values(players).forEach(p => {
        drawAvatar(ctx, p.x, p.y, p.name, p.color, false);
      });

      // Draw My Avatar
      drawAvatar(ctx, myX, myY, myName + ' (You)', myColor, true);
    }

    function drawRoomDecor(ctx, canvas) {
      if (currentRoom === 'sakura-lounge') {
        // Tatami floor grid lines
        ctx.strokeStyle = 'rgba(244, 114, 182, 0.15)';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 50) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 50) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // Shrine Tree in corner
        ctx.fillStyle = '#f472b6';
        ctx.beginPath(); ctx.arc(100, 90, 45, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#db2777';
        ctx.beginPath(); ctx.arc(80, 75, 30, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#854d0e'; // trunk
        ctx.fillRect(92, 110, 16, 60);
      } else {
        // Arcade Floor pattern
        ctx.fillStyle = 'rgba(219, 39, 119, 0.1)';
        ctx.fillRect(50, 50, 150, 100);
        ctx.fillRect(550, 250, 150, 100);
      }
    }

    function drawAvatar(ctx, x, y, name, color, isMe) {
      // Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
      ctx.beginPath();
      ctx.ellipse(x, y + 16, 14, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Avatar Body (Cute Blob / Sprite representation)
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y - 4, 18, 0, Math.PI * 2);
      ctx.fill();
      
      // Highlight rim
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Face Emoji / Eyes
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x - 5, y - 6, 3, 0, Math.PI * 2);
      ctx.arc(x + 5, y - 6, 3, 0, Math.PI * 2);
      ctx.fill();

      // Name Tag
      ctx.fillStyle = isMe ? '#831843' : '#500724';
      ctx.font = 'bold 11px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(name, x, y - 26);

      // Chat Bubble if active
      const userId = isMe ? myId : Object.keys(players).find(k => players[k].name === name.replace(' (You)', ''));
      if (userId && chatBubbles[userId] && chatBubbles[userId].timer > 0) {
        const bubble = chatBubbles[userId];
        bubble.timer--;

        ctx.font = '11px "Plus Jakarta Sans", sans-serif';
        const textWidth = ctx.measureText(bubble.text).width;
        const bWidth = Math.max(textWidth + 16, 30);
        const bHeight = 24;
        const bx = x - bWidth / 2;
        const by = y - 62;

        // Bubble background
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.strokeStyle = '#f472b6';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(bx, by, bWidth, bHeight, 8);
        ctx.fill();
        ctx.stroke();

        // Bubble text
        ctx.fillStyle = '#831843';
        ctx.textAlign = 'center';
        ctx.fillText(bubble.text, x, by + 16);
      }
    }

    // Falling Petals Animation
    function createPetals() {
      const container = document.getElementById('petals-container');
      for (let i = 0; i < 15; i++) {
        const p = document.createElement('div');
        p.className = 'petal';
        const size = Math.random() * 10 + 6;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.left = `${Math.random() * 100}vw`;
        p.style.animationDuration = `${Math.random() * 7 + 5}s`;
        p.style.animationDelay = `${Math.random() * 5}s`;
        container.appendChild(p);
      }
    }
  </script>
</body>
</html>
