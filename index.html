<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Chat Room</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #chat-container { width: 100%; max-width: 500px; height: 90vh; background: #1e1e1e; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
    #header { padding: 15px; background: #292929; border-bottom: 1px solid #333; text-align: center; font-weight: bold; }
    #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 8px; background: #2a2a2a; word-wrap: break-word; }
    .message .username { font-size: 0.75rem; color: #3ecf8e; margin-bottom: 4px; font-weight: bold; }
    .message .text { font-size: 0.95rem; }
    #form { display: flex; padding: 10px; background: #292929; border-top: 1px solid #333; gap: 8px; }
    #username-input { width: 30%; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #121212; color: #fff; }
    #message-input { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #121212; color: #fff; }
    button { padding: 10px 16px; border: none; border-radius: 4px; background: #3ecf8e; color: #000; font-weight: bold; cursor: pointer; }
    button:hover { background: #34b27b; }
  </style>
</head>
<body>

  <div id="chat-container">
    <div id="header">Supabase Chat Room</div>
    <div id="messages"></div>
    <form id="form">
      <input type="text" id="username-input" placeholder="Name" required>
      <input type="text" id="message-input" placeholder="Type a message..." required autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://brvyjdtnxzjlrhukngjn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydnlqZHRueHpqbHJodWtuZ2puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTAwMjcsImV4cCI6MjEwODA4NjAyN30.2ib-m3ju3SEhJLaQHQdA8xinenbtN5MltOatIYZSZIE';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const messagesDiv = document.getElementById('messages');
    const form = document.getElementById('form');
    const usernameInput = document.getElementById('username-input');
    const messageInput = document.getElementById('message-input');

    if (localStorage.getItem('chat_username')) {
      usernameInput.value = localStorage.getItem('chat_username');
    }

    function appendMessage(msg) {
      const msgElement = document.createElement('div');
      msgElement.className = 'message';
      
      const userElement = document.createElement('div');
      userElement.className = 'username';
      userElement.textContent = msg.username || 'Anonymous';
      
      const textElement = document.createElement('div');
      textElement.className = 'text';
      textElement.textContent = msg.content || msg.message;

      msgElement.appendChild(userElement);
      msgElement.appendChild(textElement);
      messagesDiv.appendChild(msgElement);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function loadMessages() {
      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true });

      if (error) {
        console.error('Error fetching messages:', error);
      } else if (data) {
        messagesDiv.innerHTML = '';
        data.forEach(appendMessage);
      }
    }

    function subscribeToMessages() {
      supabaseClient
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          appendMessage(payload.new);
        })
        .subscribe();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = usernameInput.value.trim();
      const content = messageInput.value.trim();

      if (!content || !username) return;

      localStorage.setItem('chat_username', username);
      messageInput.value = '';

      const { error } = await supabaseClient
        .from('messages')
        .insert([{ username, content }]);

      if (error) {
        console.error('Error sending message:', error);
      }
    });

    loadMessages();
    subscribeToMessages();
  </script>
</body>
</html>
