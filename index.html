<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Chat Room</title>
  <!-- Supabase JS Client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts for Sakura Theme -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fff0f5 0%, #ffd1dc 50%, #fbe7ef 100%);
      --sakura-pink: #ffb7c5;
      --sakura-dark-pink: #e07a93;
      --sakura-deep: #b34d63;
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.8);
      --text-main: #4a2e35;
      --text-muted: #8c6870;
      --shadow-soft: 0 8px 32px 0 rgba(224, 122, 147, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Falling Petals Background Animation */
    .petal {
      position: absolute;
      background: linear-gradient(135deg, #ffc0cb, #ffe4e1);
      border-radius: 150% 0 150% 0;
      opacity: 0.7;
      pointer-events: none;
      z-index: 0;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10vh) rotate(0deg) scale(0.8);
        opacity: 0.8;
      }
      100% {
        transform: translateY(105vh) rotate(360deg) scale(1.2);
        opacity: 0.2;
      }
    }

    /* Main Container */
    .app-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 1100px;
      height: 85vh;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: var(--shadow-soft);
      display: flex;
      overflow: hidden;
    }

    /* Sidebar - Channels */
    .sidebar {
      width: 280px;
      background: rgba(255, 240, 245, 0.5);
      border-right: 1px solid rgba(224, 122, 147, 0.2);
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(224, 122, 147, 0.2);
    }

    .brand h1 {
      font-family: 'Marcellus', serif;
      font-size: 1.4rem;
      color: var(--sakura-deep);
    }

    .channel-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-grow: 1;
    }

    .channel-item {
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .channel-item:hover {
      background: rgba(255, 183, 197, 0.3);
      color: var(--sakura-deep);
    }

    .channel-item.active {
      background: var(--sakura-dark-pink);
      color: white;
      box-shadow: 0 4px 12px rgba(224, 122, 147, 0.3);
    }

    .user-profile {
      padding-top: 15px;
      border-top: 1px solid rgba(224, 122, 147, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-name {
      font-weight: 600;
      color: var(--sakura-deep);
      font-size: 0.95rem;
    }

    /* Main Chat Window */
    .chat-area {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.3);
    }

    .chat-header {
      padding: 20px 30px;
      border-bottom: 1px solid rgba(224, 122, 147, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header h2 {
      font-family: 'Marcellus', serif;
      color: var(--sakura-deep);
      font-size: 1.3rem;
    }

    .messages-container {
      flex-grow: 1;
      padding: 25px 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 70%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.own {
      align-self: flex-end;
    }

    .message.other {
      align-self: flex-start;
    }

    .message-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      gap: 8px;
    }

    .message.own .message-meta {
      justify-content: flex-end;
    }

    .message-bubble {
      padding: 12px 18px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.own .message-bubble {
      background: var(--sakura-dark-pink);
      color: white;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(224, 122, 147, 0.2);
    }

    .message.other .message-bubble {
      background: white;
      color: var(--text-main);
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    /* Input Area */
    .input-area {
      padding: 20px 30px;
      border-top: 1px solid rgba(224, 122, 147, 0.15);
      display: flex;
      gap: 12px;
    }

    .message-input {
      flex-grow: 1;
      padding: 14px 20px;
      border-radius: 30px;
      border: 1px solid rgba(224, 122, 147, 0.3);
      outline: none;
      background: rgba(255, 255, 255, 0.8);
      font-size: 0.95rem;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .message-input:focus {
      border-color: var(--sakura-dark-pink);
      background: white;
      box-shadow: 0 0 0 3px rgba(224, 122, 147, 0.2);
    }

    .send-btn {
      background: var(--sakura-dark-pink);
      color: white;
      border: none;
      padding: 0 24px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .send-btn:hover {
      background: var(--sakura-deep);
    }

    /* Modal for Username */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(74, 46, 53, 0.4);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal {
      background: white;
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: var(--shadow-soft);
    }

    .modal h3 {
      font-family: 'Marcellus', serif;
      color: var(--sakura-deep);
      margin-bottom: 10px;
    }

    .modal p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .modal input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(224, 122, 147, 0.4);
      margin-bottom: 15px;
      outline: none;
    }

    .modal button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: var(--sakura-dark-pink);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Petal Background Generator Script -->
  <div id="petals-container"></div>

  <!-- Nickname Prompt Modal -->
  <div class="modal-overlay" id="nickname-modal">
    <div class="modal">
      <h3>Welcome to Sakura Chat</h3>
      <p>Enter a display name to join the conversation.</p>
      <input type="text" id="username-input" placeholder="Your username..." maxlength="20">
      <button id="join-btn">Join Chat</button>
    </div>
  </div>

  <!-- Chat Application Interface -->
  <div class="app-container">
    <aside class="sidebar">
      <div class="brand">
        <span>🌸</span>
        <h1>Sakura Lounge</h1>
      </div>
      <ul class="channel-list">
        <li class="channel-item active" data-channel="general"># general</li>
        <li class="channel-item" data-channel="lounge"># lounge</li>
        <li class="channel-item" data-channel="gaming"># gaming</li>
        <li class="channel-item" data-channel="sakura-viewing"># sakura-viewing</li>
      </ul>
      <div class="user-profile">
        <span class="user-name" id="current-user-display">Guest</span>
      </div>
    </aside>

    <main class="chat-area">
      <header class="chat-header">
        <h2 id="current-channel-title"># general</h2>
      </header>
      <div class="messages-container" id="messages-container"></div>
      <form class="input-area" id="chat-form">
        <input type="text" class="message-input" id="message-input" placeholder="Send a message..." autocomplete="off">
        <button type="submit" class="send-btn">Send</button>
      </form>
    </main>
  </div>

  <script>
    // ==========================================
    // 1. SUPABASE CONFIGURATION
    // Replace with your Supabase credentials before building/deploying
    // ==========================================
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // App State
    let username = localStorage.getItem('sakura_chat_username') || '';
    let currentChannel = 'general';
    let activeSubscription = null;

    // DOM Elements
    const modal = document.getElementById('nickname-modal');
    const usernameInput = document.getElementById('username-input');
    const joinBtn = document.getElementById('join-btn');
    const userDisplay = document.getElementById('current-user-display');
    const channelItems = document.querySelectorAll('.channel-item');
    const channelTitle = document.getElementById('current-channel-title');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const messagesContainer = document.getElementById('messages-container');

    // ==========================================
    // 2. INITIALIZATION & AUTH HANDLER
    // ==========================================
    function init() {
      if (!username) {
        modal.style.display = 'flex';
      } else {
        modal.style.display = 'none';
        userDisplay.textContent = username;
        loadChannel(currentChannel);
      }
      createPetals();
    }

    joinBtn.addEventListener('click', () => {
      const input = usernameInput.value.trim();
      if (input) {
        username = input;
        localStorage.setItem('sakura_chat_username', username);
        userDisplay.textContent = username;
        modal.style.display = 'none';
        loadChannel(currentChannel);
      }
    });

    // ==========================================
    // 3. CHANNEL & MESSAGES HANDLING
    // ==========================================
    channelItems.forEach(item => {
      item.addEventListener('click', () => {
        channelItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        currentChannel = item.dataset.channel;
        channelTitle.textContent = `# ${currentChannel}`;
        loadChannel(currentChannel);
      });
    });

    async function loadChannel(channel) {
      messagesContainer.innerHTML = '';

      // Unsubscribe from existing realtime subscription if any
      if (activeSubscription) {
        supabase.removeChannel(activeSubscription);
      }

      // Fetch message history
      const { data, error } = await supabase
        .from('messages')
        .select('*')
        .eq('channel', channel)
        .order('created_at', { ascending: true })
        .limit(100);

      if (error) {
        console.error('Error fetching messages:', error);
      } else if (data) {
        data.forEach(msg => appendMessage(msg));
        scrollToBottom();
      }

      // Subscribe to live inserts on current channel
      activeSubscription = supabase
        .channel(`public:messages:channel=eq.${channel}`)
        .on('postgres_changes', { 
          event: 'INSERT', 
          schema: 'public', 
          table: 'messages',
          filter: `channel=eq.${channel}`
        }, payload => {
          appendMessage(payload.new);
          scrollToBottom();
        })
        .subscribe();
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = messageInput.value.trim();
      if (!content) return;

      messageInput.value = '';

      const { error } = await supabase
        .from('messages')
        .insert([
          { 
            username: username, 
            content: content, 
            channel: currentChannel 
          }
        ]);

      if (error) {
        console.error('Error sending message:', error);
      }
    });

    function appendMessage(msg) {
      const isOwn = msg.username === username;
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isOwn ? 'own' : 'other'}`;

      const timeString = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      messageDiv.innerHTML = `
        <div class="message-meta">
          <span>${msg.username}</span>
          <span>${timeString}</span>
        </div>
        <div class="message-bubble">${escapeHtml(msg.content)}</div>
      `;

      messagesContainer.appendChild(messageDiv);
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ==========================================
    // 4. SAKURA PETALS BACKGROUND EFFECT
    // ==========================================
    function createPetals() {
      const container = document.getElementById('petals-container');
      const petalCount = 20;

      for (let i = 0; i < petalCount; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        
        const size = Math.random() * 10 + 10;
        petal.style.width = `${size}px`;
        petal.style.height = `${size}px`;
        petal.style.left = `${Math.random() * 100}vw`;
        petal.style.animationDuration = `${Math.random() * 5 + 5}s`;
        petal.style.animationDelay = `${Math.random() * 5}s`;

        container.appendChild(petal);
      }
    }

    init();
  </script>
</body>
</html>
