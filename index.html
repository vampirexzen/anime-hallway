<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anime Bonfire Sanctuary - 2.5D Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Press Start 2P -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #030307;
            color: #e2e8f0;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: #6366f1;
            border-radius: 3px;
        }
        .pixel-btn {
            background: #4f46e5;
            box-shadow: inset -2px -2px 0px 0px #312e81, inset 2px 2px 0px 0px #818cf8;
            transition: all 0.1s ease;
        }
        .pixel-btn:active {
            box-shadow: inset 2px 2px 0px 0px #312e81, inset -2px -2px 0px 0px #818cf8;
            transform: translateY(2px);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between relative bg-slate-950">

    <!-- CANVAS GAME CONTAINER -->
    <div id="canvasContainer" class="absolute inset-0 z-0 flex items-center justify-center bg-black">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- TOP HUD BAR -->
    <div class="relative z-10 p-3 flex justify-between items-center bg-slate-950/90 backdrop-blur-md border-b-2 border-indigo-950 text-xs shadow-2xl">
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 bg-slate-900/90 px-3 py-1.5 rounded-md border border-indigo-900/60 shadow">
                <i class="fa-solid fa-user text-indigo-400"></i>
                <span id="playerTag" class="text-indigo-300 font-bold">AnimeWalker</span>
            </div>
            <div class="flex items-center gap-2 bg-slate-900/90 px-3 py-1.5 rounded-md border border-indigo-900/60 shadow">
                <i class="fa-solid fa-location-dot text-amber-400"></i>
                <span id="locationTag" class="text-amber-200">Courtyard Hub</span>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button id="btnMusicToggle" class="pixel-btn px-3 py-2 rounded text-white flex items-center gap-2 bg-amber-600 shadow">
                <i id="musicIcon" class="fa-solid fa-music"></i>
                <span class="hidden md:inline">Music</span>
            </button>
            <button id="btnCustomizer" class="pixel-btn px-3 py-2 rounded text-white flex items-center gap-2 bg-indigo-600 shadow">
                <i class="fa-solid fa-gear"></i>
                <span class="hidden md:inline">Settings</span>
            </button>
            <button id="btnLogout" class="pixel-btn px-3 py-2 rounded text-white flex items-center gap-2 bg-slate-800 hidden shadow">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </div>

    <!-- PERSISTENT DATABASE CHAT OVERLAY -->
    <div class="relative z-10 p-2 md:p-4 pointer-events-none flex justify-between items-end mb-16 md:mb-0">
        <div class="pointer-events-auto w-80 max-w-[85vw] bg-slate-950/90 border-2 border-indigo-900/70 rounded-lg p-3 flex flex-col h-48 backdrop-blur-md shadow-2xl">
            <div class="text-[10px] text-indigo-400 mb-2 border-b border-indigo-900/50 pb-1 flex justify-between items-center">
                <span><i class="fa-solid fa-comments"></i> Cloud Chat Sanctuary</span>
                <span id="peerCount" class="text-slate-400">Online: 1</span>
            </div>
            <div id="chatMessages" class="flex-1 overflow-y-auto space-y-2 pr-1 text-[10px] leading-relaxed">
                <div class="text-emerald-400"><i class="fa-solid fa-circle-info"></i> Welcome! Walk into doors to explore 2.5D rooms and sit by fires.</div>
            </div>
            <form id="chatForm" class="mt-2 flex gap-1">
                <input id="chatInput" type="text" maxlength="60" placeholder="Type a message..." class="flex-1 bg-slate-900 border border-indigo-900/50 rounded px-2 py-1 text-[10px] text-slate-200 focus:outline-none focus:border-indigo-500 shadow-inner">
                <button type="submit" class="pixel-btn bg-indigo-600 text-white px-2 py-1 rounded text-[10px]"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <!-- TOUCH CONTROLS FOR MOBILE -->
    <div id="mobileControls" class="relative z-20 p-4 flex justify-between items-center pointer-events-none mb-2">
        <div class="pointer-events-auto grid grid-cols-3 gap-1 w-32 h-32">
            <div></div>
            <button id="btnUp" class="w-10 h-10 bg-slate-900/90 active:bg-indigo-600 border border-indigo-900 rounded flex items-center justify-center text-white text-sm shadow"><i class="fa-solid fa-chevron-up"></i></button>
            <div></div>
            <button id="btnLeft" class="w-10 h-10 bg-slate-900/90 active:bg-indigo-600 border border-indigo-900 rounded flex items-center justify-center text-white text-sm shadow"><i class="fa-solid fa-chevron-left"></i></button>
            <button id="btnDown" class="w-10 h-10 bg-slate-900/90 active:bg-indigo-600 border border-indigo-900 rounded flex items-center justify-center text-white text-sm shadow"><i class="fa-solid fa-chevron-down"></i></button>
            <button id="btnRight" class="w-10 h-10 bg-slate-900/90 active:bg-indigo-600 border border-indigo-900 rounded flex items-center justify-center text-white text-sm shadow"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="pointer-events-auto flex flex-col gap-2">
            <button id="btnSit" class="w-14 h-14 bg-emerald-700/90 active:bg-emerald-600 border-2 border-emerald-400 rounded-full flex flex-col items-center justify-center text-white font-bold text-xs shadow-xl">
                <i class="fa-solid fa-chair text-sm"></i>
                <span class="text-[7px] mt-0.5">SIT</span>
            </button>
            <button id="btnInteract" class="w-16 h-16 bg-amber-600/90 active:bg-amber-500 border-2 border-amber-300 rounded-full flex flex-col items-center justify-center text-white font-bold text-xs shadow-xl">
                <i class="fa-solid fa-door-open text-lg"></i>
                <span class="text-[8px] mt-0.5">DOOR</span>
            </button>
        </div>
    </div>

    <!-- AUTHENTICATION MODAL -->
    <div id="modalAuth" class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-950 border-2 border-indigo-500/80 rounded-xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
            <h2 class="text-sm text-indigo-400 font-bold"><i class="fa-solid fa-shield-halved"></i> Sanctuary Login</h2>
            <p class="text-[9px] text-slate-400">Sign in with your email & password to access cloud chat and permanent avatars.</p>
            
            <form id="authForm" class="space-y-3 text-xs text-left">
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Email:</label>
                    <input id="authEmail" type="email" required placeholder="user@domain.com" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-slate-200 text-xs shadow-inner">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Password:</label>
                    <input id="authPassword" type="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-slate-200 text-xs shadow-inner">
                </div>
                <div id="displayNameGroup" class="hidden">
                    <label class="block text-[10px] text-slate-400 mb-1">Display Name:</label>
                    <input id="authDisplayName" type="text" maxlength="12" placeholder="AnimeWalker" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-indigo-300 text-xs shadow-inner">
                </div>

                <div id="authError" class="text-[9px] text-rose-400 text-center h-4"></div>

                <button type="submit" id="btnAuthSubmit" class="pixel-btn w-full py-2.5 rounded text-white bg-indigo-600 text-xs font-bold shadow-lg">
                    Login
                </button>
            </form>

            <div class="text-[9px] text-slate-400 pt-2 border-t border-slate-900">
                <span id="authSwitchText">Don't have an account?</span> 
                <button id="btnSwitchAuthMode" class="text-indigo-400 underline font-bold ml-1">Sign Up</button>
            </div>
        </div>
    </div>

    <!-- SETTINGS & CUSTOMIZER MODAL -->
    <div id="modalCustomizer" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center hidden p-4 backdrop-blur-sm">
        <div class="bg-slate-950 border-2 border-indigo-500 rounded-xl p-5 max-w-sm w-full text-center space-y-4 shadow-2xl">
            <h2 class="text-sm text-indigo-400 font-bold"><i class="fa-solid fa-gear"></i> Avatar & Settings</h2>
            
            <div class="space-y-3 text-xs text-left">
                <div>
                    <label class="block text-slate-400 mb-1">Display Name:</label>
                    <input id="inputPlayerName" type="text" maxlength="12" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-indigo-300 text-xs shadow-inner">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Hair Color:</label>
                    <input id="colorHair" type="color" value="#fbbf24" class="w-full h-8 bg-transparent cursor-pointer rounded border border-slate-700">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Outfit Color:</label>
                    <input id="colorOutfit" type="color" value="#4f46e5" class="w-full h-8 bg-transparent cursor-pointer rounded border border-slate-700">
                </div>
            </div>

            <button id="btnCloseCustomizer" class="pixel-btn w-full py-2 rounded text-white bg-indigo-600 text-xs shadow-lg">
                Save & Close
            </button>
        </div>
    </div>

    <!-- 2.5D ENGINE & DATABASE CHAT SCRIPT -->
    <script>
        // --- SUPABASE CONFIGURATION ---
        const SUPABASE_URL = 'https://brvyjdtnxzjlrhukngjn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydnlqZHRueHpqbHJodWtuZ2puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTAwMjcsImV4cCI6MjEwODA4NjAyN30.2ib-m3ju3SEhJLaQHQdA8xinenbtN5MltOatIYZSZIE';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- 2.5D GAME ENGINE CONSTANTS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        const VIRTUAL_WIDTH = 400;
        const VIRTUAL_HEIGHT = 225;
        let scale = 1;

        const PLAYER_SPEED = 1.8;

        let currentUser = null;
        let localPlayer = {
            id: 'p_' + Math.random().toString(36).substr(2, 9),
            name: 'AnimeWalker',
            email: '',
            x: 200,
            y: 160,
            vx: 0,
            vy: 0,
            facing: 'down', // 'up', 'down', 'left', 'right'
            state: 'idle', // 'idle', 'walk', 'sit'
            hairColor: '#fbbf24',
            outfitColor: '#4f46e5',
            currentArea: 'courtyard', // 'courtyard', 'sanctuary_1', 'sanctuary_2'
            frame: 0,
            animTimer: 0
        };

        let remotePlayers = new Map();
        let particles = [];
        const keys = { up: false, down: false, left: false, right: false };

        function resizeCanvas() {
            const scaleX = window.innerWidth / VIRTUAL_WIDTH;
            const scaleY = window.innerHeight / VIRTUAL_HEIGHT;
            scale = Math.min(scaleX, scaleY);
            canvas.width = VIRTUAL_WIDTH * scale;
            canvas.height = VIRTUAL_HEIGHT * scale;
            ctx.imageSmoothingEnabled = false;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- AUTHENTICATION & SESSIONS ---
        let isSignUpMode = false;
        const modalAuth = document.getElementById('modalAuth');
        const authForm = document.getElementById('authForm');
        const authEmail = document.getElementById('authEmail');
        const authPassword = document.getElementById('authPassword');
        const authDisplayName = document.getElementById('authDisplayName');
        const displayNameGroup = document.getElementById('displayNameGroup');
        const btnAuthSubmit = document.getElementById('btnAuthSubmit');
        const btnSwitchAuthMode = document.getElementById('btnSwitchAuthMode');
        const authSwitchText = document.getElementById('authSwitchText');
        const authError = document.getElementById('authError');
        const btnLogout = document.getElementById('btnLogout');

        btnSwitchAuthMode.addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            if (isSignUpMode) {
                btnAuthSubmit.innerText = "Sign Up";
                authSwitchText.innerText = "Already have an account?";
                btnSwitchAuthMode.innerText = "Login";
                displayNameGroup.classList.remove('hidden');
                authDisplayName.required = true;
            } else {
                btnAuthSubmit.innerText = "Login";
                authSwitchText.innerText = "Don't have an account?";
                btnSwitchAuthMode.innerText = "Sign Up";
                displayNameGroup.classList.add('hidden');
                authDisplayName.required = false;
            }
            authError.innerText = "";
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.innerText = "Connecting...";
            const email = authEmail.value.trim();
            const password = authPassword.value.trim();

            if (isSignUpMode) {
                const name = authDisplayName.value.trim() || 'AnimeWalker';
                const { data, error } = await supabaseClient.auth.signUp({
                    email,
                    password,
                    options: { 
                        data: { 
                            display_name: name,
                            hair_color: '#fbbf24',
                            outfit_color: '#4f46e5'
                        } 
                    }
                });
                if (error) {
                    authError.innerText = error.message;
                } else {
                    alert("Account registered! You are now logged in.");
                    initSession(data.user);
                }
            } else {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    authError.innerText = error.message;
                } else {
                    initSession(data.user);
                }
            }
        });

        async function initSession(user) {
            currentUser = user;
            modalAuth.classList.add('hidden');
            btnLogout.classList.remove('hidden');

            const metadata = user.user_metadata || {};
            localPlayer.id = user.id;
            localPlayer.email = user.email;
            localPlayer.name = metadata.display_name || user.email.split('@')[0];
            localPlayer.hairColor = metadata.hair_color || '#fbbf24';
            localPlayer.outfitColor = metadata.outfit_color || '#4f46e5';
            
            document.getElementById('playerTag').innerText = localPlayer.name;
            document.getElementById('inputPlayerName').value = localPlayer.name;
            document.getElementById('colorHair').value = localPlayer.hairColor;
            document.getElementById('colorOutfit').value = localPlayer.outfitColor;

            initMultiplayerSync();
            loadCloudChatHistory();
        }

        btnLogout.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            location.reload();
        });

        window.addEventListener('load', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.user) {
                initSession(session.user);
            } else {
                modalAuth.classList.remove('hidden');
            }
            gameLoop();
        });

        // --- BULLETPROOF DATABASE CHAT & REALTIME SYNC ---
        const gameChannel = supabaseClient.channel('sanctuary_room_sync');

        function initMultiplayerSync() {
            // Presence & Position Sync
            gameChannel
                .on('broadcast', { event: 'player_state' }, ({ payload }) => {
                    if (payload && payload.id && payload.id !== localPlayer.id) {
                        remotePlayers.set(payload.id, payload);
                        updatePeerCountUI();
                    }
                })
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        console.log('2.5D Multiplayer Sync Online.');
                    }
                });

            // Permanent Database Chat Realtime Subscription
            supabaseClient
                .channel('db_messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    const msg = payload.new;
                    if (msg && msg.author && msg.text) {
                        appendChatDOM(msg.author, msg.text);
                    }
                })
                .subscribe();
        }

        async function loadCloudChatHistory() {
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(15);

            if (!error && data) {
                data.reverse().forEach(m => appendChatDOM(m.author, m.text));
            }
        }

        function broadcastPlayerState() {
            if (!currentUser) return;
            gameChannel.send({
                type: 'broadcast',
                event: 'player_state',
                payload: localPlayer
            });
        }

        function updatePeerCountUI() {
            document.getElementById('peerCount').innerText = `Online: ${remotePlayers.size + 1}`;
        }

        // --- AMBIENT WEB AUDIO MUSIC ---
        let audioCtx = null;
        let isMusicPlaying = false;
        let musicInterval = null;

        function toggleBackgroundMusic() {
            const btnMusic = document.getElementById('btnMusicToggle');
            const musicIcon = document.getElementById('musicIcon');

            if (!isMusicPlaying) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                isMusicPlaying = true;
                btnMusic.classList.remove('bg-amber-600');
                btnMusic.classList.add('bg-emerald-600');
                musicIcon.className = 'fa-solid fa-volume-high';

                const chord = [196.00, 246.94, 293.66, 349.23]; // Relaxing G major atmosphere
                musicInterval = setInterval(() => {
                    if (!isMusicPlaying || !audioCtx) return;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'triangle';
                    const freq = chord[Math.floor(Math.random() * chord.length)];
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.012, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 5.0);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 5.0);
                }, 2000);

            } else {
                isMusicPlaying = false;
                if (musicInterval) clearInterval(musicInterval);
                if (audioCtx) audioCtx.close();
                
                btnMusic.classList.remove('bg-emerald-600');
                btnMusic.classList.add('bg-amber-600');
                musicIcon.className = 'fa-solid fa-music';
            }
        }
        document.getElementById('btnMusicToggle').addEventListener('click', toggleBackgroundMusic);

        // --- 2.5D PIXEL ART & DEPTH RENDERING ENGINE ---
        const PixelArt = {
            drawCharacter(ctx, p) {
                ctx.save();
                ctx.translate(Math.round(p.x), Math.round(p.y));

                const isSitting = p.state === 'sit';
                const bobbing = p.state === 'walk' ? Math.sin(p.frame * 0.6) * 1.5 : 0;

                // Soft Floor Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.beginPath();
                ctx.ellipse(0, 2, 9, 3.5, 0, 0, Math.PI * 2);
                ctx.fill();

                if (isSitting) {
                    // Sitting Sprite
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(-4, -2, 3, 3);
                    ctx.fillStyle = p.outfitColor || '#4f46e5';
                    ctx.fillRect(-5, -10, 10, 7);
                    ctx.fillStyle = '#ffedd5';
                    ctx.fillRect(-5, -18, 10, 8);
                    ctx.fillStyle = p.hairColor || '#fbbf24';
                    ctx.fillRect(-6, -21, 12, 5);
                } else {
                    // Standing / Walking Sprite
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(-3, -2, 2, 4);
                    ctx.fillRect(1, -2, 2, 4);

                    // Outfit
                    ctx.fillStyle = p.outfitColor || '#4f46e5';
                    ctx.fillRect(-5, -13 + bobbing, 10, 9);

                    // Head & Anime Hair
                    ctx.fillStyle = '#ffedd5';
                    ctx.fillRect(-4, -21 + bobbing, 8, 8);

                    ctx.fillStyle = p.hairColor || '#fbbf24';
                    ctx.fillRect(-5, -23 + bobbing, 10, 5);
                    if (p.facing === 'left') {
                        ctx.fillRect(-6, -20 + bobbing, 3, 6);
                    } else {
                        ctx.fillRect(3, -20 + bobbing, 3, 6);
                    }
                }

                ctx.restore();

                // Name Tag & Area Tag
                ctx.save();
                ctx.font = '5px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillStyle = p.id === localPlayer.id ? '#34d399' : '#93c5fd';
                ctx.fillText(p.name, Math.round(p.x), Math.round(p.y - (isSitting ? 22 : 28)));
                ctx.restore();
            },

            drawCourtyard(ctx) {
                // Stone Courtyard Floor
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

                ctx.fillStyle = '#111827';
                for (let x = 0; x < VIRTUAL_WIDTH; x += 40) {
                    for (let y = 0; y < VIRTUAL_HEIGHT; y += 40) {
                        ctx.fillRect(x + 2, y + 2, 36, 36);
                    }
                }

                // Central Fountain / Monument
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(VIRTUAL_WIDTH / 2 - 30, 40, 60, 40);
                ctx.fillStyle = '#3b82f6';
                ctx.fillRect(VIRTUAL_WIDTH / 2 - 20, 48, 40, 24);

                // Sanctuary Doors (Top Wall)
                PixelArt.drawDoor(ctx, 120, 35, 'Room 1');
                PixelArt.drawDoor(ctx, 280, 35, 'Room 2');
            },

            drawSanctuaryRoom(ctx, roomName) {
                // Cozy Wooden Room Floor
                ctx.fillStyle = '#170f0c';
                ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

                ctx.fillStyle = '#291307';
                for (let x = 0; x < VIRTUAL_WIDTH; x += 32) {
                    ctx.fillRect(x + 1, 30, 30, VIRTUAL_HEIGHT - 30);
                }

                // Stone Walls
                ctx.fillStyle = '#0c0a09';
                ctx.fillRect(0, 0, VIRTUAL_WIDTH, 35);

                // Exit Door at Bottom
                PixelArt.drawDoor(ctx, VIRTUAL_WIDTH / 2, VIRTUAL_HEIGHT - 10, 'Exit');

                // Bonfire & Log Benches in Center
                const centerX = VIRTUAL_WIDTH / 2;
                const centerY = VIRTUAL_HEIGHT / 2 + 10;

                // Benches
                ctx.fillStyle = '#78350f';
                ctx.fillRect(centerX - 50, centerY - 25, 36, 12);
                ctx.fillRect(centerX + 14, centerY - 25, 36, 12);

                // Animated Bonfire Flames
                const frame = Math.floor(Date.now() / 100);
                ctx.fillStyle = '#451a03';
                ctx.fillRect(centerX - 12, centerY - 6, 24, 8);

                const fireColors = ['#f59e0b', '#ef4444', '#facc15', '#ffffff'];
                for (let i = 0; i < 6; i++) {
                    const color = fireColors[(i + frame) % fireColors.length];
                    const fx = centerX + (Math.sin(frame * 0.2 + i) * 5);
                    const fy = centerY - 10 - (i * 4);
                    const size = Math.max(2, 8 - i);
                    ctx.fillStyle = color;
                    ctx.fillRect(fx - size / 2, fy, size, size);
                }

                // Ambient Radial Lighting
                const grad = ctx.createRadialGradient(centerX, centerY - 10, 5, centerX, centerY - 10, 110);
                grad.addColorStop(0, 'rgba(245, 158, 11, 0.35)');
                grad.addColorStop(0.7, 'rgba(239, 68, 68, 0.1)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(centerX, centerY - 10, 110, 0, Math.PI * 2);
                ctx.fill();
            },

            drawDoor(ctx, x, y, label) {
                ctx.save();
                ctx.translate(Math.round(x), Math.round(y));
                ctx.fillStyle = '#451a03';
                ctx.fillRect(-14, -28, 28, 28);
                ctx.fillStyle = '#78350f';
                ctx.fillRect(-11, -25, 22, 25);
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(6, -12, 2, 2);

                ctx.fillStyle = '#0f172a';
                ctx.fillRect(-18, -36, 36, 8);
                ctx.fillStyle = '#f59e0b';
                ctx.font = '4px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText(label, 0, -30);
                ctx.restore();
            }
        };

        // --- PARTICLE SYSTEM ---
        function spawnParticle(x, y, color, vx, vy, life) {
            particles.push({ x, y, color, vx, vy, life, maxLife: life });
        }

        function updateAndDrawParticles(ctx) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
                ctx.fillRect(Math.round(p.x), Math.round(p.y), 1.5, 1.5);
                ctx.globalAlpha = 1.0;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // --- 2.5D MOVEMENT & GAME LOOP ---
        function updateGame() {
            if (localPlayer.state !== 'sit') {
                localPlayer.vx = 0;
                localPlayer.vy = 0;

                if (keys.left) { localPlayer.vx = -PLAYER_SPEED; localPlayer.facing = 'left'; }
                if (keys.right) { localPlayer.vx = PLAYER_SPEED; localPlayer.facing = 'right'; }
                if (keys.up) { localPlayer.vy = -PLAYER_SPEED; localPlayer.facing = 'up'; }
                if (keys.down) { localPlayer.vy = PLAYER_SPEED; localPlayer.facing = 'down'; }

                localPlayer.x += localPlayer.vx;
                localPlayer.y += localPlayer.vy;

                // Boundaries
                if (localPlayer.currentArea === 'courtyard') {
                    localPlayer.x = Math.max(20, Math.min(VIRTUAL_WIDTH - 20, localPlayer.x));
                    localPlayer.y = Math.max(45, Math.min(VIRTUAL_HEIGHT - 20, localPlayer.y));
                } else {
                    localPlayer.x = Math.max(25, Math.min(VIRTUAL_WIDTH - 25, localPlayer.x));
                    localPlayer.y = Math.max(40, Math.min(VIRTUAL_HEIGHT - 20, localPlayer.y));
                }

                if (localPlayer.vx !== 0 || localPlayer.vy !== 0) {
                    localPlayer.state = 'walk';
                    localPlayer.animTimer++;
                    if (localPlayer.animTimer % 8 === 0) {
                        localPlayer.frame++;
                        spawnParticle(localPlayer.x, localPlayer.y + 4, 'rgba(148, 163, 184, 0.4)', (Math.random() - 0.5) * 0.3, -0.2, 10);
                    }
                } else {
                    localPlayer.state = 'idle';
                }
            }

            broadcastPlayerState();
        }

        function renderGame() {
            ctx.clearRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
            ctx.save();
            ctx.scale(scale, scale);

            // Draw Area
            if (localPlayer.currentArea === 'courtyard') {
                PixelArt.drawCourtyard(ctx);
                document.getElementById('locationTag').innerText = 'Courtyard Hub';
            } else {
                PixelArt.drawSanctuaryRoom(ctx, localPlayer.currentArea);
                document.getElementById('locationTag').innerText = `Sanctuary Room`;
            }

            // Collect all characters (local + remote) and sort by Y depth for 2.5D layering
            let allEntities = [localPlayer];
            remotePlayers.forEach(p => {
                if (p.currentArea === localPlayer.currentArea) allEntities.push(p);
            });
            allEntities.sort((a, b) => a.y - b.y);

            // Render entities with proper depth
            allEntities.forEach(entity => {
                PixelArt.drawCharacter(ctx, entity);
            });

            updateAndDrawParticles(ctx);
            ctx.restore();
        }

        function gameLoop() {
            updateGame();
            renderGame();
            requestAnimationFrame(gameLoop);
        }

        // --- INTERACTION & DOORS ---
        function handleInteraction() {
            if (localPlayer.currentArea === 'courtyard') {
                if (Math.abs(localPlayer.x - 120) < 25 && localPlayer.y < 65) {
                    localPlayer.currentArea = 'sanctuary_1';
                    localPlayer.x = VIRTUAL_WIDTH / 2;
                    localPlayer.y = VIRTUAL_HEIGHT - 25;
                } else if (Math.abs(localPlayer.x - 280) < 25 && localPlayer.y < 65) {
                    localPlayer.currentArea = 'sanctuary_2';
                    localPlayer.x = VIRTUAL_WIDTH / 2;
                    localPlayer.y = VIRTUAL_HEIGHT - 25;
                }
            } else {
                if (localPlayer.y > VIRTUAL_HEIGHT - 25) {
                    localPlayer.currentArea = 'courtyard';
                    localPlayer.x = 200;
                    localPlayer.y = 75;
                    localPlayer.state = 'idle';
                }
            }
        }

        function toggleSit() {
            if (localPlayer.currentArea !== 'courtyard') {
                if (localPlayer.state === 'sit') {
                    localPlayer.state = 'idle';
                    localPlayer.y += 10;
                } else {
                    localPlayer.state = 'sit';
                }
            }
        }

        // --- CONTROLS ---
        window.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if (e.key === 'e' || e.key === 'E') handleInteraction();
            if (e.key === ' ') toggleSit();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
        });

        // Touch control bindings
        const bindTouch = (elem, startFn, endFn) => {
            elem.addEventListener('touchstart', (e) => { e.preventDefault(); startFn(); });
            elem.addEventListener('touchend', (e) => { e.preventDefault(); endFn(); });
            elem.addEventListener('mousedown', startFn);
            elem.addEventListener('mouseup', endFn);
        };

        bindTouch(document.getElementById('btnLeft'), () => keys.left = true, () => keys.left = false);
        bindTouch(document.getElementById('btnRight'), () => keys.right = true, () => keys.right = false);
        bindTouch(document.getElementById('btnUp'), () => keys.up = true, () => keys.up = false);
        bindTouch(document.getElementById('btnDown'), () => keys.down = true, () => keys.down = false);
        document.getElementById('btnInteract').addEventListener('click', handleInteraction);
        document.getElementById('btnSit').addEventListener('click', toggleSit);

        // --- PERMANENT DATABASE CHAT SYSTEM ---
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const chatMessages = document.getElementById('chatMessages');

        function appendChatDOM(sender, msg) {
            const div = document.createElement('div');
            div.className = 'text-slate-200 break-words';
            div.innerHTML = `<span class="font-bold text-indigo-400">${sender}:</span> ${msg}`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (text.length > 0 && currentUser) {
                // Insert directly into Supabase database table so all users receive it reliably
                await supabaseClient.from('messages').insert([
                    { author: localPlayer.name, text: text }
                ]);
                chatInput.value = '';
                chatInput.blur();
            }
        });

        // --- SETTINGS MODAL ---
        const btnCustomizer = document.getElementById('btnCustomizer');
        const modalCustomizer = document.getElementById('modalCustomizer');
        const btnCloseCustomizer = document.getElementById('btnCloseCustomizer');

        btnCustomizer.addEventListener('click', () => modalCustomizer.classList.remove('hidden'));
        btnCloseCustomizer.addEventListener('click', async () => {
            const newName = document.getElementById('inputPlayerName').value.trim() || 'AnimeWalker';
            const newHair = document.getElementById('colorHair').value;
            const newOutfit = document.getElementById('colorOutfit').value;

            localPlayer.name = newName;
            localPlayer.hairColor = newHair;
            localPlayer.outfitColor = newOutfit;
            document.getElementById('playerTag').innerText = newName;

            await supabaseClient.auth.updateUser({
                data: { 
                    display_name: newName,
                    hair_color: newHair,
                    outfit_color: newOutfit
                }
            });

            modalCustomizer.classList.add('hidden');
        });
    </script>
</body>
</html>
