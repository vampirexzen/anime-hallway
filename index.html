<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sakura Slime World & Dungeon 🌸</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Yuji+Mai&display=swap" rel="stylesheet">

  <style>
    * {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #111827;
      color: #f3f4f6;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    .font-sakura { font-family: 'Yuji Mai', serif; }
    .glass-panel {
      background: rgba(30, 27, 75, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(244, 114, 182, 0.25);
    }
    /* Fixed Aspect Ratio Canvas Container */
    #canvas-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #0f172a;
    }
    canvas {
      image-rendering: pixelated;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(244,114,182,0.4); border-radius: 10px; }
  </style>
</head>
<body class="flex flex-col md:flex-row h-screen w-screen overflow-hidden">

  <!-- Left Sidebar Controls & Navigation -->
  <aside class="w-full md:w-80 bg-slate-900/90 border-b md:border-b-0 md:border-r border-pink-500/30 flex flex-col justify-between p-3.5 z-30 shrink-0">
    <div>
      <!-- Header / Logo -->
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-pink-500/20">
        <div class="flex items-center gap-2.5">
          <div class="bg-gradient-to-tr from-pink-600 to-rose-400 p-2 rounded-xl shadow-lg shadow-pink-500/30">
            <i data-lucide="flower-2" class="w-5 h-5 text-white"></i>
          </div>
          <div>
            <h1 class="font-sakura text-base text-pink-300 font-bold tracking-wide">Sakura Slime World</h1>
            <p class="text-[10px] text-pink-400/80 font-medium">Virtual Lounge & RPG Dungeon</p>
          </div>
        </div>
      </div>

      <!-- User Level & Stats Card -->
      <div class="bg-gradient-to-r from-purple-900/60 to-pink-900/60 p-3 rounded-2xl border border-pink-500/30 mb-3 shadow-inner">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-2">
            <div id="user-avatar-badge" class="w-7 h-7 rounded-full bg-pink-500 text-white font-bold flex items-center justify-center text-xs shadow-md">
              S
            </div>
            <div>
              <p id="user-name-display" class="text-xs font-bold text-white truncate max-w-[110px]">Slime Hero</p>
              <p id="user-level-badge" class="text-[10px] text-amber-300 font-semibold">Lvl 1 Adventurer</p>
            </div>
          </div>
          <button onclick="changeName()" class="p-1.5 bg-white/10 hover:bg-white/20 text-pink-300 rounded-lg transition" title="Change Name">
            <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
          </button>
        </div>
        <!-- EXP Bar -->
        <div class="w-full bg-black/40 h-2 rounded-full overflow-hidden border border-pink-500/20">
          <div id="exp-bar" class="bg-gradient-to-r from-emerald-400 to-green-500 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <p id="exp-text" class="text-[9px] text-right text-emerald-300 mt-0.5">EXP: 0 / 100</p>
      </div>

      <!-- Room Selector -->
      <h2 class="text-[11px] font-bold text-pink-400 uppercase tracking-wider mb-2 px-1">Select Room Zone</h2>
      <div class="grid grid-cols-2 gap-1.5 mb-3">
        <button onclick="switchRoom('park')" id="btn-room-park" class="room-nav-btn flex items-center gap-2 px-2.5 py-2 rounded-xl text-xs font-semibold bg-pink-600 text-white shadow-md">
          <i data-lucide="trees" class="w-4 h-4"></i> Swing Park
        </button>
        <button onclick="switchRoom('disco')" id="btn-room-disco" class="room-nav-btn flex items-center gap-2 px-2.5 py-2 rounded-xl text-xs font-medium text-pink-300 bg-slate-800 hover:bg-slate-700">
          <i data-lucide="disc" class="w-4 h-4"></i> Disco Club
        </button>
        <button onclick="switchRoom('onsen')" id="btn-room-onsen" class="room-nav-btn flex items-center gap-2 px-2.5 py-2 rounded-xl text-xs font-medium text-pink-300 bg-slate-800 hover:bg-slate-700">
          <i data-lucide="waves" class="w-4 h-4"></i> Onsen Spa
        </button>
        <button onclick="switchRoom('dungeon')" id="btn-room-dungeon" class="room-nav-btn flex items-center gap-2 px-2.5 py-2 rounded-xl text-xs font-bold text-amber-300 bg-purple-900/80 border border-amber-400/40 hover:bg-purple-800">
          <i data-lucide="skull" class="w-4 h-4"></i> RPG Dungeon
        </button>
      </div>

      <!-- Music Track Switcher -->
      <div class="bg-slate-800/80 p-2.5 rounded-xl border border-pink-500/20 mb-3">
        <div class="flex items-center justify-between mb-1">
          <span class="text-[11px] font-bold text-pink-300 flex items-center gap-1">
            <i data-lucide="music" class="w-3.5 h-3.5"></i> LoFi Soundtrack
          </span>
          <button onclick="toggleMusic()" id="btn-music-toggle" class="text-[10px] bg-pink-600 px-2 py-0.5 rounded-md text-white">
            Play
          </button>
        </div>
        <select id="music-track-select" onchange="changeTrack(this.value)" class="w-full bg-slate-900 border border-pink-500/30 text-xs text-pink-200 rounded-lg p-1.5 focus:outline-none">
          <option value="sakura-chill">🌸 Sakura Chill LoFi</option>
          <option value="zen-garden">⛩️ Zen Garden Dreams</option>
          <option value="disco-funk">🪩 Disco Slime Beats</option>
          <option value="dungeon-synth">⚔️ Dungeon Synth Ambience</option>
        </select>
      </div>

      <!-- Live Room Chat Box -->
      <div class="flex flex-col h-32 md:h-40 bg-slate-950/80 rounded-xl border border-pink-500/20 p-2">
        <div id="chat-messages" class="flex-1 overflow-y-auto space-y-1 text-[11px] pr-1">
          <p class="text-pink-400/70 italic text-center text-[10px] my-2">Welcome to Sakura Slime World!</p>
        </div>
      </div>
    </div>

    <!-- Chat Form Input -->
    <form id="chat-form" class="flex items-center gap-1.5 mt-2">
      <input 
        type="text" 
        id="chat-input" 
        placeholder="Chat or talk..." 
        autocomplete="off" 
        maxlength="80"
        class="flex-1 bg-slate-950 border border-pink-500/30 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-pink-400 placeholder-slate-500"
      />
      <button type="submit" class="bg-pink-600 hover:bg-pink-500 text-white p-2 rounded-xl transition">
        <i data-lucide="send" class="w-3.5 h-3.5"></i>
      </button>
    </form>
  </aside>

  <!-- Main Canvas Play Area -->
  <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-slate-950">
    
    <!-- Top Canvas Overlay Bar -->
    <div class="absolute top-3 left-3 right-3 z-20 flex items-center justify-between pointer-events-none">
      <!-- Active Room Badge & Controls Hint -->
      <div class="bg-slate-900/80 backdrop-blur border border-pink-500/30 px-3 py-1.5 rounded-xl flex items-center gap-2 pointer-events-auto">
        <span id="room-title-badge" class="text-xs font-bold text-pink-300">🌸 Swing Park Zone</span>
        <span class="text-[10px] text-emerald-400 bg-emerald-950/80 px-2 py-0.5 rounded-md border border-emerald-500/30 font-semibold flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="online-count">1</span> Online
        </span>
      </div>

      <!-- Canvas Zoom Controls & Dungeon Shoot Controls -->
      <div class="flex items-center gap-2 pointer-events-auto">
        <button onclick="adjustZoom(-0.1)" class="w-8 h-8 bg-slate-900/80 hover:bg-slate-800 border border-pink-500/30 text-white rounded-xl font-bold text-sm shadow flex items-center justify-center">
          -
        </button>
        <span id="zoom-level-text" class="text-[11px] font-mono text-pink-300 bg-slate-900/80 border border-pink-500/30 px-2 py-1 rounded-lg">100%</span>
        <button onclick="adjustZoom(0.1)" class="w-8 h-8 bg-slate-900/80 hover:bg-slate-800 border border-pink-500/30 text-white rounded-xl font-bold text-sm shadow flex items-center justify-center">
          +
        </button>
      </div>
    </div>

    <!-- Canvas Wrapper with Locked Ratio -->
    <div id="canvas-wrapper">
      <canvas id="gameCanvas" width="960" height="540"></canvas>
    </div>

    <!-- Mobile Action Touch Controls (Overlay on Canvas) -->
    <div class="absolute bottom-4 right-4 z-20 flex items-center gap-3 md:hidden pointer-events-auto">
      <button id="btn-action-shoot" onclick="shootAcid()" class="hidden w-14 h-14 bg-gradient-to-tr from-emerald-600 to-green-400 text-white font-bold rounded-full shadow-lg shadow-emerald-500/40 border-2 border-white/40 flex flex-col items-center justify-center text-[10px] active:scale-90 transition">
        <i data-lucide="crosshair" class="w-5 h-5"></i> SHOOT
      </button>
      <button onclick="triggerJump()" class="w-14 h-14 bg-gradient-to-tr from-pink-600 to-rose-400 text-white font-bold rounded-full shadow-lg shadow-pink-500/40 border-2 border-white/40 flex flex-col items-center justify-center text-[10px] active:scale-90 transition">
        <i data-lucide="arrow-up" class="w-5 h-5"></i> JUMP
      </button>
    </div>
  </main>

  <script>
    // Supabase Setup
    const SUPABASE_URL = 'https://brvyjdtnxzjlrhukngjn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydnlqZHRueHpqbHJodWtuZ2puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTAwMjcsImV4cCI6MjEwODA4NjAyN30.2ib-m3ju3SEhJLaQHQdA8xinenbtN5MltOatIYZSZIE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Player State
    let myId = 'user_' + Math.random().toString(36).substring(2, 9);
    let myName = localStorage.getItem('slime_name') || ('Slime_' + Math.floor(100 + Math.random() * 900));
    let myLevel = parseInt(localStorage.getItem('slime_lvl') || '1');
    let myExp = parseInt(localStorage.getItem('slime_exp') || '0');
    let expToNext = myLevel * 100;

    let currentRoom = 'park';
    let myColor = ['#f472b6', '#38bdf8', '#34d399', '#a78bfa', '#fbbf24'][Math.floor(Math.random() * 5)];

    // Physics & Position
    let myX = 480, myY = 270;
    let targetX = 480, targetY = 270;
    let jumpZ = 0, jumpVelocity = 0;
    let isJumping = false;

    // Zoom Level
    let zoomLevel = 1.0;

    // Projectiles & Dungeon Enemies
    let acidProjectiles = [];
    let dungeonEnemies = [];

    // Multiplayer State
    let players = {};
    let chatBubbles = {};
    let roomChannel = null;

    // Input Keys
    const keys = {};

    // Canvas Context
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Music Synth State
    let audioCtx = null;
    let isMusicPlaying = false;
    let musicInterval = null;
    let currentTrack = 'sakura-chill';

    // App Initialization
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      updatePlayerStatsUI();
      setupCanvasScale();
      window.addEventListener('resize', setupCanvasScale);
      setupControls();
      connectRealtime();
      requestAnimationFrame(gameLoop);
    });

    // Handle Fixed Aspect Ratio Responsive Canvas
    function setupCanvasScale() {
      const wrapper = document.getElementById('canvas-wrapper');
      const w = wrapper.clientWidth;
      const h = wrapper.clientHeight;
      const aspect = 960 / 540;

      let renderW = w;
      let renderH = w / aspect;

      if (renderH > h) {
        renderH = h;
        renderW = h * aspect;
      }

      canvas.style.width = `${renderW}px`;
      canvas.style.height = `${renderH}px`;
    }

    function adjustZoom(delta) {
      zoomLevel = Math.max(0.7, Math.min(1.5, zoomLevel + delta));
      document.getElementById('zoom-level-text').textContent = `${Math.round(zoomLevel * 100)}%`;
    }

    function updatePlayerStatsUI() {
      localStorage.setItem('slime_name', myName);
      localStorage.setItem('slime_lvl', myLevel);
      localStorage.setItem('slime_exp', myExp);

      document.getElementById('user-name-display').textContent = myName;
      document.getElementById('user-level-badge').textContent = `Lvl ${myLevel} Adventurer`;
      document.getElementById('user-avatar-badge').style.backgroundColor = myColor;
      document.getElementById('user-avatar-badge').textContent = myName.charAt(0).toUpperCase();

      expToNext = myLevel * 100;
      const pct = Math.min(100, Math.floor((myExp / expToNext) * 100));
      document.getElementById('exp-bar').style.width = `${pct}%`;
      document.getElementById('exp-text').textContent = `EXP: ${myExp} / ${expToNext}`;
    }

    function changeName() {
      const n = prompt('Enter your Slime Adventurer Name:', myName);
      if (n && n.trim()) {
        myName = n.trim();
        updatePlayerStatsUI();
        broadcastPosition();
      }
    }

    // Switch Rooms
    function switchRoom(roomName) {
      currentRoom = roomName;
      document.querySelectorAll('.room-nav-btn').forEach(btn => {
        btn.classList.remove('bg-pink-600', 'text-white', 'shadow-md');
        btn.classList.add('text-pink-300', 'bg-slate-800');
      });
      
      const activeBtn = document.getElementById(`btn-room-${roomName}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-pink-600', 'text-white', 'shadow-md');
        activeBtn.classList.remove('text-pink-300', 'bg-slate-800');
      }

      // Title badge
      const titles = {
        park: '🌸 Swing Park & Playground',
        disco: '🪩 Slime Disco Club',
        onsen: '♨️ Onsen Hot Springs',
        dungeon: '⚔️ Monster Dungeon Portal'
      };
      document.getElementById('room-title-badge').textContent = titles[roomName] || roomName;

      // Show/Hide Shoot Button
      const shootBtn = document.getElementById('btn-action-shoot');
      if (roomName === 'dungeon') {
        shootBtn.classList.remove('hidden');
        spawnDungeonEnemies();
      } else {
        shootBtn.classList.add('hidden');
      }

      players = {};
      chatBubbles = {};
      connectRealtime();
    }

    // Supabase Realtime Sync
    function connectRealtime() {
      if (roomChannel) supabaseClient.removeChannel(roomChannel);

      roomChannel = supabaseClient.channel(`room:${currentRoom}`, {
        config: { presence: { key: myId } }
      });

      roomChannel
        .on('broadcast', { event: 'move' }, p => {
          if (p.payload.id !== myId) players[p.payload.id] = p.payload;
        })
        .on('broadcast', { event: 'chat' }, p => {
          triggerChatBubble(p.payload.id, p.payload.text);
          appendChatLog(p.payload.name, p.payload.text);
        })
        .on('broadcast', { event: 'shoot' }, p => {
          if (p.payload.id !== myId) {
            acidProjectiles.push({
              x: p.payload.x, y: p.payload.y,
              vx: p.payload.vx, vy: p.payload.vy,
              color: '#34d399', life: 60
            });
          }
        })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await roomChannel.track({ id: myId, name: myName, level: myLevel, room: currentRoom });
            broadcastPosition();
          }
        });

      roomChannel.on('presence', { event: 'sync' }, () => {
        const state = roomChannel.presenceState();
        let total = 0;
        Object.values(state).forEach(presences => total += presences.length);
        document.getElementById('online-count').textContent = total;
      });
    }

    function broadcastPosition() {
      if (!roomChannel) return;
      roomChannel.send({
        type: 'broadcast',
        event: 'move',
        payload: { id: myId, name: myName, level: myLevel, x: myX, y: myY, jumpZ, color: myColor }
      });
    }

    // Shooting Acid Projectiles in Dungeon
    function shootAcid() {
      if (currentRoom !== 'dungeon') return;

      // Shoot towards last move direction or canvas center
      let angle = Math.atan2(targetY - myY, targetX - myX);
      if (Math.abs(targetX - myX) < 5 && Math.abs(targetY - myY) < 5) {
        angle = -Math.PI / 2; // default shoot upward
      }

      const speed = 7;
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;

      acidProjectiles.push({
        x: myX, y: myY - 10,
        vx, vy, color: '#34d399', life: 60
      });

      if (roomChannel) {
        roomChannel.send({
          type: 'broadcast',
          event: 'shoot',
          payload: { id: myId, x: myX, y: myY - 10, vx, vy }
        });
      }
    }

    // Spawn Small Enemies for Dungeon
    function spawnDungeonEnemies() {
      dungeonEnemies = [];
      for (let i = 0; i < 6; i++) {
        dungeonEnemies.push({
          id: i,
          x: 100 + Math.random() * 760,
          y: 100 + Math.random() * 340,
          hp: 2,
          maxHp: 2,
          type: Math.random() > 0.5 ? 'spider' : 'goblin'
        });
      }
    }

    // Chat Functions
    document.getElementById('chat-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      triggerChatBubble(myId, text);
      appendChatLog(myName, text);

      if (roomChannel) {
        roomChannel.send({
          type: 'broadcast',
          event: 'chat',
          payload: { id: myId, name: myName, text }
        });
      }
    });

    function triggerChatBubble(id, text) {
      chatBubbles[id] = { text, timer: 160 };
    }

    function appendChatLog(name, text) {
      const box = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = "bg-slate-900/80 p-1.5 rounded-lg border border-pink-500/20";
      div.innerHTML = `<span class="font-bold text-pink-300">${escapeHtml(name)}:</span> <span class="text-slate-200">${escapeHtml(text)}</span>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.innerText = s;
      return d.innerHTML;
    }

    // Controls & Touch Handler
    function setupControls() {
      window.addEventListener('keydown', e => {
        if (document.activeElement.tagName === 'INPUT') return;
        keys[e.code] = true;
        if (e.code === 'Space') triggerJump();
        if (e.code === 'KeyF') shootAcid();
      });

      window.addEventListener('keyup', e => { keys[e.code] = false; });

      canvas.addEventListener('pointerdown', e => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        targetX = (e.clientX - rect.left) * scaleX;
        targetY = (e.clientY - rect.top) * scaleY;

        if (currentRoom === 'dungeon') shootAcid();
      });
    }

    function triggerJump() {
      if (!isJumping) {
        isJumping = true;
        jumpVelocity = 7;
      }
    }

    // Game Loop & Logic
    let lastBroadcastTime = 0;
    function gameLoop(time) {
      updatePhysics();
      renderScene();

      if (time - lastBroadcastTime > 80) {
        broadcastPosition();
        lastBroadcastTime = time;
      }

      requestAnimationFrame(gameLoop);
    }

    function updatePhysics() {
      // WASD / Arrow Movement
      let dx = 0, dy = 0;
      if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

      const spd = 3.5;
      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        myX += (dx / len) * spd;
        myY += (dy / len) * spd;
        targetX = myX; targetY = myY;
      } else {
        const dist = Math.hypot(targetX - myX, targetY - myY);
        if (dist > 3) {
          myX += ((targetX - myX) / dist) * spd;
          myY += ((targetY - myY) / dist) * spd;
        }
      }

      // Boundaries
      myX = Math.max(30, Math.min(canvas.width - 30, myX));
      myY = Math.max(50, Math.min(canvas.height - 30, myY));

      // Jump Physics
      if (isJumping) {
        jumpZ += jumpVelocity;
        jumpVelocity -= 0.5;
        if (jumpZ <= 0) {
          jumpZ = 0;
          isJumping = false;
        }
      }

      // Update Acid Projectiles
      for (let i = acidProjectiles.length - 1; i >= 0; i--) {
        const p = acidProjectiles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        // Collision with Dungeon Enemies
        if (currentRoom === 'dungeon') {
          dungeonEnemies.forEach(e => {
            if (e.hp > 0 && Math.hypot(p.x - e.x, p.y - e.y) < 22) {
              e.hp--;
              p.life = 0; // Destroy projectile
              if (e.hp <= 0) {
                // Grant EXP on enemy defeat
                myExp += 25;
                if (myExp >= expToNext) {
                  myLevel++;
                  myExp -= expToNext;
                  triggerChatBubble(myId, `🎉 LEVELED UP TO LVL ${myLevel}!`);
                }
                updatePlayerStatsUI();
              }
            }
          });
        }

        if (p.life <= 0) acidProjectiles.splice(i, 1);
      }
    }

    // Render Scene with Zoom Scaling
    function renderScene() {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Apply Zoom around center
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(zoomLevel, zoomLevel);
      ctx.translate(-canvas.width / 2, -canvas.height / 2);

      // Draw Background Room Decorations
      drawRoomEnvironment();

      // Draw Dungeon Enemies
      if (currentRoom === 'dungeon') {
        dungeonEnemies.forEach(e => {
          if (e.hp > 0) drawEnemy(e);
        });
      }

      // Draw Acid Projectiles
      acidProjectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw Other Players
      Object.values(players).forEach(p => {
        drawSlime(p.x, p.y, p.jumpZ || 0, p.name, p.level || 1, p.color, p.id);
      });

      // Draw Local Player
      drawSlime(myX, myY, jumpZ, myName, myLevel, myColor, myId);

      ctx.restore();
    }

    // Room Environments
    function drawRoomEnvironment() {
      if (currentRoom === 'park') {
        // Swing Park Ground
        ctx.fillStyle = '#15803d';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Playground Swings
        ctx.strokeStyle = '#fcd34d';
        ctx.lineWidth = 4;
        ctx.strokeRect(200, 100, 120, 80); // Swing Frame
        ctx.beginPath(); ctx.moveTo(230, 100); ctx.lineTo(230, 150); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(290, 100); ctx.lineTo(290, 150); ctx.stroke();
        ctx.fillStyle = '#b45309';
        ctx.fillRect(220, 150, 20, 6); ctx.fillRect(280, 150, 20, 6);

        // Slide
        ctx.fillStyle = '#ef4444';
        ctx.beginPath(); ctx.moveTo(700, 220); ctx.lineTo(780, 120); ctx.lineTo(800, 120); ctx.lineTo(720, 220); ctx.fill();

        // Sakura Trees
        drawSakuraTree(100, 120);
        drawSakuraTree(850, 380);
      } 
      else if (currentRoom === 'disco') {
        // Disco Floor Tiles
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const time = Date.now() * 0.003;
        for (let x = 100; x < canvas.width - 100; x += 60) {
          for (let y = 100; y < canvas.height - 100; y += 60) {
            const hue = Math.floor((x + y + time * 100) % 360);
            ctx.fillStyle = `hsla(${hue}, 80%, 50%, 0.4)`;
            ctx.fillRect(x, y, 56, 56);
          }
        }

        // Spinning Disco Ball
        ctx.fillStyle = '#e2e8f0';
        ctx.beginPath(); ctx.arc(480, 70, 25, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2; ctx.stroke();
      }
      else if (currentRoom === 'onsen') {
        // Onsen Springs Ground
        ctx.fillStyle = '#065f46';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Hot Water Pool
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.ellipse(480, 270, 220, 130, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 6; ctx.stroke();
      }
      else if (currentRoom === 'dungeon') {
        // Dungeon Stone Grid
        ctx.fillStyle = '#1e1b4b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(244, 114, 182, 0.15)';
        ctx.lineWidth = 2;
        for (let x = 0; x < canvas.width; x += 60) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 60) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
      }
    }

    function drawSakuraTree(x, y) {
      ctx.fillStyle = '#f472b6';
      ctx.beginPath(); ctx.arc(x, y - 30, 40, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#78350f';
      ctx.fillRect(x - 8, y - 10, 16, 30);
    }

    function drawEnemy(e) {
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(e.x, e.y, 14, 0, Math.PI * 2);
      ctx.fill();

      // Enemy Health Bar
      ctx.fillStyle = '#000000';
      ctx.fillRect(e.x - 15, e.y - 24, 30, 4);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(e.x - 15, e.y - 24, (e.hp / e.maxHp) * 30, 4);
    }

    function drawSlime(x, y, z, name, level, color, id) {
      const renderY = y - z;

      // Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.beginPath();
      ctx.ellipse(x, y + 10, 16, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Slime Body (Squish Physics)
      const squish = z > 0 ? 0.8 : 1.0;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(x, renderY, 18 * (2 - squish), 16 * squish, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();

      // Eyes
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x - 5, renderY - 3, 3, 0, Math.PI * 2);
      ctx.arc(x + 5, renderY - 3, 3, 0, Math.PI * 2);
      ctx.fill();

      // Name & Level Badge above Slime
      ctx.fillStyle = '#fef08a';
      ctx.font = 'bold 11px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`Lvl ${level} ${name}`, x, renderY - 24);

      // Chat Bubble
      if (chatBubbles[id] && chatBubbles[id].timer > 0) {
        chatBubbles[id].timer--;
        const bText = chatBubbles[id].text;

        ctx.font = '11px "Plus Jakarta Sans", sans-serif';
        const tw = ctx.measureText(bText).width;
        const bw = Math.max(tw + 16, 36);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.beginPath();
        ctx.roundRect(x - bw / 2, renderY - 55, bw, 22, 6);
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.fillText(bText, x, renderY - 40);
      }
    }

    // Web Audio Synthesizer LoFi Tracks
    function toggleMusic() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      isMusicPlaying = !isMusicPlaying;
      document.getElementById('btn-music-toggle').textContent = isMusicPlaying ? 'Mute' : 'Play';

      if (isMusicPlaying) playLoFiBeat();
      else clearInterval(musicInterval);
    }

    function changeTrack(val) {
      currentTrack = val;
      if (isMusicPlaying) {
        clearInterval(musicInterval);
        playLoFiBeat();
      }
    }

    function playLoFiBeat() {
      const notes = {
        'sakura-chill': [261.63, 293.66, 329.63, 392.00, 440.00],
        'zen-garden': [220.00, 246.94, 277.18, 329.63, 369.99],
        'disco-funk': [130.81, 164.81, 196.00, 220.00, 261.63],
        'dungeon-synth': [110.00, 123.47, 130.81, 146.83, 164.81]
      };

      const trackNotes = notes[currentTrack] || notes['sakura-chill'];

      musicInterval = setInterval(() => {
        if (!isMusicPlaying || !audioCtx) return;
        const freq = trackNotes[Math.floor(Math.random() * trackNotes.length)];

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = currentTrack === 'disco-funk' ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      }, 500);
    }
  </script>
