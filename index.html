<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sakura Slime World 🌸 - Lounge & Dungeon</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Yuji+Mai&display=swap" rel="stylesheet" />

  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      width: 100dvw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      background: #180914;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .font-sakura {
      font-family: 'Yuji Mai', serif;
    }

    .glass {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    .glass-dark {
      background: rgba(30, 15, 28, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(244, 114, 182, 0.25);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(244, 114, 182, 0.4);
    }

    .glass-input:focus {
      border-color: #ec4899;
      outline: none;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.25);
    }

    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(244, 114, 182, 0.5);
      border-radius: 10px;
    }

    .joystick-base {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(244, 114, 182, 0.6);
      backdrop-filter: blur(8px);
      position: relative;
      touch-action: none;
    }
    .joystick-stick {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
      box-shadow: 0 4px 10px rgba(236, 72, 153, 0.5);
      position: absolute;
      top: 25px;
      left: 25px;
      pointer-events: none;
      transition: transform 0.04s ease-out;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(244, 114, 182, 0.5);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.15);
    }
    .action-btn:active {
      transform: scale(0.92);
      background: #ec4899;
      color: white;
    }
  </style>
</head>
<body class="flex flex-col h-full w-full overflow-hidden select-none bg-pink-950">

  <!-- HEADER NAVBAR -->
  <header class="h-12 sm:h-14 glass px-3 flex items-center justify-between z-30 shrink-0 border-b border-pink-200/60 shadow-sm">
    <div class="flex items-center gap-2">
      <div class="bg-gradient-to-tr from-pink-500 to-rose-400 text-white p-1.5 rounded-xl shadow-md shrink-0">
        <i data-lucide="flower-2" class="w-4 h-4 sm:w-5 sm:h-5 animate-spin" style="animation-duration: 12s;"></i>
      </div>
      <div>
        <h1 class="font-sakura text-xs sm:text-base text-pink-950 font-bold tracking-wide leading-none">Sakura World 🌸</h1>
        <p class="text-[9px] sm:text-[10px] text-pink-600 font-semibold uppercase mt-0.5" id="room-indicator">#sakura-lounge</p>
      </div>
    </div>

    <!-- CURRENCY & CONTROLS -->
    <div class="flex items-center gap-1.5">
      <!-- Gem Counter -->
      <div class="flex items-center gap-1 px-2.5 py-1 rounded-xl bg-amber-100 border border-amber-300 text-amber-900 text-xs font-extrabold shadow-sm">
        <i data-lucide="gem" class="w-3.5 h-3.5 text-amber-600"></i>
        <span id="gem-count">100</span>
      </div>

      <!-- Shop Trigger -->
      <button onclick="toggleShopModal()" class="p-1.5 rounded-xl bg-amber-400 hover:bg-amber-500 text-amber-950 border border-amber-300 shadow-sm active:scale-95" title="Slime Shop">
        <i data-lucide="shopping-bag" class="w-4 h-4"></i>
      </button>

      <!-- Settings Customization -->
      <button onclick="toggleSettingsModal()" class="p-1.5 rounded-xl bg-white/90 hover:bg-pink-100 text-pink-800 border border-pink-200 shadow-sm active:scale-95" title="Customize Slime">
        <i data-lucide="user-cog" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- MAIN VIEWPORT CONTAINER -->
  <div class="flex-1 relative flex overflow-hidden w-full h-full">
    
    <!-- CANVAS VIEW -->
    <div class="flex-1 relative bg-pink-950/20 flex items-center justify-center overflow-hidden h-full w-full" id="canvas-container">
      <canvas id="gameCanvas" class="block w-full h-full cursor-crosshair touch-none"></canvas>

      <!-- Navigation Switcher Pills -->
      <div class="absolute top-2 left-1/2 -translate-x-1/2 z-20 flex items-center gap-1 p-1 glass rounded-2xl border border-pink-200/80 shadow-md max-w-[95vw] overflow-x-auto">
        <button onclick="switchMode('lounge')" id="mode-btn-lounge" class="mode-btn px-3 py-1 rounded-xl text-[10px] sm:text-xs font-bold bg-pink-500 text-white shadow-sm transition whitespace-nowrap">🌸 Zen Lounge</button>
        <button onclick="switchMode('dungeon')" id="mode-btn-dungeon" class="mode-btn px-3 py-1 rounded-xl text-[10px] sm:text-xs font-bold text-pink-800 hover:bg-pink-100 transition whitespace-nowrap">⚔️ Acid Dungeon</button>
      </div>

      <!-- Dungeon HUD -->
      <div id="dungeon-hud" class="hidden absolute top-12 left-1/2 -translate-x-1/2 z-20 glass px-3 py-1.5 rounded-2xl border border-rose-300 shadow-xl flex items-center gap-3">
        <div class="flex items-center gap-2 text-xs">
          <span class="font-bold text-rose-950 uppercase">Enemies Defeated: <strong id="dungeon-kills" class="text-rose-600 font-black">0</strong></span>
          <span class="text-pink-300">|</span>
          <span class="font-bold text-emerald-800">Health: <strong id="dungeon-hp" class="text-emerald-600 font-black">100 HP</strong></span>
        </div>
      </div>

      <!-- Controls Overlay -->
      <div id="lounge-controls" class="absolute bottom-3 left-1/2 -translate-x-1/2 z-20 glass px-2.5 py-1 rounded-2xl border border-pink-200/80 shadow-xl flex items-center gap-1 sm:gap-2">
        <button onclick="triggerJump()" class="action-btn px-2 py-0.5 rounded-xl text-xs font-black text-pink-800 flex items-center gap-1">
          <i data-lucide="arrow-up-circle" class="w-3.5 h-3.5 text-pink-600"></i>
          <span class="hidden sm:inline">Jump</span>
        </button>
        <span class="text-pink-300">|</span>
        <button onclick="triggerEmote('🌸')" class="hover:scale-125 transition text-base sm:text-lg">🌸</button>
        <button onclick="triggerEmote('❤️')" class="hover:scale-125 transition text-base sm:text-lg">❤️</button>
        <button onclick="triggerEmote('✨')" class="hover:scale-125 transition text-base sm:text-lg">✨</button>
        <button onclick="triggerEmote('🔥')" class="hover:scale-125 transition text-base sm:text-lg">🔥</button>
      </div>

      <!-- Mobile Dungeon Attack Button -->
      <div id="dungeon-attack-btn" class="hidden absolute bottom-3 right-3 z-20 pointer-events-auto md:hidden">
        <button onclick="shootAcidMobile()" class="w-14 h-14 rounded-full bg-gradient-to-tr from-emerald-500 to-green-400 text-white text-xs font-black shadow-lg shadow-emerald-500/40 active:scale-90 flex items-center justify-center border-2 border-white">
          ACID 🧪
        </button>
      </div>

      <!-- Mobile D-Pad -->
      <div class="absolute bottom-3 left-3 z-20 pointer-events-auto md:hidden">
        <div id="joystick-container" class="joystick-base">
          <div id="joystick-stick" class="joystick-stick"></div>
        </div>
      </div>
    </div>

    <!-- SIDEBAR CHAT -->
    <aside id="chat-sidebar" class="w-full md:w-80 lg:w-96 glass-dark border-l border-pink-200/80 flex flex-col justify-between absolute md:relative right-0 top-0 bottom-0 z-40 transition-transform duration-300 transform translate-x-full md:translate-x-0 shadow-2xl md:shadow-none h-full">
      <div class="p-3 border-b border-pink-200/30 bg-white/10 flex flex-col gap-2 shrink-0">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-pink-200 uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="message-square" class="w-3.5 h-3.5 text-pink-400"></i> World Chat
          </span>
          <button onclick="toggleChatSidebar()" class="md:hidden text-pink-300 hover:text-white p-1">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <div id="chat-messages" class="flex-1 overflow-y-auto p-3 space-y-2.5 text-xs text-pink-100">
        <div class="bg-pink-900/40 p-2 rounded-xl border border-pink-500/20">
          <strong class="text-pink-300">System:</strong> Welcome to Sakura World! Use WASD or Click/Tap to move. Switch to Acid Dungeon to fight enemies and earn Gems!
        </div>
      </div>

      <div class="p-2.5 bg-pink-950/80 border-t border-pink-200/30 shrink-0">
        <form id="chat-form" onsubmit="handleChatSubmit(event)" class="flex items-center gap-2">
          <input type="text" id="chat-input" placeholder="Type a message..." maxlength="120" autocomplete="off" class="glass-input flex-1 px-3 py-2 rounded-xl text-xs text-pink-950 placeholder-pink-400 font-medium" />
          <button type="submit" class="bg-pink-500 hover:bg-pink-600 text-white p-2 rounded-xl shadow-md transition shrink-0 active:scale-95">
            <i data-lucide="send" class="w-4 h-4"></i>
          </button>
        </form>
      </div>
    </aside>
  </div>

  <!-- SHOP MODAL -->
  <div id="shop-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="glass w-full max-w-sm rounded-3xl p-5 shadow-2xl border border-white space-y-4 max-h-[90dvh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-pink-200 pb-2">
        <div class="flex items-center gap-2">
          <i data-lucide="shopping-bag" class="w-5 h-5 text-amber-600"></i>
          <h3 class="font-bold text-pink-950 text-base">Slime Shop</h3>
        </div>
        <button onclick="toggleShopModal()" class="text-pink-700 hover:text-pink-900 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-2" id="shop-items">
        <!-- Dynamic Shop Items -->
      </div>
    </div>
  </div>

  <!-- CUSTOMIZATION SETTINGS MODAL -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="glass w-full max-w-sm rounded-3xl p-5 shadow-2xl border border-white space-y-4 max-h-[90dvh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-pink-200 pb-2">
        <div class="flex items-center gap-2">
          <i data-lucide="sparkles" class="w-5 h-5 text-pink-600"></i>
          <h3 class="font-bold text-pink-950 text-base">Customize Slime</h3>
        </div>
        <button onclick="toggleSettingsModal()" class="text-pink-700 hover:text-pink-900 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-1">
        <label class="text-[10px] font-bold text-pink-800 uppercase tracking-wider">Display Name</label>
        <input type="text" id="setting-username" maxlength="15" class="glass-input w-full px-3.5 py-2 rounded-xl text-xs font-semibold text-pink-950" value="BouncySlime" />
      </div>

      <div class="space-y-1.5">
        <label class="text-[10px] font-bold text-pink-800 uppercase tracking-wider">Select Style</label>
        <div class="grid grid-cols-2 gap-2" id="avatar-picker"></div>
      </div>

      <button onclick="saveAvatarSettings()" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-2.5 rounded-2xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2 text-xs">
        <i data-lucide="check" class="w-4 h-4"></i> Save Settings
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // --- GAME DATA & STATE ---
    let mode = 'lounge'; // 'lounge' or 'dungeon'
    let gems = 100;
    let kills = 0;
    
    // Extended Customizations
    const AVATAR_STYLES = {
      sakura: { name: 'Sakura Pin', color: '#f472b6', accessory: '🌸', owned: true },
      spirit: { name: 'Cat Ears', color: '#38bdf8', accessory: '🐱', owned: true },
      matcha: { name: 'Matcha Tea', color: '#4ade80', accessory: '🍵', owned: true },
      demon:  { name: 'Demon Horns', color: '#ef4444', accessory: '😈', owned: false, price: 50 },
      galaxy: { name: 'Star Aura', color: '#a855f7', accessory: '⭐', owned: false, price: 80 },
      golden: { name: 'Royal Crown', color: '#eab308', accessory: '👑', owned: false, price: 150 }
    };

    let selectedStyle = 'sakura';

    let slime = {
      x: 300,
      y: 300,
      radius: 24,
      targetX: 300,
      targetY: 300,
      speed: 4,
      hp: 100,
      maxHp: 100,
      jumpOffset: 0,
      jumpVel: 0,
      isJumping: false
    };

    let acidBullets = [];
    let enemies = [];
    let particles = [];

    // Setup Canvas Aspect Ratio Handler
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const container = document.getElementById('canvas-container');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      if (slime.x > canvas.width) slime.x = canvas.width / 2;
      if (slime.y > canvas.height) slime.y = canvas.height / 2;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Movement and Controls
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      if (mode === 'dungeon') {
        shootAcid(clickX, clickY);
      } else {
        slime.targetX = clickX;
        slime.targetY = clickY;
      }
    });

    function shootAcid(targetX, targetY) {
      const angle = Math.atan2(targetY - slime.y, targetX - slime.x);
      acidBullets.push({
        x: slime.x,
        y: slime.y,
        vx: Math.cos(angle) * 8,
        vy: Math.sin(angle) * 8,
        radius: 6,
        life: 100
      });
    }

    function shootAcidMobile() {
      // Shoot forward in current direction
      shootAcid(slime.x + 100, slime.y);
    }

    function spawnEnemy() {
      if (enemies.length < 6 && mode === 'dungeon') {
        const side = Math.floor(Math.random() * 4);
        let x, y;
        if (side === 0) { x = Math.random() * canvas.width; y = -20; }
        else if (side === 1) { x = canvas.width + 20; y = Math.random() * canvas.height; }
        else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + 20; }
        else { x = -20; y = Math.random() * canvas.height; }

        enemies.push({
          x: x,
          y: y,
          radius: 16,
          speed: 1.5 + Math.random() * 1,
          hp: 20
        });
      }
    }

    setInterval(spawnEnemy, 1500);

    // --- GAME LOOP ---
    function update() {
      // Slime Movement
      let dx = 0, dy = 0;
      if (keys['w'] || keys['arrowup']) dy -= slime.speed;
      if (keys['s'] || keys['arrowdown']) dy += slime.speed;
      if (keys['a'] || keys['arrowleft']) dx -= slime.speed;
      if (keys['d'] || keys['arrowright']) dx += slime.speed;

      if (dx !== 0 || dy !== 0) {
        slime.x += dx;
        slime.y += dy;
        slime.targetX = slime.x;
        slime.targetY = slime.y;
      } else {
        // Smooth position interpolation for click to move
        const dist = Math.hypot(slime.targetX - slime.x, slime.targetY - slime.y);
        if (dist > 4) {
          slime.x += ((slime.targetX - slime.x) / dist) * slime.speed;
          slime.y += ((slime.targetY - slime.y) / dist) * slime.speed;
        }
      }

      // Keep within bounds
      slime.x = Math.max(slime.radius, Math.min(canvas.width - slime.radius, slime.x));
      slime.y = Math.max(slime.radius, Math.min(canvas.height - slime.radius, slime.y));

      // Jump Physics
      if (slime.isJumping) {
        slime.jumpOffset += slime.jumpVel;
        slime.jumpVel -= 0.8;
        if (slime.jumpOffset <= 0) {
          slime.jumpOffset = 0;
          slime.isJumping = false;
        }
      }

      // Acid Bullets Update
      for (let i = acidBullets.length - 1; i >= 0; i--) {
        const b = acidBullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        // Collision with Enemies
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
            e.hp -= 10;
            b.life = 0;

            // Spawn splat particles
            for (let p = 0; p < 4; p++) {
              particles.push({
                x: e.x, y: e.y,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                life: 15,
                color: '#22c55e'
              });
            }

            if (e.hp <= 0) {
              enemies.splice(j, 1);
              kills++;
              gems += 15;
              document.getElementById('dungeon-kills').textContent = kills;
              document.getElementById('gem-count').textContent = gems;
            }
            break;
          }
        }

        if (b.life <= 0 || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
          acidBullets.splice(i, 1);
        }
      }

      // Enemies Update
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const angle = Math.atan2(slime.y - e.y, slime.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;

        // Enemy collision with Slime
        if (Math.hypot(slime.x - e.x, slime.y - e.y) < slime.radius + e.radius) {
          slime.hp -= 0.2;
          document.getElementById('dungeon-hp').textContent = Math.max(0, Math.floor(slime.hp)) + ' HP';
          if (slime.hp <= 0) {
            alert('Game Over! Respawning Slime...');
            slime.hp = 100;
            switchMode('lounge');
          }
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        particles[i].life--;
        if (particles[i].life <= 0) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render Environment Background
      if (mode === 'lounge') {
        ctx.fillStyle = '#2d112c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Zen Grid pattern
        ctx.strokeStyle = 'rgba(244, 114, 182, 0.08)';
        for (let x = 0; x < canvas.width; x += 40) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
      } else {
        // Dungeon Floor
        ctx.fillStyle = '#111827';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(225, 29, 72, 0.15)';
        for (let x = 0; x < canvas.width; x += 40) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
      }

      // Render Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      // Render Enemies
      if (mode === 'dungeon') {
        enemies.forEach(e => {
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
          ctx.fill();

          // Enemy eyes
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(e.x - 4, e.y - 3, 3, 0, Math.PI * 2);
          ctx.arc(e.x + 4, e.y - 3, 3, 0, Math.PI * 2);
          ctx.fill();
        });

        // Render Acid Bullets
        acidBullets.forEach(b => {
          ctx.fillStyle = '#4ade80';
          ctx.shadowColor = '#22c55e';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        });
      }

      // Render Slime
      const style = AVATAR_STYLES[selectedStyle];
      const drawY = slime.y - slime.jumpOffset;

      ctx.fillStyle = style.color;
      ctx.beginPath();
      ctx.arc(slime.x, drawY, slime.radius, 0, Math.PI * 2);
      ctx.fill();

      // Slime Eyes & Accessory
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(slime.x - 7, drawY - 4, 5, 0, Math.PI * 2);
      ctx.arc(slime.x + 7, drawY - 4, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#180914';
      ctx.beginPath();
      ctx.arc(slime.x - 7, drawY - 4, 2, 0, Math.PI * 2);
      ctx.arc(slime.x + 7, drawY - 4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Accessory Emoji
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(style.accessory, slime.x, drawY - slime.radius - 2);

      // Display Name
      const name = document.getElementById('setting-username').value;
      ctx.fillStyle = '#ffffff';
      ctx.font = '10px "Plus Jakarta Sans"';
      ctx.fillText(name, slime.x, drawY + slime.radius + 14);
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();

    // --- UI CONTROLLERS ---
    function switchMode(newMode) {
      mode = newMode;
      const btnLounge = document.getElementById('mode-btn-lounge');
      const btnDungeon = document.getElementById('mode-btn-dungeon');
      const dungeonHud = document.getElementById('dungeon-hud');
      const dungeonAttack = document.getElementById('dungeon-attack-btn');

      if (mode === 'lounge') {
        btnLounge.className = "mode-btn px-3 py-1 rounded-xl text-[10px] sm:text-xs font-bold bg-pink-500 text-white shadow-sm transition whitespace-nowrap";
        btnDungeon.className = "mode-btn px-3 py-1 rounded-xl text-[10px] sm:text-xs font-bold text-pink-800 hover:bg-pink-100 transition whitespace-nowrap";
        dungeonHud.classList.add('hidden');
        dungeonAttack.classList.add('hidden');
        document.getElementById('room-indicator').textContent = '#sakura-lounge';
        enemies = [];
      } else {
        btnDungeon.className = "mode-btn px-3 py-1 rounded-xl text-[10px] sm:text-xs font-bold bg-rose-600 text-white shadow-sm transition whitespace-nowrap";
        btnLounge.className = "mode-btn px-3 py-1 rounded-xl text-[10px] sm:text-xs font-bold text-pink-800 hover:bg-pink-100 transition whitespace-nowrap";
        dungeonHud.classList.remove('hidden');
        dungeonAttack.classList.remove('hidden');
        document.getElementById('room-indicator').textContent = '⚔️ Acid Dungeon';
      }
    }

    function triggerJump() {
      if (!slime.isJumping) {
        slime.isJumping = true;
        slime.jumpVel = 10;
      }
    }

    function triggerEmote(emoji) {
      particles.push({
        x: slime.x,
        y: slime.y - slime.radius - 20,
        vx: 0,
        vy: -1,
        life: 40,
        color: '#f472b6'
      });
    }

    function toggleChatSidebar() {
      document.getElementById('chat-sidebar').classList.toggle('translate-x-full');
    }

    function toggleSettingsModal() {
      renderAvatarPicker();
      document.getElementById('settings-modal').classList.toggle('hidden');
    }

    function toggleShopModal() {
      renderShopItems();
      document.getElementById('shop-modal').classList.toggle('hidden');
    }

    function renderAvatarPicker() {
      const picker = document.getElementById('avatar-picker');
      picker.innerHTML = '';
      Object.keys(AVATAR_STYLES).forEach(key => {
        const item = AVATAR_STYLES[key];
        if (!item.owned) return;
        
        const btn = document.createElement('button');
        btn.className = `p-2 rounded-xl border flex items-center justify-between gap-1 text-xs font-bold ${selectedStyle === key ? 'border-pink-500 bg-pink-100' : 'border-pink-200'}`;
        btn.onclick = () => { selectedStyle = key; renderAvatarPicker(); };
        btn.innerHTML = `<span>${item.accessory} ${item.name}</span>`;
        picker.appendChild(btn);
      });
    }

    function renderShopItems() {
      const shopContainer = document.getElementById('shop-items');
      shopContainer.innerHTML = '';
      Object.keys(AVATAR_STYLES).forEach(key => {
        const item = AVATAR_STYLES[key];
        if (item.owned) return;

        const div = document.createElement('div');
        div.className = "flex items-center justify-between p-3 rounded-2xl bg-white/80 border border-pink-200";
        div.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-xl">${item.accessory}</span>
            <div>
              <p class="text-xs font-bold text-pink-950">${item.name}</p>
              <p class="text-[10px] text-amber-600 font-extrabold flex items-center gap-0.5"><i data-lucide="gem" class="w-3 h-3"></i> ${item.price} Gems</p>
            </div>
          </div>
          <button onclick="buyItem('${key}')" class="px-3 py-1 rounded-xl bg-amber-400 hover:bg-amber-500 text-amber-950 text-xs font-bold transition">Buy</button>
        `;
        shopContainer.appendChild(div);
      });
      lucide.createIcons();
    }

    function buyItem(key) {
      const item = AVATAR_STYLES[key];
      if (gems >= item.price) {
        gems -= item.price;
        item.owned = true;
        document.getElementById('gem-count').textContent = gems;
        renderShopItems();
        alert(`Successfully bought ${item.name}! You can now equip it in Customize Settings.`);
      } else {
        alert('Not enough Gems! Fight enemies in the Dungeon to gain more.');
      }
    }

    function saveAvatarSettings() {
      toggleSettingsModal();
    }

    function handleChatSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const msgBox = document.getElementById('chat-messages');
      const msg = document.createElement('div');
      const name = document.getElementById('setting-username').value;
      msg.className = "bg-white/10 p-2 rounded-xl border border-pink-200/20";
      msg.innerHTML = `<strong class="text-pink-300">${name}:</strong> ${text}`;
      msgBox.appendChild(msg);
      msgBox.scrollTop = msgBox.scrollHeight;
      input.value = '';
    }
  </script>
</body>
</html>
