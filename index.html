<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sakura Slime World 🌸 - 2D Virtual Lounge & Games</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Yuji+Mai&display=swap" rel="stylesheet" />

  <style>
    /* Viewport & Lock Rules */
    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      width: 100dvw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      background: #180914;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .font-sakura {
      font-family: 'Yuji Mai', serif;
    }

    /* Glassmorphism Styling */
    .glass {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    .glass-dark {
      background: rgba(30, 15, 28, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(244, 114, 182, 0.25);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(244, 114, 182, 0.4);
    }

    .glass-input:focus {
      border-color: #ec4899;
      outline: none;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.25);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(244, 114, 182, 0.5);
      border-radius: 10px;
    }

    /* Mobile Virtual Joystick Touch Base */
    .joystick-base {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(244, 114, 182, 0.6);
      backdrop-filter: blur(8px);
      position: relative;
      touch-action: none;
    }
    .joystick-stick {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
      box-shadow: 0 4px 10px rgba(236, 72, 153, 0.5);
      position: absolute;
      top: 23px;
      left: 23px;
      pointer-events: none;
      transition: transform 0.04s ease-out;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(244, 114, 182, 0.5);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.15);
    }
    .action-btn:active {
      transform: scale(0.92);
      background: #ec4899;
      color: white;
    }
  </style>
</head>
<body class="flex flex-col h-full w-full overflow-hidden select-none bg-pink-950">

  <script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = 'https://brvyjdtnxzjlrhukngjn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydnlqZHRueHpqbHJodWtuZ2puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTAwMjcsImV4cCI6MjEwODA4NjAyN30.2ib-m3ju3SEhJLaQHQdA8xinenbtN5MltOatIYZSZIE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- PROCEDURAL AUDIO SYNTHESIZER ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let musicPlaying = false;
    let musicMasterGain = null;
    let musicTimer = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
        musicMasterGain = audioCtx.createGain();
        musicMasterGain.gain.value = 0.3;
        musicMasterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'bounce') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'jump') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(650, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'emote') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.18);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
          osc.start(now); osc.stop(now + 0.18);
        } else if (type === 'msg') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'win') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'triangle'; o.frequency.value = freq;
            g.gain.setValueAtTime(0.15, now + idx * 0.08);
            g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);
            o.start(now + idx * 0.08); o.stop(now + idx * 0.08 + 0.2);
          });
        }
      } catch (e) {}
    }

    const PENTATONIC_SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

    function playPentatonicNote() {
      if (!musicPlaying || !audioCtx) return;
      const now = audioCtx.currentTime;
      const freq = PENTATONIC_SCALE[Math.floor(Math.random() * PENTATONIC_SCALE.length)];

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = Math.random() > 0.4 ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.12, now + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);

      osc.connect(gain);
      gain.connect(musicMasterGain);
      osc.start(now);
      osc.stop(now + 1.8);

      musicTimer = setTimeout(playPentatonicNote, Math.random() * 600 + 400);
    }

      const username = document.getElementById('auth-username').value.trim();

      try {

          });

          showAuthAlert('Account created! Logging in...', false);

          const dispName = data.user.user_metadata?.display_name || email.split('@')[0];

    function updateAndDrawPetals() {
      ctx.fillStyle = 'rgba(251, 207, 232, 0.85)';
      petals.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX + Math.sin(p.y * 0.015) * 0.4;
        p.rotation += p.rotSpeed;

        if (p.y > canvas.height + 15) {
          p.y = -15;
          p.x = Math.random() * canvas.width;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function addFloatingParticle(x, y, text) {
      for (let i = 0; i < 3; i++) {
        floatingParticles.push({
          x: x + (Math.random() - 0.5) * 20,
          y: y - 20,
          vx: (Math.random() - 0.5) * 1.5,
          vy: -Math.random() * 2 - 1.2,
          alpha: 1,
          size: Math.random() * 6 + 14,
          text: text
        });
      }
    }

    function updateAndDrawParticles() {
      for (let i = floatingParticles.length - 1; i >= 0; i--) {
        const p = floatingParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.02;

        if (p.alpha <= 0) {
          floatingParticles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.font = `${p.size}px sans-serif`;
        ctx.fillText(p.text, p.x, p.y);
        ctx.restore();
      }
    }

    // DRAWING HELPER FUNCTIONS
    function drawSakuraTree(x, y, radius) {
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath(); ctx.ellipse(x, y + radius * 0.7, radius, radius * 0.3, 0, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = '#582f0e';
      ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(x, y + radius * 0.6); ctx.quadraticCurveTo(x - 5, y, x, y - radius * 0.2); ctx.stroke();

      const clusters = [
        { dx: 0, dy: -radius * 0.4, r: radius * 0.6, color: '#f472b6' },
        { dx: -radius * 0.4, dy: -radius * 0.1, r: radius * 0.5, color: '#ec4899' },
        { dx: radius * 0.4, dy: -radius * 0.1, r: radius * 0.5, color: '#fb7185' }
      ];
      clusters.forEach(c => {
        ctx.fillStyle = c.color;
        ctx.beginPath(); ctx.arc(x + c.dx, y + c.dy, c.r, 0, Math.PI * 2); ctx.fill();
      });
    }

    function drawPond(x, y, rx, ry) {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.5)';
      ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)'; ctx.lineWidth = 3; ctx.stroke();

      koiFish.forEach(fish => {
        fish.angle += 0.02;
        fish.x = x + Math.cos(fish.angle) * (rx * 0.5);
        fish.y = y + Math.sin(fish.angle) * (ry * 0.5);
        ctx.fillStyle = fish.color;
        ctx.beginPath(); ctx.ellipse(fish.x, fish.y, 7, 3, fish.angle, 0, Math.PI * 2); ctx.fill();
      });
    }

    function drawWoodenBridge(x, y, w, h) {
      ctx.fillStyle = '#78350f';
      ctx.fillRect(x - w / 2, y - h / 2, w, h);
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 2;
      for (let bx = x - w / 2; bx < x + w / 2; bx += 10) {
        ctx.strokeRect(bx, y - h / 2, 10, h);

    function drawToriiGate(x, y) {
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(x - 50, y - 50, 10, 70);
      ctx.fillRect(x + 40, y - 50, 10, 70);
      ctx.fillRect(x - 65, y - 50, 130, 12);

      ctx.fillRect(x - 68, y - 55, 136, 5);

    function drawLantern(x, y) {
      const glow = ctx.createRadialGradient(x, y, 2, x, y, 22);
      glow.addColorStop(0, 'rgba(253, 224, 71, 0.7)');
      glow.addColorStop(1, 'rgba(253, 224, 71, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(x, y, 22, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#f97316';
      ctx.beginPath(); ctx.roundRect(x - 8, y - 10, 16, 20, 4); ctx.fill();
      ctx.fillStyle = '#451a03';
      ctx.fillRect(x - 10, y - 13, 20, 3); ctx.fillRect(x - 10, y + 10, 20, 3);
    }

    function drawTeaTable(x, y) {
      ctx.fillStyle = '#92400e';
      ctx.beginPath(); ctx.ellipse(x, y, 28, 16, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fef08a';
      ctx.beginPath(); ctx.arc(x - 6, y - 2, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 6, y + 2, 4, 0, Math.PI * 2); ctx.fill();

    function drawArcadeCabinet(x, y, color, title) {
      ctx.fillStyle = '#0f172a';

    function drawDanceFloor(x, y, w, h) {
      const colors = ['#ec4899', '#8b5cf6', '#06b6d4', '#10b981'];
      let cIdx = 0;
      for (let dx = x - w / 2; dx < x + w / 2; dx += 20) {
        for (let dy = y - h / 2; dy < y + h / 2; dy += 20) {
          ctx.fillStyle = colors[(cIdx++) % colors.length];

          ctx.fillRect(dx, dy, 18, 18);

    // --- BOUNCY SLIME RENDERING ---
    function drawSlime(player, isSelf = false) {
      const { x, y, name, avatarType, direction, isMoving, isJumping, jumpOffset, speechBubble, activeEmote } = player;
      const type = AVATAR_TYPES[avatarType] || AVATAR_TYPES.sakura;

      ctx.save();

      player.bouncePhase = (player.bouncePhase || 0) + (isMoving ? 0.22 : 0.05);
      const groundBounce = isMoving ? Math.abs(Math.sin(player.bouncePhase)) * 8 : Math.sin(player.bouncePhase) * 2;
      const drawY = y - groundBounce - (jumpOffset || 0);

      let scaleX = 1;
      let scaleY = 1;
      if (isJumping) {
        scaleX = 0.82; scaleY = 1.22;
      } else if (isMoving) {
        scaleX = 1 + Math.sin(player.bouncePhase) * 0.12;
        scaleY = 1 - Math.sin(player.bouncePhase) * 0.12;
      }

      ctx.translate(x, drawY);

      // Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.beginPath();
      const shadowSize = Math.max(5, 16 - (jumpOffset || 0) * 0.2);
      ctx.ellipse(0, y - drawY + 14, shadowSize, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.scale(scaleX, scaleY);

      // Slime Jelly Body
      ctx.fillStyle = type.bodyColor;
      ctx.beginPath();
      ctx.arc(0, 0, 18, Math.PI * 0.82, Math.PI * 2.18);
      ctx.quadraticCurveTo(0, 20, -18, 0);
      ctx.fill();

      // Shiny Top Highlight
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.beginPath();
      ctx.ellipse(-5, -8, 6, 3, -Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Eyes & Blush
      let eyeOffsetX = (direction === 'left') ? -4 : (direction === 'right') ? 4 : 0;
      if (direction !== 'up') {
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.ellipse(-5 + eyeOffsetX, -2, 2, 2.5, 0, 0, Math.PI * 2);
        ctx.ellipse(5 + eyeOffsetX, -2, 2, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(244, 114, 182, 0.7)';
        ctx.beginPath();
        ctx.ellipse(-8 + eyeOffsetX, 2, 3, 1.5, 0, 0, Math.PI * 2);
        ctx.ellipse(8 + eyeOffsetX, 2, 3, 1.5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Slime Accessory
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(type.accessory, 0 + eyeOffsetX, -18);

      ctx.restore();

      // Self Ring Indicator
      if (isSelf) {
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(x, y + 14, 18, 7, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Name Badge
      ctx.font = 'bold 10px "Plus Jakarta Sans", sans-serif';
      const nameWidth = ctx.measureText(name).width + 12;
      ctx.fillStyle = isSelf ? '#ec4899' : 'rgba(255, 255, 255, 0.95)';
      ctx.beginPath();
      ctx.roundRect(x - nameWidth / 2, drawY + 20, nameWidth, 16, 8);
      ctx.fill();

      ctx.fillStyle = isSelf ? '#ffffff' : '#831843';
      ctx.textAlign = 'center';
      ctx.fillText(name, x, drawY + 31);

      // Emote & Speech Bubbles
      if (activeEmote && activeEmote.expiresAt > Date.now()) {
        ctx.font = '20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(activeEmote.emoji, x, drawY - 40);
      }

      if (speechBubble && speechBubble.expiresAt > Date.now()) {
        drawSpeechBubble(x, drawY - 30, speechBubble.text);
      }
    }

    function drawSpeechBubble(x, y, text) {
      ctx.font = '600 11px "Plus Jakarta Sans", sans-serif';
      const bubbleWidth = Math.min(140, ctx.measureText(text).width + 16);
      const bubbleHeight = 22;
      const bubbleX = x - bubbleWidth / 2;
      const bubbleY = y - bubbleHeight;

      ctx.fillStyle = 'rgba(255, 255, 255, 0.98)';
      ctx.beginPath(); ctx.roundRect(bubbleX, bubbleY, bubbleWidth, bubbleHeight, 10); ctx.fill();
      ctx.strokeStyle = '#ec4899'; ctx.lineWidth = 1.5; ctx.stroke();

      ctx.fillStyle = '#831843'; ctx.textAlign = 'center';
      ctx.fillText(text, x, bubbleY + 15);
    }

    // --- CONTROLS & PHYSICS ---
    function triggerJump() {
      if (!localPlayer.isJumping) {
        localPlayer.isJumping = true;
        localPlayer.jumpVelocity = 11;
        playSound('jump');
      }
    }

    function updatePlayerMovement() {
      let dx = 0; let dy = 0;
      if (keys.up) dy -= 1;
      if (keys.down) dy += 1;
      if (keys.left) dx -= 1;
      if (keys.right) dx += 1;

      if (joystick.active) { dx = joystick.dx; dy = joystick.dy; }

      if (localPlayer.isJumping) {
        localPlayer.jumpOffset = (localPlayer.jumpOffset || 0) + localPlayer.jumpVelocity;
        localPlayer.jumpVelocity -= 0.8;
        if (localPlayer.jumpOffset <= 0) {
          localPlayer.jumpOffset = 0;
          localPlayer.isJumping = false;
          playSound('bounce');
        }
      }

      const prevMoving = localPlayer.isMoving;

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        localPlayer.x += (dx / len) * localPlayer.speed;
        localPlayer.y += (dy / len) * localPlayer.speed;
        localPlayer.targetX = localPlayer.x;
        localPlayer.targetY = localPlayer.y;
        localPlayer.isMoving = true;
        localPlayer.direction = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      } else {
        const distX = localPlayer.targetX - localPlayer.x;
        const distY = localPlayer.targetY - localPlayer.y;
        const distance = Math.hypot(distX, distY);

        if (distance > 4) {
          localPlayer.x += (distX / distance) * localPlayer.speed;
          localPlayer.y += (distY / distance) * localPlayer.speed;
          localPlayer.isMoving = true;
          localPlayer.direction = Math.abs(distX) > Math.abs(distY) ? (distX > 0 ? 'right' : 'left') : (distY > 0 ? 'down' : 'up');
        } else {
          localPlayer.isMoving = false;
        }
      }

      if (!prevMoving && localPlayer.isMoving) playSound('bounce');

      localPlayer.x = Math.max(20, Math.min(canvas.width - 20, localPlayer.x));
      localPlayer.y = Math.max(20, Math.min(canvas.height - 20, localPlayer.y));

      if (activeMiniGame) checkMiniGameCollisions();
      if (localPlayer.isMoving && realtimeChannel) broadcastState();
    }

    // --- MINI-GAME SYSTEM ---
    function startMiniGame(type) {
      activeMiniGame = type;
      miniGameScore = 0;
      miniGameTimeLeft = 30;

      document.getElementById('minigame-banner').classList.remove('hidden');
      document.getElementById('minigame-score').textContent = miniGameScore;
      document.getElementById('minigame-timer').textContent = miniGameTimeLeft + 's';

      if (type === 'petal-catch') {
        document.getElementById('minigame-title').textContent = '🌸 Petal Catch';
        spawnPetalCollectibles();
      } else if (type === 'shrine-dash') {
        document.getElementById('minigame-title').textContent = '⛩️ Shrine Dash';
        switchChannel('sakura-lounge');
        spawnPetalCollectibles();
      }

      clearInterval(miniGameInterval);
      miniGameInterval = setInterval(() => {
        miniGameTimeLeft--;
        document.getElementById('minigame-timer').textContent = miniGameTimeLeft + 's';
        if (gameCollectibles.length < 8) spawnPetalCollectibles(1);
        if (miniGameTimeLeft <= 0) endMiniGame(false);
      }, 1000);
    }

    function spawnPetalCollectibles(count = 6) {
      for (let i = 0; i < count; i++) {
        gameCollectibles.push({
          x: Math.random() * (canvas.width - 60) + 30,
          y: Math.random() * (canvas.height - 60) + 30,
          type: Math.random() > 0.2 ? '🌸' : '⭐'
        });
      }
    }

    function checkMiniGameCollisions() {
      for (let i = gameCollectibles.length - 1; i >= 0; i--) {
        const item = gameCollectibles[i];
        if (Math.hypot(localPlayer.x - item.x, localPlayer.y - item.y) < 28) {
          playSound('win');
          addFloatingParticle(item.x, item.y, '+10');
          miniGameScore += (item.type === '⭐' ? 25 : 10);
          document.getElementById('minigame-score').textContent = miniGameScore;
          gameCollectibles.splice(i, 1);
        }
      }
    }

    function drawMiniGameCollectibles() {
      gameCollectibles.forEach(item => {
        ctx.font = '20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(item.type, item.x, item.y);
      });
    }

    function endMiniGame(manualQuit = false) {
      clearInterval(miniGameInterval);
      document.getElementById('minigame-banner').classList.add('hidden');
      if (!manualQuit) {
        playSound('win');
        triggerEmote('🎉');
      }
      activeMiniGame = null;
      gameCollectibles = [];
    }

    // Arcade Matching Game Popup
    function openArcadeMemoryGame() {
      const grid = document.getElementById('memory-grid');
      grid.innerHTML = '';
      const icons = ['🌸', '🍵', '👑', '🐱', '🌸', '🍵', '👑', '🐱'];
      icons.sort(() => Math.random() - 0.5);

      let firstCard = null;
      let matchedCount = 0;

      icons.forEach(icon => {
        const btn = document.createElement('button');
        btn.className = 'h-12 rounded-xl bg-pink-200 text-transparent text-lg font-bold transition flex items-center justify-center border border-pink-300 shadow-sm';
        btn.textContent = icon;

        btn.onclick = () => {
          if (btn.classList.contains('bg-white')) return;
          btn.className = 'h-12 rounded-xl bg-white text-lg font-bold transition flex items-center justify-center border-2 border-pink-500 shadow-sm';

          if (!firstCard) {
            firstCard = { btn, icon };
          } else {
            if (firstCard.icon === icon) {
              playSound('win');
              matchedCount += 2;
              firstCard = null;
              if (matchedCount === icons.length) {
                document.getElementById('memory-status').textContent = '🎉 Winner! All Matched!';
              }
            } else {
              setTimeout(() => {
                btn.className = 'h-12 rounded-xl bg-pink-200 text-transparent text-lg font-bold transition flex items-center justify-center border border-pink-300 shadow-sm';
                firstCard.btn.className = 'h-12 rounded-xl bg-pink-200 text-transparent text-lg font-bold transition flex items-center justify-center border border-pink-300 shadow-sm';
                firstCard = null;
              }, 500);
            }
          }
        };
        grid.appendChild(btn);
      });
      document.getElementById('arcade-card-modal').classList.remove('hidden');
    }

    function closeArcadeMemoryGame() {
      document.getElementById('arcade-card-modal').classList.add('hidden');
    }

    // MAIN GAME LOOP
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawEnvironment();
      updateAndDrawPetals();

      if (activeMiniGame) drawMiniGameCollectibles();

      // Remote Players
      Object.values(remotePlayers).forEach(p => drawSlime(p, false));

      // Local Player
      updatePlayerMovement();
      drawSlime(localPlayer, true);

      // Particles
      updateAndDrawParticles();

      requestAnimationFrame(render);
    }

    // --- REALTIME SUPABASE SYSTEM ---
    async function initSupabaseChannel(channelName) {
      if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);

      currentChannel = channelName;
      document.getElementById('room-indicator').textContent = '#' + channelName;

      realtimeChannel = supabaseClient.channel(`room_${channelName}`, {
        config: { presence: { key: localPlayer.id } }
      });

      realtimeChannel
        .on('presence', { event: 'sync' }, () => {
          const state = realtimeChannel.presenceState();
          remotePlayers = {};
          let count = 1;
          Object.keys(state).forEach(key => {
            if (key !== localPlayer.id && state[key][0]) {
              remotePlayers[key] = state[key][0];
              count++;
            }
          });
          document.getElementById('player-count').textContent = count;
        })
        .on('broadcast', { event: 'player-move' }, payload => {
          const p = payload.payload;
          if (p.id !== localPlayer.id) remotePlayers[p.id] = { ...remotePlayers[p.id], ...p };
        })
        .on('broadcast', { event: 'chat-message' }, payload => {
          const msg = payload.payload;
          saveChatMessageToMemory(msg.channel || currentChannel, msg);
          if ((msg.channel || currentChannel) === currentChannel) {
            displayChatMessage(msg);
            playSound('msg');
          }
          if (msg.playerId === localPlayer.id) {
            localPlayer.speechBubble = { text: msg.content, expiresAt: Date.now() + 6000 };
          } else if (remotePlayers[msg.playerId]) {
            remotePlayers[msg.playerId].speechBubble = { text: msg.content, expiresAt: Date.now() + 6000 };
          }
        })
        .on('broadcast', { event: 'player-emote' }, payload => {
          const data = payload.payload;
          if (remotePlayers[data.playerId]) {
            remotePlayers[data.playerId].activeEmote = { emoji: data.emoji, expiresAt: Date.now() + 3000 };
            addFloatingParticle(remotePlayers[data.playerId].x, remotePlayers[data.playerId].y, data.emoji);
          }
        })
        .subscribe(async status => {
          if (status === 'SUBSCRIBED') {
            await realtimeChannel.track({
              id: localPlayer.id,
              name: localPlayer.name,
              avatarType: localPlayer.avatarType,
              x: localPlayer.x,
              y: localPlayer.y,
              direction: localPlayer.direction
            });
          }
        });

      renderChatLogForChannel(channelName);
    }

    function saveChatMessageToMemory(channel, msg) {
      if (!chatMemory[channel]) chatMemory[channel] = [];
      chatMemory[channel].push(msg);
      if (chatMemory[channel].length > 40) chatMemory[channel].shift();
      try { localStorage.setItem(`chat_${channel}`, JSON.stringify(chatMemory[channel])); } catch(e) {}
    }

    function renderChatLogForChannel(channel) {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      const messages = chatMemory[channel] || [];
      if (messages.length === 0) {
        container.innerHTML = `<div class="text-center text-[10px] text-pink-300 my-4 italic">Welcome to #${channel}! Chat with slimes 🌸</div>`;
        return;
      }
      messages.forEach(msg => displayChatMessage(msg));
    }

    function broadcastState() {
      if (!realtimeChannel) return;
      realtimeChannel.send({
        type: 'broadcast',
        event: 'player-move',
        payload: {
          id: localPlayer.id,
          name: localPlayer.name,
          avatarType: localPlayer.avatarType,
          x: localPlayer.x,
          y: localPlayer.y,
          direction: localPlayer.direction,
          isMoving: localPlayer.isMoving
        }
      });
    }

    function triggerEmote(emoji) {
      playSound('emote');
      localPlayer.activeEmote = { emoji: emoji, expiresAt: Date.now() + 3000 };
      addFloatingParticle(localPlayer.x, localPlayer.y, emoji);

      if (realtimeChannel) {
        realtimeChannel.send({
          type: 'broadcast',
          event: 'player-emote',
          payload: { playerId: localPlayer.id, emoji: emoji }
        });
      }
    }

    document.getElementById('chat-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const msgObj = {
        playerId: localPlayer.id,
        sender: localPlayer.name,
        content: text,
        time: timeStr,
        channel: currentChannel
      };

      playSound('msg');
      localPlayer.speechBubble = { text: text, expiresAt: Date.now() + 6000 };

      saveChatMessageToMemory(currentChannel, msgObj);
      displayChatMessage(msgObj);

      if (realtimeChannel) {
        realtimeChannel.send({ type: 'broadcast', event: 'chat-message', payload: msgObj });
      }
    });

    function displayChatMessage(msg) {
      const container = document.getElementById('chat-messages');
      const isSelf = msg.sender === localPlayer.name;

      const msgDiv = document.createElement('div');
      msgDiv.className = `flex flex-col ${isSelf ? 'items-end' : 'items-start'} space-y-0.5 animate-in fade-in`;

      msgDiv.innerHTML = `
        <div class="flex items-center gap-1 px-1">
          <span class="text-[10px] font-bold text-pink-200">${escapeHtml(msg.sender)}</span>
          <span class="text-[8px] text-pink-400">${msg.time || ''}</span>
        </div>
        <div class="px-3 py-1.5 rounded-2xl text-xs max-w-[88%] shadow-sm ${
          isSelf ? 'bg-pink-500 text-white rounded-tr-none' : 'bg-white/95 text-pink-950 rounded-tl-none font-medium'
        }">
          ${escapeHtml(msg.content)}
        </div>
      `;

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div'); div.innerText = text; return div.innerHTML;
    }

    // --- CONTROLS & LISTENERS ---
    window.addEventListener('keydown', e => {
      if (document.activeElement.tagName === 'INPUT') return;
      if (e.key === ' ' || e.key === 'Spacebar') { triggerJump(); return; }
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    });

    // Mobile Joystick Logic
    const joystickBase = document.getElementById('joystick-container');
    const joystickStick = document.getElementById('joystick-stick');

    if (joystickBase) {
      joystickBase.addEventListener('touchstart', e => { e.preventDefault(); joystick.active = true; updateJoystickPos(e.touches[0]); }, { passive: false });
      joystickBase.addEventListener('touchmove', e => { e.preventDefault(); if (joystick.active) updateJoystickPos(e.touches[0]); }, { passive: false });
      joystickBase.addEventListener('touchend', e => { e.preventDefault(); joystick.active = false; joystick.dx = 0; joystick.dy = 0; joystickStick.style.transform = `translate(0px, 0px)`; }, { passive: false });
    }

    function updateJoystickPos(touch) {
      const rect = joystickBase.getBoundingClientRect();
      let dx = touch.clientX - (rect.left + rect.width / 2);
      let dy = touch.clientY - (rect.top + rect.height / 2);
      const dist = Math.hypot(dx, dy);
      const maxDist = rect.width / 2 - 8;

      if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
      joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
      joystick.dx = dx / maxDist; joystick.dy = dy / maxDist;
    }

    // Canvas Tap Navigation & Arcade Machine Interaction
    canvas.addEventListener('pointerdown', e => {
      if (e.target !== canvas) return;
      const rect = canvas.getBoundingClientRect();
      localPlayer.targetX = e.clientX - rect.left;
      localPlayer.targetY = e.clientY - rect.top;

      if (currentChannel === 'arcade-lounge' && localPlayer.targetY < canvas.height * 0.35) {
        openArcadeMemoryGame();
      }
    });

    function switchChannel(channelName) {
      if (currentChannel === channelName) return;

      document.querySelectorAll('.chan-btn, .quick-chan-btn').forEach(btn => {
        btn.classList.remove('bg-pink-500', 'text-white', 'shadow-sm');
        btn.classList.add('text-pink-200', 'text-pink-800');
      });

      const activeBtn = document.getElementById(`chan-btn-${channelName}`);
      const quickBtn = document.getElementById(`quick-btn-${channelName}`);
      
      if (activeBtn) activeBtn.classList.add('bg-pink-500', 'text-white', 'shadow-sm');
      if (quickBtn) quickBtn.classList.add('bg-pink-500', 'text-white', 'shadow-sm');

      initSupabaseChannel(channelName);
    }

    // CUSTOMIZATION SETTINGS
    function renderAvatarPicker() {
      const picker = document.getElementById('avatar-picker');
      picker.innerHTML = Object.keys(AVATAR_TYPES).map(key => {
        const type = AVATAR_TYPES[key];
        const isSelected = localPlayer.avatarType === key;
        return `
          <div 
            onclick="selectAvatarType('${key}')"
            class="p-2.5 rounded-2xl border cursor-pointer transition flex items-center gap-2 ${
              isSelected ? 'border-pink-500 bg-pink-100/90 shadow-sm' : 'border-pink-200 hover:bg-white/80'
            }"
          >
            <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs shadow-sm shrink-0" style="background-color: ${type.bodyColor}">
              ${type.accessory}
            </div>
            <span class="text-[11px] font-bold text-pink-900">${type.name}</span>
          </div>
        `;
      }).join('');
    }

    function selectAvatarType(key) {
      localPlayer.avatarType = key;
      renderAvatarPicker();
    }

    function toggleSettingsModal() {
      const modal = document.getElementById('settings-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        document.getElementById('setting-username').value = localPlayer.name;
        renderAvatarPicker();
      }
    }

    function saveAvatarSettings() {
      const newName = document.getElementById('setting-username').value.trim();
      if (newName) {
        localPlayer.name = newName;
        localStorage.setItem('sakura_avatar_name', localPlayer.name);
      }
      localStorage.setItem('sakura_avatar_type', localPlayer.avatarType);

      if (realtimeChannel) {
        realtimeChannel.track({
          id: localPlayer.id,
          name: localPlayer.name,
          avatarType: localPlayer.avatarType,
          x: localPlayer.x,
          y: localPlayer.y
        });
      }
      toggleSettingsModal();
    }

    function toggleChatSidebar() {
      document.getElementById('chat-sidebar').classList.toggle('translate-x-full');
    }

    // INITIALIZATION
    window.addEventListener('resize', resizeCanvas);

    window.addEventListener('load', async () => {
      lucide.createIcons();
      resizeCanvas();
      initEnvironmentElements();

      localPlayer.x = canvas.width / 2;
      localPlayer.y = canvas.height / 2 + 30;
      localPlayer.targetX = localPlayer.x;
      localPlayer.targetY = localPlayer.y;

      const { data } = await supabaseClient.auth.getSession();
      if (data?.session?.user) {
        const user = data.session.user;
        const dispName = user.user_metadata?.display_name || user.email.split('@')[0];
        completeUserLogin(user, dispName);
      }

      requestAnimationFrame(render);
    });
  </script>
